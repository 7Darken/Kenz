<!doctype html>
<!--
  Kenz — page projet (V6, maquette unique). Un seul gabarit, rempli selon le hash : #oshii #sago #wado #croc #miru #zenko (sans hash : Oshii).
  #escapades-libres : le projet d'équipe web (or #E3A21A), même gabarit avec un motif au lieu de l'icône, « Mon rôle » au lieu de
  « L'IA, en clair », un chapitre « 54 heures » en plus ; hors de la chaîne des apps (sa suite est Oshii).
  Base commune : shared/theme.css + shared/theme.js (jetons clair / sombre, bouton soleil / lune, aura, fil, arche, loupe).
  La lumière du thème (--lum : aura, fil, arches, loupe) prend la couleur de l'app : sa lumière en sombre, sa teinte en clair.
  Le récit en 7 chapitres (data-chapitre : un nœud sur le rail du fil) : l'arrivée sous une arche de lumière dans la couleur de l'app
  → le problème → comment ça marche → l'IA en clair (+ « Sous le capot ») → en vrai (captures en bento, loupe) → l'action → l'histoire suivante.
  Ordinateur (≥ 900 × 600, sans mouvement réduit) : « Comment ça marche » est épinglé ; les trois temps glissent à l'horizontale
  le long du fil, et chaque nœud qui passe fait avancer l'animation.
  Mobile et mouvement réduit : aucun épinglage ni défilement horizontal, l'animation se joue à l'entrée à l'écran.
  Changement d'histoire : ScrollTrigger (matchMedia.revert), observateurs et loupes sont détachés puis recréés ; le fil est remesuré.
  Transitions : shared/passage.* et shared/cordon.* (contrat de la section 3 du brief V4). La page marche sans eux.
-->
<html lang="fr" data-univers="pro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>location.hash.indexOf('porte')>-1&&document.documentElement.setAttribute('data-porte-arrivee','1')</script>
<title>Kenz — Oshii</title>
<meta name="description" content="Une app de Kenz racontée en entier : le problème, comment ça marche, ce que fait l'IA, et l'app en vrai.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E1220">
<script>
  /* Avant le premier rendu : la couleur de l'app choisie par le hash (pas de flash), et un garde-fou si le JS échoue */
  (function () {
    var d = document.documentElement, h = (location.hash || '').toLowerCase(), s = 'oshii';
    /* teinte (aplat), teinte « r g b », lumière (sombre), lumière « r g b », foncé (texte AA sur le clair), nom */
    var T = {
      oshii: ['#E5483B', '229 72 59', '#FF9384', '255 147 132', '#B8322A', 'Oshii'],
      sago: ['#5B4BC4', '91 75 196', '#B3A8FF', '179 168 255', '#4A3BB0', 'Sago'],
      wado: ['#2F7A55', '47 122 85', '#8ADBAE', '138 219 174', '#24684A', 'Wado'],
      croc: ['#8E7CF0', '142 124 240', '#CBC1FF', '203 193 255', '#6A55D8', 'Croc'],
      miru: ['#4B5FD6', '75 95 214', '#A7B3FF', '167 179 255', '#3B4EC0', 'Miru'],
      zenko: ['#A0613A', '160 97 58', '#EDB78E', '237 183 142', '#8A4F2C', 'Zenko'],
      /* Projet d'équipe (web), hors de la chaîne des apps : on y arrive par la section 54 heures ou par le hash ; la suite est Oshii */
      'escapades-libres': ['#E3A21A', '227 162 26', '#F2BE4E', '242 190 78', '#8A5E0A', 'Escapades Libres'] };
    var O = ['oshii', 'sago', 'wado', 'croc', 'miru', 'zenko'];
    for (var k in T) { if (h.indexOf(k) > -1) { s = k; break; } }
    /* La couleur de l'app (et celle de l'histoire suivante) sur <html> */
    window.__kzTeindre = function (a) {
      var t = T[a], n = T[O[(O.indexOf(a) + 1) % O.length]];
      d.setAttribute('data-app', a);
      ['--teinte', '--teinte-rgb', '--lumiere', '--lumiere-rgb', '--fonce'].forEach(function (p, i) { d.style.setProperty(p, t[i]); });
      d.style.setProperty('--nx-rgb', n[1]);
      d.style.setProperty('--nx-l', n[2]);
      d.style.setProperty('--nx-f', n[4]);
      document.title = 'Kenz — ' + t[5];
    };
    window.__kzTeindre(s);
    /* Arrivée par l'élément partagé (l'icône de l'app) : l'aplat montre l'icône au centre dès le premier rendu */
    try {
      var kp = JSON.parse(sessionStorage.getItem('kz-passage') || 'null');
      if (kp && kp.icone && Date.now() - (+kp.t || 0) < 6000) {
        d.classList.add('kz-passage-icone');
        d.style.setProperty('--kz-pi', 'url("' + String(kp.icone).replace(/"/g, '') + '")');
        d.style.setProperty('--kz-pt', (+kp.taille || 112) + 'px');
      }
    } catch (e) {}
    d.classList.add('js');
    try { history.scrollRestoration = 'manual'; } catch (e) {}
    window.__kzFallback = setTimeout(function () { d.classList.remove('js'); d.classList.add('is-arrived'); }, 5000);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="assets/melodrama.css">
<link rel="stylesheet" href="shared/theme.css">
<script src="shared/theme.js"></script>
<style>
/* =========================================================
   Jetons propres à la page (le reste vient de shared/theme.css)
   La lumière du thème prend la couleur de l'app : sa lumière en sombre, sa teinte en clair.
   ========================================================= */
:root{
  --teinte:#E5483B;
  --teinte-rgb:229 72 59;
  --lumiere:#FF9384;
  --lumiere-rgb:255 147 132;
  --fonce:#B8322A;
  --nx-rgb:91 75 196;
  --nx-l:#B3A8FF;
  --nx-f:#4A3BB0;
  --lum:var(--lumiere-rgb);
  --lum-2:var(--teinte-rgb);
  --accent:var(--lumiere);
  --nx-c:var(--nx-l);
}
:root[data-theme="light"]{
  --lum:var(--teinte-rgb);
  --lum-2:var(--lumiere-rgb);
  --word-c:var(--fonce);
  --accent:var(--fonce);
  --nx-c:var(--nx-f);
}

/* =========================================================
   Base propre à la page
   ========================================================= */
.top-sentinel{position:absolute; top:0; left:0; width:1px; height:80px; pointer-events:none}
main{overflow-x:clip}

/* La couleur de l'app qui remplit l'écran à l'arrivée, puis se rétracte dans l'icône */
.flood{position:fixed; inset:0; z-index:80; display:none; background:var(--flood, var(--teinte)); pointer-events:none}
.js .flood{display:block}
.js .flood.is-off,[data-porte-arrivee] .flood{display:none}
/* Arrivée par l'élément partagé : la même lumière et la même icône que le voile du passage (aucun saut) */
.kz-passage-icone .flood::before{content:""; position:absolute; inset:0; background:radial-gradient(80% 70% at 50% 42%, rgb(255 255 255 / .07), transparent 70%), linear-gradient(180deg, transparent 55%, rgb(0 0 0 / .14))}
.kz-passage-icone .flood::after{content:""; position:absolute; left:50%; top:50%; width:var(--kz-pt); height:var(--kz-pt); margin:calc(var(--kz-pt) / -2) 0 0 calc(var(--kz-pt) / -2);
  border-radius:22.5%; background:var(--kz-pi) center / cover no-repeat; box-shadow:0 0 0 1px rgb(255 255 255 / .18), 0 26px 54px -20px rgb(0 0 0 / .5)}

/* Typo propre au récit (les briques communes viennent du thème) */
.h2{width:fit-content; max-width:100%; margin:0; font-family:var(--f-title); font-weight:600; font-size:clamp(46px,6.4vw,100px); line-height:.92; letter-spacing:-.01em}
.say{margin:0; font-size:clamp(32px,4.6vw,68px); line-height:1.06; letter-spacing:-.035em; font-weight:500; text-wrap:balance}
.word{text-shadow:var(--glow)}
.link::after{content:""; position:absolute; left:2px; right:2px; bottom:10px; height:1px; background:currentColor; opacity:.5; transition:opacity .4s}
.link:hover::after{opacity:1}

/* Gestes propres à la page : le titre en balayage, les mots du problème allumés au défilement */
.js [data-words].is-scrub .w{filter:none; transform:none; transition:none}
.js [data-sweep]{clip-path:inset(-15% 100% -25% -3%); filter:blur(12px); transition:clip-path .24s var(--out), filter .24s var(--out)}
.js [data-sweep].is-in{clip-path:inset(-15% -3% -25% -3%); filter:none; transition:clip-path 1.4s var(--expo) var(--wd, 0s), filter 1.2s var(--expo) var(--wd, 0s)}

/* =========================================================
   Navigation : le logo mène à l'accueil (son point est le cordon), le bouton de mode, « Essayer »
   ========================================================= */
.nav__app{position:relative; display:inline-flex; align-items:center; gap:10px; height:46px; padding:0 18px 0 6px; border-radius:999px; font-size:14px; font-weight:500; white-space:nowrap; color:var(--fg);
  background:var(--cta-bg); box-shadow:inset 0 0 0 1px var(--ghost-line); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); isolation:isolate; transition:transform .5s var(--expo)}
.nav__app::before{content:""; position:absolute; inset:0; z-index:-1; border-radius:inherit; background:var(--ghost-hover); opacity:0; transition:opacity .4s var(--expo)}
.nav__app:hover::before{opacity:1}
.nav__app:active{transform:scale(.98)}
.nav__app img{width:34px; height:34px; border-radius:10px; box-shadow:0 0 0 1px rgba(255,255,255,.1); transition:transform .7s var(--expo)}
.nav__app:hover img{transform:scale(1.06)}
html[data-theme="light"] .nav__app{background:rgba(255,255,255,.74); box-shadow:inset 0 0 0 1px var(--line-2),0 10px 22px -12px rgba(26,25,24,.35)}
html[data-theme="light"] .nav__app::before{background:#fff}
html[data-theme="light"] .nav__app img{box-shadow:0 0 0 1px rgba(26,25,24,.06),0 4px 10px -4px rgba(26,25,24,.35)}
.js .nav__in{opacity:0}
.is-arrived .nav__in{opacity:1; transition:opacity 1.2s var(--expo) 1.4s}
@media (max-width:600px){ .nav__app{height:44px; padding-right:16px; font-size:13.5px} }

/* =========================================================
   1. L'arrivée : la couleur se rétracte dans l'icône, sous une arche de lumière que le fil dessine
   ========================================================= */
.arr{position:relative; display:grid; place-items:center; min-height:100vh; min-height:100svh; overflow:hidden; isolation:isolate; padding:calc(env(safe-area-inset-top) + 88px) var(--gr) 112px var(--gl); text-align:center}
.arr__light{position:absolute; inset:0; z-index:-2;
  background:radial-gradient(38% 34% at 50% 30%, rgb(var(--teinte-rgb) / .3), transparent 72%), radial-gradient(75% 46% at 50% 112%, rgb(var(--teinte-rgb) / .3), transparent 70%), linear-gradient(180deg, var(--hero-bg), rgb(var(--fg-rgb) / 0) 72%)}
html[data-theme="light"] .arr__light{
  background:radial-gradient(42% 36% at 50% 30%, rgb(var(--teinte-rgb) / .1), transparent 72%), radial-gradient(75% 46% at 50% 112%, rgb(var(--teinte-rgb) / .12), transparent 70%), linear-gradient(180deg, #ECEFF0, rgba(245,243,239,0) 72%)}
/* L'arche : sa lumière (couleur de l'app) monte du sol, puis le fil la dessine */
.arr__arche{position:absolute; left:50%; bottom:0; z-index:-1; height:min(82vh, 760px, 128vw); height:min(82svh, 760px, 128vw); translate:-50% 0; pointer-events:none; --arche-ecart:26px}
.arr__arche.kz-arche--lumiere::before{background:radial-gradient(70% 52% at 50% 34%, rgb(var(--teinte-rgb) / .5), rgb(var(--teinte-rgb) / .14) 60%, rgb(var(--teinte-rgb) / 0) 86%);
  -webkit-mask-image:linear-gradient(180deg, #000 52%, transparent); mask-image:linear-gradient(180deg, #000 52%, transparent)}
html[data-theme="light"] .arr__arche.kz-arche--lumiere::before{
  background:radial-gradient(62% 44% at 50% 30%, rgba(255,255,255,.96), rgba(255,255,255,.55) 56%, rgba(255,255,255,0) 84%), radial-gradient(84% 62% at 50% 28%, rgb(var(--teinte-rgb) / .16), rgb(var(--teinte-rgb) / 0) 82%)}
.arr__arche .kz-arche__sol{left:-34%; right:-34%}
.js .arr__arche::before{opacity:0; transform:scaleY(.55); transform-origin:50% 100%}
.is-arrived .arr__arche::before{opacity:1; transform:none; transition:opacity 1.6s var(--expo) .75s, transform 2.2s var(--expo) .75s}
.js .arr__arche:not(.is-trace) .kz-arche__sol{transform:scaleX(0)}
.arr__arche.is-trace .kz-arche__fil{transition-duration:2.6s; transition-delay:.95s}
.arr__arche.is-trace .kz-arche__ombre{transition-duration:3s; transition-delay:1.25s}
.arr__arche.is-trace .kz-arche__sol{transition-delay:.8s}
.arr__in{display:flex; flex-direction:column; align-items:center; gap:clamp(18px,2.6vh,30px)}
.arr__ico{width:clamp(96px,11vw,150px); aspect-ratio:1; border-radius:23%;
  box-shadow:0 0 0 1px rgba(255,255,255,.12), 0 34px 70px -26px rgb(var(--teinte-rgb) / .85), 0 14px 26px -12px rgba(0,0,0,.6)}
html[data-theme="light"] .arr__ico{box-shadow:0 0 0 1px rgba(26,25,24,.06), 0 34px 70px -26px rgb(var(--teinte-rgb) / .7), 0 14px 26px -12px rgba(26,25,24,.3)}
.arr__nom{position:relative; margin:0; font-family:var(--f-title); font-weight:600; font-size:min(28vw, 290px, 32vh); line-height:.84; letter-spacing:-.02em; color:var(--fg)}
.ttl{display:block}
.ttl--ghost{position:absolute; inset:0; filter:blur(14px); opacity:0; pointer-events:none}
.arr__line{max-width:31ch; font-size:clamp(18px,1.6vw,23px); line-height:1.45; color:rgb(var(--fg-rgb) / .94); text-wrap:balance; --wd:1.3s}
.arr__cue{position:absolute; left:50%; bottom:calc(26px + env(safe-area-inset-bottom)); translate:-50% 0; display:grid; place-items:center; width:48px; height:48px; border-radius:50%; color:var(--fg); background:var(--ghost-bg);
  box-shadow:inset 0 0 0 1px rgb(var(--lum) / .5), 0 0 22px -6px rgb(var(--lum) / .8); transition:background-color .4s var(--expo)}
.arr__cue:hover{background-color:var(--ghost-hover)}
html[data-theme="light"] .arr__cue{background-color:rgba(255,255,255,.72); box-shadow:inset 0 0 0 1px rgb(var(--lum) / .35), 0 8px 18px -10px rgba(26,25,24,.35)}
html[data-theme="light"] .arr__cue:hover{background-color:#fff}
.arr__cue svg{width:16px; height:16px}
@keyframes kzFade{from{opacity:0} to{opacity:1}}
@keyframes ttlMain{0%{clip-path:inset(-25% 100% -30% -8%); filter:blur(10px)} 100%{clip-path:inset(-25% -8% -30% -8%); filter:none}}
@keyframes ttlGhost{0%{clip-path:inset(-25% 100% -30% -8%); opacity:.9} 65%{clip-path:inset(-25% -8% -30% -8%); opacity:.45} 100%{clip-path:inset(-25% -8% -30% -8%); opacity:0}}
.js .arr__light{opacity:0}
.is-arrived .arr__light{opacity:1; transition:opacity 1.6s var(--expo) .15s}
.js .arr__ico{opacity:0; transform:scale(1.04)}
.is-arrived .arr__ico{opacity:1; transform:none; transition:opacity .3s linear .82s, transform 1.3s var(--expo) 1.05s}
.js .ttl--main{clip-path:inset(-25% 100% -30% -8%)}
.is-arrived .ttl--main{animation:ttlMain 1.6s var(--expo) 1s both}
.is-arrived .ttl--ghost{animation:ttlGhost 1.4s var(--expo) .86s both}
.js .arr__cue{opacity:0}
.is-arrived .arr__cue{opacity:1; transition:opacity 1s var(--expo) 2.2s, background-color .4s var(--expo)}

/* =========================================================
   2. Le problème : une phrase, un écran
   ========================================================= */
.pbm{position:relative; display:flex; align-items:center; min-height:100vh; min-height:100svh; padding:var(--sec) 0}
.pbm__t{max-width:21ch; margin:0; font-size:clamp(38px,6vw,100px); line-height:1.02; letter-spacing:-.045em; font-weight:500; text-wrap:balance}
.pbm__cap{margin-top:clamp(26px,3vw,40px); max-width:40ch}

/* =========================================================
   3. Comment ça marche : la grande animation, en 3 temps légendés
   ========================================================= */
.how{position:relative; padding:var(--sec) 0; background:radial-gradient(48% 42% at 68% 52%, rgb(var(--teinte-rgb) / .1), transparent 72%)}
html[data-theme="light"] .how{background:radial-gradient(48% 42% at 68% 52%, rgb(var(--teinte-rgb) / .07), transparent 72%)}
.how__in{display:grid; grid-template-areas:"t" "s" "l"; gap:clamp(28px,5vw,44px); align-items:center}
.how__t{grid-area:t; font-size:clamp(44px,5vw,84px)}
.how__stage{grid-area:s; min-width:0}
.how__win,.how__track{display:contents}
.temps{grid-area:l; display:grid; gap:clamp(12px,1.6vw,22px)}
.temps li{position:relative; padding-left:30px; font-size:clamp(20px,2.1vw,32px); line-height:1.2; letter-spacing:-.025em; font-weight:500; color:var(--fg); transition:color .6s var(--expo)}
.temps li::before{content:""; position:absolute; left:0; top:.6em; width:10px; height:10px; margin-top:-5px; border-radius:50%; background:var(--fg); transition:background-color .6s var(--expo), box-shadow .6s var(--expo)}
.temps__k{display:none}
.temps.is-driven li{color:rgb(var(--fg-rgb) / .3)}
.temps.is-driven li::before{background:var(--bg); box-shadow:inset 0 0 0 1px rgb(var(--fg-rgb) / .45)}
.temps.is-driven li.is-on{color:var(--fg)}
.temps.is-driven li.is-on::before{background:rgb(var(--lum)); box-shadow:0 0 0 5px rgb(var(--lum) / .18), 0 0 18px rgb(var(--lum) / .9)}
html[data-theme="light"] .temps.is-driven li.is-on::before{box-shadow:0 0 0 5px rgb(var(--lum) / .14), 0 4px 12px rgb(var(--lum) / .45)}
@media (min-width:900px){
  .how__in{grid-template-columns:minmax(0,5fr) minmax(0,7fr); grid-template-areas:"t s" "l s"; column-gap:clamp(40px,5vw,96px); row-gap:0}
  .how__t{align-self:end}
  .temps{align-self:start; margin-top:clamp(28px,3.4vw,48px)}
}
/* Ordinateur : épinglé ; la piste des trois temps glisse à l'horizontale le long du fil, la scène reste à droite */
.is-pin .how{height:100vh; padding:0}
.is-pin .how > .kz-fil-trait{display:none}
.is-pin .how .replay{display:none}
.is-pin .how__in{display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-rows:auto auto; grid-template-areas:"t s" "w s"; column-gap:clamp(36px,4vw,80px); row-gap:clamp(20px,4vh,44px);
  align-content:center; align-items:end; height:100%; padding-top:84px; padding-bottom:24px}
.is-pin .how__t{grid-area:t; align-self:end; font-size:clamp(56px,5.8vw,100px)}
.is-pin .how__win{display:block; grid-area:w; align-self:start; position:relative; height:clamp(220px, 36vh, 340px); overflow:hidden; container-type:inline-size;
  -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 5%, #000 78%, transparent); mask-image:linear-gradient(90deg, transparent 0, #000 5%, #000 78%, transparent)}
.is-pin .how__track{display:flex; position:relative; height:100%; width:max-content; padding:0 40cqw 0 3cqw; will-change:transform}
.is-pin .how__track::before,.is-pin .how__track::after{content:""; position:absolute; left:0; right:0; top:28%; height:1px; pointer-events:none}
.is-pin .how__track::before{background:linear-gradient(90deg, rgb(var(--fg-rgb) / .16), rgb(var(--fg-rgb) / .16) 70%, rgb(var(--fg-rgb) / 0))}
.is-pin .how__track::after{background:linear-gradient(90deg, rgb(var(--lum) / .3), rgb(var(--lum)) 20%); box-shadow:0 0 10px rgb(var(--lum) / .6); transform-origin:left; transform:scaleX(var(--hp, 0))}
html[data-theme="light"] .is-pin .how__track::after{box-shadow:0 0 8px rgb(var(--lum) / .35)}
.is-pin .temps{display:flex; flex:none; margin:0; gap:0; align-self:stretch}
.is-pin .temps li{position:relative; flex:none; width:60cqw; height:100%; padding:0; font-size:clamp(30px,3vw,50px); line-height:1.1; letter-spacing:-.03em}
.is-pin .temps li::before{display:none}
.is-pin .temps__k{display:block; position:absolute; left:0; top:28%; width:13px; height:13px; margin:-6.5px 0 0 -6px; border-radius:50%; background:var(--bg); box-shadow:inset 0 0 0 1px rgb(var(--fg-rgb) / .5);
  transition:background-color .6s var(--expo), box-shadow .6s var(--expo)}
.is-pin .temps li.is-on .temps__k{background:rgb(var(--lum)); box-shadow:0 0 0 6px rgb(var(--lum) / .16), 0 0 22px rgb(var(--lum))}
html[data-theme="light"] .is-pin .temps li.is-on .temps__k{box-shadow:0 0 0 4px #fff, 0 0 0 5px rgb(var(--lum) / .3), 0 6px 16px rgb(var(--lum) / .4)}
.is-pin .temps__t{position:absolute; left:0; right:12cqw; top:calc(28% + 30px); text-wrap:balance}
</style>
<style>
/* =========================================================
   Scènes : le code des animations de la V3 (unités cqw, état final par défaut)
   ========================================================= */
/* =========================================================
   Scènes (animations des apps) — unités cqw, état final par défaut
   ========================================================= */
.sc{position:relative; width:min(100%, 440px); margin-inline:auto}
.sc__view{position:relative; aspect-ratio:4 / 5; border-radius:34px; background:rgba(244,239,230,.04);
  box-shadow:inset 0 0 0 1px rgba(244,239,230,.08), 0 1px 1px rgba(0,0,0,.25), 0 50px 90px -46px rgba(0,0,0,.9)}
.sc__core{position:absolute; inset:6px; border-radius:28px; overflow:hidden; container-type:inline-size;

<style>

<style>

   Escapades Libres (#escapades-libres) : un projet d'équipe web, dans le même gabarit.

.marque{display:block; width:100%; height:auto; overflow:visible}

.swk__cap{margin-top:clamp(16px,2vw,24px)}

.swk__photo::before{content:""; position:absolute; inset:-14% -10%; z-index:-1; border-radius:50%; background:radial-gradient(closest-side, rgb(var(--teinte-rgb) / .22), rgb(var(--teinte-rgb) / 0)); pointer-events:none}

.swk__core{aspect-ratio:4 / 3}
.swk__img{display:block; width:100%; height:100%; object-fit:cover}
@media (min-width:900px){
  .swk__in{grid-template-columns:minmax(0,7fr) minmax(0,5fr); grid-template-areas:"p t"; column-gap:clamp(44px,5.5vw,96px)}
  .swk__txt{grid-area:t}
  .swk__photo{grid-area:p}
}

/* 5. En vrai : la plateforme dans une fenêtre de navigateur ; la landing entière défile dedans.
   Sans GSAP ou en mouvement réduit : la fenêtre se fait défiler à la main (défilement natif). */
.vrai--el .bw-zone{position:relative; margin-top:clamp(28px,4vw,52px)}
.bw{position:relative; margin:0; padding:6px; border-radius:24px; background:var(--surface); box-shadow:inset 0 0 0 1px var(--surface-edge), var(--sh-1)}
.bw__in{overflow:hidden; border-radius:18px; background:#121A2B; box-shadow:0 0 0 1px rgba(255,255,255,.06)}
.bw__bar{display:grid; grid-template-columns:76px minmax(0,1fr) 76px; align-items:center; height:46px; padding:0 16px; background:linear-gradient(180deg, #1D2538, #171E2F); box-shadow:inset 0 -1px 0 rgba(244,239,230,.07)}
.bw__dots{display:flex; gap:7px}
.bw__dots i{width:11px; height:11px; border-radius:50%; background:rgba(244,239,230,.16); box-shadow:inset 0 0 0 1px rgba(244,239,230,.08)}
.bw__url{display:flex; justify-content:center; min-width:0}
.bw__adr{display:inline-flex; align-items:center; gap:8px; max-width:100%; height:28px; padding:0 16px; border-radius:999px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
  font-size:13px; letter-spacing:.005em; color:rgba(244,239,230,.74); background:rgba(244,239,230,.06); box-shadow:inset 0 0 0 1px rgba(244,239,230,.07)}
.bw__adr svg{flex:none; width:11px; height:11px}
.bw__etat{justify-self:end; font-family:var(--f-word); font-style:italic; font-size:17px; line-height:1; color:var(--el-etat, #F2BE4E)}
.bw__view{position:relative; aspect-ratio:16 / 10; overflow-y:auto; background:#121A2B}
.bw__page{position:relative; aspect-ratio:804 / 4890; overflow:hidden}
.bw__land{display:block; width:100%; height:auto}
/* Le nom d'une personne (signature de la citation et bouton vidéo) masqué : aucun nom sur le site de Kenz */
.bw__hero{display:none}
.bw__view.is-anime{overflow:hidden}
.bw__view.is-anime .bw__page{position:absolute; left:0; top:0; width:100%; will-change:transform}
.bw__view.is-anime .bw__hero{display:block; position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:left top}
/* La vignette : la page du test, en second plan */
.bw--mini{width:min(58%, 300px); margin:-11% 0 0 auto; padding:5px; border-radius:18px; box-shadow:inset 0 0 0 1px var(--surface-edge), 0 30px 60px -24px rgba(0,0,0,.75)}
.bw--mini .bw__in{border-radius:14px}
.bw--mini .bw__bar{grid-template-columns:auto; height:26px; padding:0 11px}
.bw--mini .bw__dots{gap:5px}
.bw--mini .bw__dots i{width:7px; height:7px}
.bw__mini{display:block; width:100%; height:auto; aspect-ratio:16 / 10}
@media (max-width:899px){
  .bw__view{aspect-ratio:4 / 5}
  .bw__view.is-anime .bw__hero{object-position:13% top}
  .bw__bar{grid-template-columns:44px minmax(0,1fr) 58px; padding:0 12px; height:42px}
  .bw__dots{gap:5px}
  .bw__dots i{width:8px; height:8px}
  .bw__adr{padding:0 11px; font-size:12px}
  .bw__etat{font-size:15px}
}
.vrai--el.is-epingle .bw--mini{position:absolute; right:calc(min(30%, 320px) * -.72); bottom:7%; width:min(30%, 320px); margin:0}
/* Ordinateur : la section est épinglée, le défilement fait défiler la landing dans la fenêtre */
.vrai--el.is-epingle{display:flex; flex-direction:column; justify-content:center; height:100vh; padding:76px 0 30px}
.vrai--el.is-epingle > .kz-fil-trait{display:none}
.vrai--el.is-epingle > .wrap{width:100%}
.vrai--el.is-epingle .h2{font-size:clamp(52px,5vw,88px)}
.vrai--el.is-epingle .bw-zone{width:min(calc(100% - min(30%, 320px) * .72), calc((100vh - 330px) * 1.6 + 12px)); margin-top:clamp(18px,2.6vh,30px)}
html[data-theme="light"] .bw{background:var(--surface)}
html[data-theme="light"] .bw__in{box-shadow:0 0 0 1px rgba(26,25,24,.06)}
html[data-theme="light"] .bw__bar{background:linear-gradient(180deg, #FFFFFF, #F4F1EC); box-shadow:inset 0 -1px 0 rgba(26,25,24,.08)}
html[data-theme="light"] .bw__dots i{background:rgba(26,25,24,.13); box-shadow:none}

html[data-theme="light"] .bw__etat{--el-etat:#8A5E0A}
html[data-theme="light"] .bw--mini{box-shadow:inset 0 0 0 1px var(--surface-edge), 0 2px 4px rgba(26,25,24,.06), 0 30px 60px -24px rgba(26,25,24,.45)}

/* 6. L'action */
.act__marque{display:block; width:clamp(96px,8vw,124px)}
.act__marque .marque{filter:drop-shadow(0 12px 22px rgb(var(--teinte-rgb) / .5))}

/* 3. La scène : un test, un profil, un petit groupe. Des formes, pas de phrases (état final par défaut, unités cqw) */
.sc--el{--tint:227 162 26; --sc-a:#1B2438; --sc-b:#10172A; --el-or:#E3A21A; --el-carte:#F6F0E4; --el-encre:#121A2B; --el-trait:rgba(244,239,230,.2)}
.el-dots{position:absolute; left:11cqw; right:11cqw; top:11cqw; display:flex; justify-content:space-between}
.el-dots li{position:relative; width:3.6cqw; height:3.6cqw; border-radius:50%; box-shadow:inset 0 0 0 .45cqw rgba(244,239,230,.22)}
.el-dots i{position:absolute; inset:0; border-radius:50%; background:var(--el-or); box-shadow:0 0 2.2cqw rgb(227 162 26 / .5)}
.el-q{position:absolute; left:13cqw; right:13cqw; top:27cqw; padding:7.4cqw 6.6cqw 6.6cqw; border-radius:6cqw; background:rgba(244,239,230,.06); box-shadow:inset 0 0 0 1px rgba(244,239,230,.1); opacity:0}
.el-q__b{display:block; height:3.2cqw; border-radius:2cqw; background:var(--el-trait); transform-origin:left}
.el-q__b + .el-q__b{width:62%; margin-top:2.8cqw}
.el-scale{display:flex; justify-content:space-between; margin-top:8.4cqw}
.el-scale li{position:relative; width:9cqw; height:9cqw; border-radius:50%; box-shadow:inset 0 0 0 .5cqw rgba(244,239,230,.24)}
.el-scale i{position:absolute; inset:0; border-radius:50%; background:var(--el-or); box-shadow:0 0 3cqw rgb(227 162 26 / .5)}
.el-prof{position:absolute; left:21cqw; right:21cqw; top:28cqw; display:grid; justify-items:center; gap:4.6cqw; padding:7cqw 5cqw; border-radius:6cqw; background:var(--el-carte); color:var(--el-encre); opacity:0;
  box-shadow:0 0 0 1px rgba(18,26,43,.08), 0 5cqw 12cqw -5cqw rgba(0,0,0,.85)}
.el-prof__ico{display:grid; place-items:center; width:18cqw; height:18cqw; border-radius:4.4cqw; background:rgba(227,162,26,.12); border:.45cqw dashed rgba(227,162,26,.9)}
.el-prof__ico svg{width:9.4cqw; height:9.4cqw; fill:none; stroke:var(--el-encre); stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.el-prof__n{font-size:max(17px,7.2cqw); line-height:1; font-weight:600; letter-spacing:-.035em}
.el-links{position:absolute; left:0; top:0; width:100cqw; height:125cqw; overflow:visible; pointer-events:none}
.el-links path{fill:none; stroke:rgba(244,239,230,.26); stroke-width:.32; stroke-linecap:round; stroke-dasharray:1; stroke-dashoffset:0}
.el-av{position:absolute; display:grid; place-items:center; width:13cqw; height:13cqw; margin:-6.5cqw 0 0 -6.5cqw; border-radius:50%; background:#232D46;
  box-shadow:inset 0 0 0 1px rgba(244,239,230,.15), 0 2cqw 5cqw -2cqw rgba(0,0,0,.65)}
.el-av svg{width:6.2cqw; height:6.2cqw; fill:none; stroke:#F4EFE6; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.el-av--0{z-index:1; width:18cqw; height:18cqw; margin:-9cqw 0 0 -9cqw; background:var(--el-or); box-shadow:0 0 0 1.4cqw rgb(227 162 26 / .18), 0 0 9cqw rgb(227 162 26 / .45)}
.el-av--0 svg{width:8.6cqw; height:8.6cqw; stroke:var(--el-encre); stroke-width:2}
.el-av--0{left:50cqw; top:40cqw} .el-av--1{left:21cqw; top:33cqw} .el-av--2{left:79cqw; top:33cqw} .el-av--3{left:31cqw; top:55cqw} .el-av--4{left:69cqw; top:55cqw}
.el-trip{position:absolute; left:9cqw; right:9cqw; top:70cqw; padding:5cqw 5.4cqw 5.4cqw; border-radius:5.4cqw; background:rgba(244,239,230,.07); box-shadow:inset 0 0 0 1px rgba(244,239,230,.11)}
.el-route{display:flex; align-items:center; gap:3cqw; color:var(--el-or)}
.el-route svg{flex:none; width:6.4cqw; height:6.4cqw; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}

.el-chips{display:flex; justify-content:space-between; margin-top:5cqw}
.el-chip{position:relative; display:grid; place-items:center; width:15.4cqw; height:15.4cqw; border-radius:4cqw; background:rgba(244,239,230,.07); box-shadow:inset 0 0 0 1px rgba(244,239,230,.1)}
.el-chip > svg{width:7cqw; height:7cqw; fill:none; stroke:#F4EFE6; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.sc--el .chk{position:absolute; right:-1.8cqw; top:-1.8cqw; width:6.2cqw; height:6.2cqw; box-shadow:0 0 0 .7cqw #1A2235}
.sc--el .chk > i{background:var(--el-or)}
.sc--el .chk path{stroke:var(--el-encre)}

/* La scène en mode clair : un écran clair, l'or et le bleu nuit du site gardent leurs couleurs */
html[data-theme="light"] .sc--el{--tint:227 162 26; --sc-a:#FFFFFF; --sc-b:#FBF5EA; --el-trait:rgba(26,25,24,.12)}

html[data-theme="light"] .el-av{background:#fff; box-shadow:0 0 0 1px rgba(26,25,24,.08), 0 1.6cqw 3.6cqw -1.4cqw rgba(26,25,24,.32)}

  /* ---------- Mots : chaque mot devient une unité animable (ponctuation collée) ---------- */
  function splitWords(el) {
    if (el.dataset.split) return;

    const frag = document.createDocumentFragment();
    let word = null, i = 0;

  const B = {
    oshii(el) {

    },
    sago(el) {

    },

      G.set(sw, { y: 0, yPercent: -100, opacity: 1 });

    },
    croc(el) {

  /* ---------- Apparitions à l'entrée à l'écran ---------- */
  function reveals() {
    const io = new IntersectionObserver(es => es.forEach(en => {
      if (!en.isIntersecting) return;
      (en.target._rev || [en.target]).forEach(el => el.classList.add('is-in'));
      io.unobserve(en.target);
    }), { threshold: .16, rootMargin: '0px 0px -6% 0px' });
    obs.push(io);
    $$('main [data-words], main [data-reveal], main [data-sweep]').forEach(el => {
      if (el.closest('.arr') || el.classList.contains('is-scrub')) return;
      /* un élément masqué par clip-path ne « dépasse » jamais le seuil : on observe son parent */
      if (el.matches('[data-sweep]') && el.parentElement) { const p = el.parentElement; (p._rev = p._rev || []).push(el); io.observe(p); }
      else io.observe(el);
    });
  }

  /* =========================================================
     1. L'arrivée : la couleur remplit l'écran, se rétracte dans l'icône, puis le nom et la phrase
     ========================================================= */
  const cancelFlood = () => { if (flood.getAnimations) flood.getAnimations().forEach(a => a.cancel()); };
  const floodOff = () => { cancelFlood(); flood.classList.add('is-off'); flood.style.removeProperty('--flood'); };
  const floodShown = () => !flood.classList.contains('is-off') && getComputedStyle(flood).display !== 'none';
  const rectInset = (r, rad) => {
    const W = innerWidth, H = innerHeight, c = v => Math.max(0, Math.round(v));
    return `inset(${c(r.top)}px ${c(W - r.right)}px ${c(H - r.bottom)}px ${c(r.left)}px round ${rad}px)`;
  };
  function contract(r, forme) {
    if (!floodShown()) { floodOff(); return; }
    cancelFlood();
    if (RM || !flood.animate || !r) {
      if (!flood.animate) { floodOff(); return; }
      flood.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 450, fill: 'forwards' }).onfinish = floodOff;
      return;
    }
    const a = flood.animate([{ clipPath: 'inset(0px 0px 0px 0px round 0px)' }, { clipPath: rectInset(r, Math.round(forme === 'pilule' ? r.height / 2 : r.width * .23)) }],
      { duration: 1050, easing: 'cubic-bezier(.76,0,.24,1)', fill: 'forwards' });
    a.onfinish = () => { flood.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 420, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'forwards' }).onfinish = floodOff; };
  }
  function arrive() {
    if (arrived) return;
    arrived = true;
    clearTimeout(window.__kzFallback);
    const go = () => {
      const ic = $('.arr__ico');
      const r = ic ? ic.getBoundingClientRect() : null;
      d.classList.add('is-arrived');
      $$('.arr [data-words]').forEach(el => el.classList.add('is-in'));
      /* L'arche de lumière : le fil la dessine pendant que la couleur se retire dans l'icône */
      const ar = $('.arr__arche');
      if (ar) { if (TH) TH.arche(ar); else ar.classList.add('is-trace'); }
      /* Arrivée par l'icône : c'est le voile du passage qui se rétracte dans l'arche, l'icône y est déjà posée */
      if (K.passageIcone) floodOff();
      else contract(r && r.width ? r : null, ic && ic.dataset.rayon); /* projet web : en pilule autour du motif */
    };
    /* La position de l'icône dépend de la police du nom : on l'attend un instant */
    const f = document.fonts && document.fonts.ready;
    if (f) Promise.race([f, new Promise(res => setTimeout(res, 700))]).then(go, go);
    else go();
  }
  function waitArrival() {
    if (!d.classList.contains('js')) { arrived = true; floodOff(); return; } /* le garde-fou est déjà passé */
    let done = false;
    const go = () => { if (done) return; done = true; arrive(); };
    if (d.hasAttribute('data-porte-arrivee')) floodOff(); /* les battants du cordon s'ouvrent directement sur l'arrivée */
    if (d.hasAttribute('data-porte-arrivee') || K.passage) {
      document.addEventListener('passage:arrivee', () => { if (K.passageIcone) floodOff(); go(); }, { once: true });
      document.addEventListener('porte:arrivee', go, { once: true });
      setTimeout(go, 2500);
    } else requestAnimationFrame(() => setTimeout(go, 140));
  }
  /* Repli de « passage » (et retour arrière) : la couleur de l'app suivante remplit l'écran */
  function cover(color, fromEl, cb) {
    cancelFlood();
    flood.style.setProperty('--flood', color);
    flood.classList.remove('is-off');
    if (!flood.animate) { cb(); return; }
    if (RM) { flood.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 260, fill: 'forwards' }).onfinish = cb; return; }
    const from = fromEl ? rectInset(fromEl.getBoundingClientRect(), 28) : 'inset(50% 50% 50% 50% round 48px)';
    flood.animate([{ clipPath: from, filter: 'blur(4px)' }, { clipPath: 'inset(0px 0px 0px 0px round 0px)', filter: 'blur(0px)' }],
      { duration: 700, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'forwards' }).onfinish = cb;
  }

  /* =========================================================
     3. La scène : épinglée et avancée par le défilement (ordinateur), ou jouée à l'entrée (mobile)
     ========================================================= */
  /* Défilement horizontal épinglé : la piste glisse, le fil la traverse (ordinateur seulement) */
  function hscroll(sec, track, win, onUpdate) {
    const dist = () => Math.max(0, track.scrollWidth - win.clientWidth);
    return G.to(track, {
      x: () => -dist(), ease: 'none',
      scrollTrigger: {
        trigger: sec, start: 'top top', end: () => '+=' + Math.max(dist() * 1.45, innerHeight * 1.7),
        pin: true, scrub: .7, anticipatePin: 1, invalidateOnRefresh: true, onUpdate
      }
    });
  }
  function sceneMotion(pin, rm, local) {
    const sc = $('.how .sc'), list = $('[data-temps]');
    if (!sc || !list || !B[cur]) return;
    const caps = $$('li', list), rb = $('[data-replay]', sc);
    const T = K.D[cur].temps.map(t => t[0]);
    const tl = B[cur](sc);
    const setCap = k => caps.forEach((li, i) => li.classList.toggle('is-on', i === k));
    if (rm) { tl.progress(1, true); list.classList.remove('is-driven'); return; }
    list.classList.add('is-driven');
    sc.classList.add('has-tl');
    setCap(0);
    if (pin) {
      d.classList.add('is-pin');
      let seg = -1, tw = null;
      const go = k => {
        if (k === seg) return;
        const back = k < seg, jump = Math.max(1, Math.abs(k - seg));
        seg = k;
        setCap(Math.max(0, k));
        const target = k < 0 ? 0 : k >= T.length - 1 ? tl.duration() : T[k + 1];
        if (tw) tw.kill();
        const dist = Math.abs(tl.time() - target);
        if (dist < .01) return;
        tw = tl.tweenTo(target, { duration: back ? Math.min(.8, dist * .45) : dist / jump, ease: 'none' });
      };
      const how = $('.how'), win = $('.how__win'), track = $('.how__track');
      if (win && track) {
        /* Les trois temps glissent à l'horizontale le long du fil ; chaque nœud qui passe fait avancer l'animation */
        hscroll(how, track, win, s => {
          track.style.setProperty('--hp', s.progress.toFixed(4));
          go(s.progress < .28 ? 0 : s.progress < .72 ? 1 : 2);
        });
      } else {
        ST.create({ trigger: how, start: 'top top', end: '+=170%', pin: true, anticipatePin: 1,
          onUpdate: s => go(s.progress < .3 ? 0 : s.progress < .64 ? 1 : 2) });
      }
      ST.create({ trigger: how, start: 'top 55%', onEnter: () => { if (seg < 0) go(0); }, onLeaveBack: () => go(-1) });
    } else {
      tl.eventCallback('onUpdate', () => { const t = tl.time(); let k = 0; T.forEach((s, i) => { if (t >= s - .001) k = i; }); setCap(k); });
      tl.eventCallback('onComplete', () => { if (rb) rb.classList.add('is-on'); });
      const o = new IntersectionObserver(([e]) => {
        if (!e.isIntersecting) return;
        o.disconnect();
        G.delayedCall(.8, () => tl.play(0));
      }, { threshold: .5 });
      o.observe(sc);
      local.push(o);
      if (rb) rb.onclick = () => { rb.classList.remove('is-on'); tl.pause(0); setCap(0); G.delayedCall(.5, () => tl.play(0)); };
    }
  }

  /* 4. La chaîne de l'IA se trace au défilement */
  function chainMotion() {
    const ch = $('[data-chain]');
    if (!ch) return;
    const st = $$('.chain__st', ch), n = st.length;
    ch.classList.add('is-driven');
    const upd = s => {
      const p = s.progress;
      ch.style.setProperty('--cp', p.toFixed(3));
      st.forEach((x, i) => x.classList.toggle('is-lit', p >= .04 + (i / Math.max(1, n - 1)) * .88));
    };
    ch.style.setProperty('--cp', '0');
    ST.create({ trigger: ch, start: 'top 78%', end: 'bottom 52%', scrub: .5, onUpdate: upd, onRefresh: upd });
  }

  /* 5. Les captures (bento) : chaque capture glisse un peu dans sa carte, la seconde plus vite (profondeur) */
  function framesMotion() {
    $$('.shot--p .shot__img').forEach((f, i) => G.fromTo(f, { '--py': (i ? 56 : 30) + 'px' }, { '--py': (i ? -28 : -14) + 'px', ease: 'none',
      scrollTrigger: { trigger: f.closest('.bezel'), start: 'top bottom', end: 'bottom top', scrub: .6 } }));
  }
  /* La loupe sur les vraies captures (souris seulement : la base commune ignore le toucher et le mouvement réduit) */
  function loupesOn() {
    if (!TH) return;
    $$('.vrai .shot__img, .swk__img, .bw__mini').forEach(img => loupes.push(TH.loupe(img)));
    /* La fenêtre du projet web : la loupe grossit la landing qui défile (sa page), ou le haut de la landing tant qu'il est visible */
    const v = $('[data-bw]');
    if (v) {
      loupes.push(TH.loupe(v, { source: $('.bw__page', v) }));
      const h = $('.bw__hero', v);
      if (h) loupes.push(TH.loupe(h));
    }
  }

  /* 5 bis. Projet web : la landing défile dans la fenêtre de navigateur.
     Ordinateur : section épinglée ; le défilement (molette comprise, au-dessus de la fenêtre) fait défiler la landing.
     Mobile : la landing défile pendant que la fenêtre traverse l'écran. Mouvement réduit ou sans GSAP : défilement natif dans la fenêtre. */
  let souris = [-1, -1];
  document.addEventListener('pointermove', e => { if (e.isTrusted && e.pointerType === 'mouse') souris = [e.clientX, e.clientY]; }, { passive: true });
  /* La loupe ne se recale qu'au mouvement de la souris : quand la page défile sous elle, on lui redonne la même position */
  const recalerLoupe = () => {
    if (souris[0] < 0 || !document.querySelector('.kz-loupe.is-on')) return;
    try { document.dispatchEvent(new PointerEvent('pointermove', { clientX: souris[0], clientY: souris[1], pointerType: 'mouse', bubbles: true })); } catch (e) {}
  };
  function fenetreMotion(pin, local) {
    const sec = $('.vrai--el'), view = $('[data-bw]'), page = view && $('.bw__page', view), hero = view && $('.bw__hero', view);
    if (!sec || !view || !page || !hero) return;
    view.classList.add('is-anime');
    view.removeAttribute('data-lenis-prevent');
    view.scrollTop = 0;
    if (pin) sec.classList.add('is-epingle');
    const maxY = () => Math.max(0, page.offsetHeight - view.clientHeight);
    const f = pin ? [.015, .05] : [.1, .16];
    G.timeline({ defaults: { ease: 'none' }, scrollTrigger: pin
      ? { trigger: sec, start: 'top top', end: () => '+=' + Math.round(Math.min(maxY() * .5, innerHeight * 3.4)), pin: true, scrub: .8, anticipatePin: 1, invalidateOnRefresh: true, onUpdate: recalerLoupe }
      : { trigger: view, start: 'top 72%', end: 'bottom 12%', scrub: .6, invalidateOnRefresh: true } })
      .to(hero, { opacity: 0, duration: f[1] - f[0] }, f[0])
      .fromTo(page, { y: 0 }, { y: () => -maxY(), duration: 1 - f[1] }, f[1]);
    local.push({ disconnect() { sec.classList.remove('is-epingle'); view.classList.remove('is-anime'); view.setAttribute('data-lenis-prevent', ''); } });
  }

  function motion(c) {
    const pin = !!c.pin, rm = !!c.rm, local = [];
    safe('scène', () => sceneMotion(pin, rm, local));
    if (!rm) {
      safe('problème', () => {
        const ws = $$('.pbm__t.is-scrub .w');
        if (ws.length) G.fromTo(ws, { opacity: .12 }, { opacity: 1, ease: 'none', stagger: .1, scrollTrigger: { trigger: '.pbm__t', start: 'top 80%', end: 'bottom 42%', scrub: .6 } });
      });
      safe('arrivée au défilement', () => G.to('.arr__in', { yPercent: -9, opacity: .2, ease: 'none', scrollTrigger: { trigger: '.arr', start: 'top top', end: 'bottom top', scrub: true } }));
      safe('chaîne', chainMotion);
      safe('captures', framesMotion);
      safe('fenêtre', () => fenetreMotion(pin, local));
      /* Le « 54 » monte de sa fente quand le week-end arrive */
      safe('week-end', () => {
        const n = $('.swk__t .num');
        if (n) G.from(n, { yPercent: 110, duration: 1.3, ease: 'expo.out', delay: .35, scrollTrigger: { trigger: '.swk', start: 'top 72%' } });
      });
    }
    return () => { local.forEach(o => o.disconnect()); d.classList.remove('is-pin'); };
  }

  /* 7. L'histoire suivante s'allume quand elle passe au centre de l'écran (tactile) */
  function nextHot() {
    const nx = $('.next'), q = $('.next__q');
    if (!nx || !q || matchMedia('(hover: hover)').matches) return;
    const o = new IntersectionObserver(([e]) => nx.classList.toggle('is-hot', e.isIntersecting), { rootMargin: '-36% 0px -36% 0px' });
    o.observe(q);
    obs.push(o);
  }

  /* ---------- Monter / démonter une histoire ---------- */
  function mount() {
    $$('main [data-words]').forEach(splitWords);
    const pt = $('.pbm__t');
    if (hasG && !RM && pt) pt.classList.add('is-in', 'is-scrub');
    reveals();
    safe('suivante', nextHot);
    safe('loupes', loupesOn);
    /* Le dépliant change la hauteur de la page : les déclencheurs plus bas se recalent */
    $$('details.capot').forEach(x => x.addEventListener('toggle', () => { if (hasG) ST.refresh(); }));
    if (!hasG) return; /* sans GSAP : état final des scènes, légendes et chaîne allumées */
    mm = G.matchMedia();
    mm.add({ tout: 'all', pin: Q_PIN, rm: Q_RM }, ctx => motion(ctx.conditions));
    ST.refresh();
  }
  function teardown() {
    loupes.forEach(off => off());
    loupes = [];
    obs.forEach(o => o.disconnect());
    obs = [];
    if (mm) { mm.revert(); mm = null; }
    d.classList.remove('is-pin');
  }
  /* Changement d'histoire sans recharger : le contenu se remplace, le scroll revient en haut, l'arrivée se rejoue */
  function swap(s) {
    const run = () => {
      safe('démontage', teardown);
      d.classList.remove('is-arrived');
      arrived = false;
      K.render(s);
      K.cur = cur = s;
      if (lenis) lenis.scrollTo(0, { immediate: true, force: true });
      window.scrollTo(0, 0);
      safe('montage', mount);
      if (TH) TH.rafraichir();
      requestAnimationFrame(() => setTimeout(() => { arrive(); const h = $('#arr-nom'); if (h) h.focus({ preventScroll: true }); }, 160));
    };
    if (floodShown()) run(); else cover(K.D[s].teinte, null, run);
  }

  /* ---------- Défilement doux (ordinateur) ---------- */
  safe('lenis', () => {
    if (!window.Lenis || RM || !matchMedia('(pointer: fine)').matches) return;
    lenis = new window.Lenis({ lerp: .1 });
    if (hasG) {
      lenis.on('scroll', ST.update);
      G.ticker.add(t => lenis.raf(t * 1000));
      G.ticker.lagSmoothing(0);
    } else {
      const raf = t => { lenis.raf(t); requestAnimationFrame(raf); };
      requestAnimationFrame(raf);
    }
  });

  /* ---------- Nav : fond au défilement (le repère de progression est le fil commun : rail ou filet) ---------- */
  safe('nav', () => {
    const nav = $('.nav');
    new IntersectionObserver(([e]) => nav.classList.toggle('is-scrolled', !e.isIntersecting)).observe($('.top-sentinel'));
  });

  /* ---------- Clics : histoire suivante (passage) et ancres internes (sans toucher au hash) ---------- */
  document.addEventListener('click', e => {
    const nl = e.target.closest('[data-next]');
    if (nl) {
      e.preventDefault();
      /* location.search : la porte de test du mode (?clair / ?sombre) survit au rechargement sous le voile */
      const nx = nl.dataset.next, couleur = K.D[nx].teinte, url = 'app.html' + location.search + '#' + nx;
      if (window.Passage && typeof window.Passage.ouvrir === 'function') {
        try { window.Passage.ouvrir(nl, url, { couleur }); return; } catch (err) { console.error('[kz] passage : ' + err.message); }
      }
      cover(couleur, nl, () => { location.hash = nx; });
      return;
    }
    const l = e.target.closest('a[href^="#"]');
    if (!l) return;
    const t = document.getElementById(l.getAttribute('href').slice(1));
    if (!t) return;
    e.preventDefault();
    const y = t.getBoundingClientRect().top + scrollY;
    if (lenis) lenis.scrollTo(y, { duration: 1.4 });
    else window.scrollTo({ top: y, behavior: RM ? 'auto' : 'smooth' });
    if (t.hasAttribute('tabindex')) setTimeout(() => t.focus({ preventScroll: true }), RM ? 0 : 900);
  });

  /* ---------- Le hash change : passage tout juste lancé → vraie navigation ; sinon, remplacement sur place ---------- */
  addEventListener('hashchange', () => {
    const s = K.slugDe(location.hash);
    if (!s || s === cur) return;
    if (K.passageFrais(4000)) { location.reload(); return; }
    swap(s);
  });

  safe('montage', mount);
  waitArrival();
  addEventListener('load', () => { if (hasG) ST.refresh(); });
})();
</script>
<script src="shared/passage.js" defer></script><script src="shared/cordon.js" defer></script>
<script src="shared/revue.js" defer></script>

</body>
