<!--
  MAQUETTE 01 · « REC / PROD » · kenzenbien.fr v3
  Fichier autonome (double-clic, file://). Données : _shared/content.js (window.KENZ), liste blanche.
  Aucune requête réseau hors Google Fonts. Ni GSAP ni Lenis : tout le mouvement est natif (Web Animations + CSS).

  VUES (38 routes, routeur hash #/…, retour navigateur, retour en haut, focus sur le h1)
  Communes : / · /now · /contact · /a-propos · /mentions-legales · /confidentialite · /404 (+ toute adresse inconnue)
  Pro      : /pro · /pro/apps · /pro/apps/{oshii, sago, wado, croc, miru, zenko, escapades-libres, ce-site}
             /pro/agents · /pro/agents/{veille, contenu, llm-produit, agents-de-code, memoire-equipe, back-office}
             /pro/video · /pro/services · /pro/devis · /pro/cv · /livrable/demo
  Créateur : /moi · /asie · /asie/chine · /guides · /itineraire/chine · /avant-de-partir/chine · /k15ze · /liens · /collaborer
  Alias et anciennes adresses : /chine → /itineraire/chine ; /apps/x et /projets/x → /pro/apps/x ; /destination/x → /asie(/chine)

  INTERACTIONS SIGNATURE
  W1  L'iris du point : fermeture en iris vers le point (clip-path circle, 240 ms, power3.in), PROD → REC en 80 ms,
      réouverture sur le hub d'en face (400 ms vers le Créateur, 600 ms vers le Pro, expo.out). Réduit : fondu 120 ms.
  W16 Le timecode : 00:00:14:08 en IBM Plex Mono, calculé depuis le défilement à 25 i/s (1 image = 2 px), sans boucle.
      Galerie bornée aimantée : titre mot à mot (56 ms), rails par la fente, coup de poing +4 % sur les vues.
  Le point s'étire en bouton : point 10 px → pilule (clip-path, 280 ms expo.out), libellé +60 ms, retour 200 ms.
  La capture monte dans la carte 16:9 : +34 px → 0, 0,965 → 1 en 480 ms ; la ligne d'état change par la fente.
  W7  La timeline à pistes (/pro/agents, /pro, cas) : Hermes, rôles, Vous ; tête de lecture 300 ms par segment ;
      arrêt aux marqueurs Vous (W6) jusqu'au choix ; Espace = lecture/pause, touches 1/2/3 ; liste équivalente ; journal aria-live.
  Le cadre REC : quatre équerres de viseur se posent autour de la vidéo du moment (220 ms), « REC · 31/10/2026 », jamais clignotant.
  Socle : W2 fente, W3 pastille de preuve, W4 prix barré, W5 tampon, W6 arrêt obligatoire, W8 coupe au mot,
          W9 drapeau éteint, W10 vue éclatée, W15 fiche « Où on en est ».

  CHOIX FORTS
  - Deux casquettes, deux formats : Pro posé en 16:9 sur papier clair (toujours clair, pas de mode sombre par décision de marque),
    Créateur de nuit en colonne 9:16 entre deux rails « le plan » / « ce que ça m'a coûté ». Communes : papier, les deux points visibles.
  - Le point est l'interrupteur : PROD (vert) côté Pro, REC (orange) côté Créateur ; il mène toujours au hub d'en face, libellé visible.
  - Agents IA = savoir-faire installé chez un client (rôles, mémoire, garde-fous, validation humaine), jamais un usage personnel.
  - Chaque chiffre porte sa pastille (statut + date). Les « à confirmer » ne s'affichent qu'en mode « Montrer les trous ».
  - Rayons : fenêtres 10 px, champs 8 px, tout ce qui est cliquable en pilule. Un seul accent par côté.
  - Panneau de simulation (bas gauche) : sources live, horloge, états des formulaires, lien expiré, trous, mouvement réduit,
    aperçu 390 px, plan du site, dernier événement mesuré (data-event).
-->

<style>
/* ======================================================================
   SOCLE : tokens (brief 05 § 9 et § 10.1)
   ====================================================================== */
:root{
  --ease-arrivee:cubic-bezier(.16,1,.3,1);
  --ease-sortie:cubic-bezier(.32,0,.67,0);
  --ease-recadre:cubic-bezier(.65,0,.35,1);
  --f-sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-serif:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --f-tc:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --f-cn:"Noto Sans SC","PingFang SC","Hiragino Sans GB",sans-serif;
  --f-jp:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --f-anton:"Anton",Impact,"Arial Narrow",sans-serif;
  --prod:#1F8A5B; --rec:#FF5A1F; --creme:#F4EFE6; --nuit:#0E0D0C;
  --max:1320px; --gout:24px; --rayon:10px; --entete:64px;
}
[data-cote="pro"],[data-cote="commun"]{
  --fond:#F5F3EE; --surface:#FBFAF7; --surface-2:#EFECE5; --encre:#16181C; --texte-2:#5D6168;
  --filet:#E3DFD7; --filet-fort:#C9C4BA; --accent:#1F8A5B; --accent-texte:#17704A; --point:#1F8A5B;
  --bouton:#17704A; --sur-bouton:#FBFAF7; --agents:#2E3A4A; --focus:#17704A; --ombre:22,24,28; --mult:1.2;
  --trait:#878278; /* contour des champs et interrupteurs : 3,45:1 sur le fond, 3,66:1 sur la surface */
  color-scheme:light;
}
[data-cote="commun"]{ --point:#16181C; --mult:1; }
[data-cote="createur"]{
  --fond:#0E0D0C; --surface:#1A1918; --surface-2:#242220; --encre:#F4EFE6; --texte-2:#A8A196;
  --filet:#2C2A27; --filet-fort:#4A4540; --accent:#FF5A1F; --accent-texte:#FF5A1F; --point:#FF5A1F;
  --bouton:#FF5A1F; --sur-bouton:#0E0D0C; --rouge:#E8322B; --jaune:#FFE600; --maurice:#3FB0C2;
  --agents:#A8A196; --focus:#F4EFE6; --ombre:0,0,0; --mult:.8;
  --trait:#7A736A; /* 3,75:1 sur la surface, 4,15:1 sur la nuit */
  color-scheme:dark;
}
@media (max-width:640px){ :root{ --gout:16px; --entete:56px; } }

/* ======================================================================
   BASE
   ====================================================================== */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--fond);color:var(--encre);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:var(--f-sans);font-size:16.5px;line-height:1.55;background:var(--fond);color:var(--encre);
  overflow-x:hidden;overflow-x:clip;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
img{max-width:100%;display:block;height:auto}
a{color:inherit;text-underline-offset:.18em;text-decoration-thickness:1px}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
ul,ol{margin:0;padding:0;list-style:none}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.02em;line-height:1.08;text-wrap:balance;overflow-wrap:break-word}
p{margin:0}
del,ins{text-decoration:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:6px}
h1[tabindex="-1"]:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:fixed;left:16px;top:12px;z-index:120;background:var(--encre);color:var(--fond);padding:12px 18px;border-radius:999px;text-decoration:none;font-weight:600;transform:translateY(-140%);transition:transform 200ms var(--ease-arrivee)}
.skip:focus{transform:none}
#scene{background:var(--fond);color:var(--encre);min-height:100dvh;display:flex;flex-direction:column;position:relative}
#vue{flex:1 0 auto;outline:none}
.wrap{width:100%;max-width:var(--max);margin-inline:auto;padding-inline:var(--gout)}
.sec{padding-block:clamp(56px,7vw,112px)}
.sec--serre{padding-block:clamp(36px,5vw,64px)}
.filet-haut{border-top:1px solid var(--filet)}
.mute{color:var(--texte-2)}
.tnum{font-variant-numeric:tabular-nums slashed-zero;font-feature-settings:"tnum","zero"}
.cn{font-family:var(--f-cn);font-weight:500;letter-spacing:0}
.jp{font-family:var(--f-jp);font-weight:500;letter-spacing:0}
.s{font-family:var(--f-serif);font-style:italic;font-weight:400;letter-spacing:0;text-transform:none}
.lieu{font-family:var(--f-serif);font-style:normal;font-weight:400;letter-spacing:0;text-transform:none}
.rv-attente{opacity:0}

/* Typographie : Pro = Inter 600, -2 % ; Créateur = Inter 800, capitales serrées */
.t1{font-size:clamp(2.15rem,1.25rem + 3.1vw,4.1rem);line-height:1.04;letter-spacing:-.026em;padding-bottom:.08em}
.t2{font-size:clamp(1.6rem,1.15rem + 1.5vw,2.55rem);line-height:1.08;padding-bottom:.06em}
.t3{font-size:clamp(1.12rem,1rem + .45vw,1.38rem);line-height:1.22;letter-spacing:-.012em}
.t4{font-size:1rem;line-height:1.3;letter-spacing:-.005em;font-weight:650}
#scene[data-cote="createur"] .t1,#scene[data-cote="createur"] .t2{font-weight:800;text-transform:uppercase;letter-spacing:-.03em;line-height:1.02}
#scene[data-cote="createur"] .t1{font-size:clamp(2rem,1.5rem + 1.9vw,2.9rem)}
.t1 .s,.t2 .s{font-size:1.08em;letter-spacing:-.005em;padding-right:.04em}
.lead{font-size:clamp(1.05rem,.98rem + .3vw,1.24rem);color:var(--texte-2);max-width:58ch;line-height:1.5}
.txt{max-width:65ch}
.txt p+p{margin-top:.9em}
.petit{font-size:13.5px;line-height:1.45}
.pile>*+*{margin-top:var(--pile,16px)}

/* ======================================================================
   EN-TÊTE · POINT · NAVIGATION
   ====================================================================== */
.entete{position:sticky;top:0;z-index:40;background:var(--fond);border-bottom:1px solid var(--filet)}
.entete__in{height:var(--entete);display:flex;align-items:center;gap:clamp(10px,1.6vw,22px)}
.marque{display:flex;align-items:center;flex:none}
.wm{font-weight:760;font-size:23px;letter-spacing:-.04em;text-decoration:none;line-height:1;display:inline-flex;align-items:center;min-height:44px;padding-right:1px}
.wm__pt{display:inline-block;width:.3em;height:.3em;border-radius:50%;background:var(--encre);margin-left:.04em;transform:translateY(.27em)}
.point{display:inline-flex;align-items:center;gap:10px;min-height:44px;min-width:28px;padding:0 8px 0 2px;text-decoration:none;border-radius:999px}
.point__dot{width:10px;height:10px;border-radius:50%;background:var(--point);flex:none;transform:translateY(5px);transition:transform 200ms var(--ease-arrivee)}
.point__lab{font-size:13px;font-weight:560;color:var(--accent-texte);white-space:nowrap}
.point:hover .point__dot{transform:translateY(5px) scale(1.25)}
.nav{display:flex;align-items:center;gap:2px;margin-left:auto}
.nav a{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 13px;border-radius:999px;text-decoration:none;font-size:15px;font-weight:520;color:var(--texte-2);transition:color 160ms}
.nav a:hover,.nav a[aria-current="page"]{color:var(--encre)}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:13px;right:13px;bottom:8px;height:1.5px;background:currentColor}
.cote-lien{gap:9px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.dot--prod{background:var(--prod)} .dot--rec{background:var(--rec)}
.outils{display:flex;align-items:center;gap:8px;flex:none}
.nav+.outils{margin-left:8px}
.marque+.outils{margin-left:auto}
.kbd{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:36px;min-width:44px;padding:0 10px;border-radius:999px;border:1px solid var(--filet-fort);font-size:13px;font-weight:600;color:var(--texte-2);transition:color 160ms,border-color 160ms}
.kbd:hover{color:var(--encre);border-color:var(--encre)}
.lang{display:inline-flex;border:1px solid var(--filet-fort);border-radius:999px;padding:2px}
.lang button{position:relative;min-height:32px;min-width:36px;padding:0 8px;border-radius:999px;font-size:12.5px;font-weight:650;color:var(--texte-2);transition:background-color 160ms,color 160ms}
.lang button[aria-pressed="true"]{background:var(--encre);color:var(--fond)}
/* Cibles de 44 px sans alourdir le dessin : la zone cliquable déborde du visuel */
.kbd::after,.lang button::after{content:"";position:absolute;inset:-6px 0}
@media (min-width:900px) and (max-width:1099px){
  .entete .lang,.entete .kbd{display:none}
  #scene[data-cote="createur"] .loupe__t{display:none}
  #scene[data-cote="createur"] .loupe{padding:0;width:44px;justify-content:center}
}
.menu-btn{display:none;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--filet-fort);font-weight:600;font-size:14.5px}
.menu{position:absolute;left:0;right:0;top:100%;background:var(--fond);border-bottom:1px solid var(--filet);box-shadow:0 30px 60px -30px rgba(var(--ombre),.35)}
.menu__in{display:grid;gap:6px;padding:12px var(--gout) 22px}
.menu__in>a:not(.cta-point){display:flex;align-items:center;gap:10px;min-height:52px;font-size:20px;font-weight:600;letter-spacing:-.015em;text-decoration:none;border-bottom:1px solid var(--filet)}
.menu__bas{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:10px}
.tc{font-family:var(--f-tc);font-weight:500;font-size:13px;letter-spacing:.02em;color:var(--texte-2);font-variant-numeric:tabular-nums;min-width:11ch;text-align:right}
.loupe{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--filet-fort);font-size:14px;font-weight:550;color:var(--texte-2)}
.loupe:hover{color:var(--encre)}
.loupe__ic{position:relative;width:13px;height:13px;border:1.6px solid currentColor;border-radius:50%;flex:none}
.loupe__ic::after{content:"";position:absolute;width:6px;height:1.6px;background:currentColor;right:-5px;bottom:-2px;transform:rotate(45deg)}
@media (max-width:899px){
  .nav,.entete .lang,.entete .kbd,.point__lab,.entete .cta-head{display:none}
  .menu-btn{display:inline-flex;align-items:center}
  #scene[data-cote="createur"] .loupe__t{display:none}
  #scene[data-cote="createur"] .loupe{padding:0;width:44px;justify-content:center}
}
@media (min-width:900px){ .menu{display:none!important} }

/* Barre basse au pouce (Créateur, mobile) */
.barre{display:none}
@media (max-width:899px){
  #scene[data-cote="createur"] .barre{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--fond);border-top:1px solid var(--filet);padding-bottom:env(safe-area-inset-bottom)}
  #scene[data-cote="createur"]{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
}
.barre a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:62px;text-decoration:none;font-size:13px;font-weight:620;color:var(--texte-2)}
.barre a::before{content:"";width:6px;height:6px;border-radius:50%;background:transparent}
.barre a[aria-current="page"]{color:var(--encre)}
.barre a[aria-current="page"]::before{background:var(--point)}

/* ======================================================================
   PIED DE PAGE
   ====================================================================== */
.pied{border-top:1px solid var(--filet);padding:44px 0 48px;margin-top:auto}
.pied__in{display:grid;gap:28px}
@media (min-width:900px){.pied__in{grid-template-columns:1.1fr 2fr auto;align-items:start}}
.pied .wm{font-size:20px;min-height:auto}
.duo{display:inline-flex;gap:5px;margin-left:5px;transform:translateY(3px)}
.pied__liens{display:flex;flex-wrap:wrap;gap:4px 18px}
.pied__liens a{display:inline-flex;align-items:center;gap:8px;min-height:44px;text-decoration:none;color:var(--texte-2);font-size:14.5px}
.pied__liens a:hover{color:var(--encre)}
.pied__droite{display:flex;flex-direction:column;gap:10px;align-items:flex-start}

/* ======================================================================
   BOUTONS
   ====================================================================== */
/* Le point s'étire en bouton : point 10 px → pilule (280 ms), libellé +60 ms, retour 200 ms */
.cta-point{--pt-x:18px;position:relative;isolation:isolate;display:inline-flex;align-items:center;min-height:48px;padding:0 22px 0 40px;border-radius:999px;
  font-weight:620;font-size:15.5px;letter-spacing:-.005em;text-decoration:none;white-space:nowrap;color:var(--encre);
  box-shadow:inset 0 0 0 1px var(--filet-fort);transition:color 200ms var(--ease-arrivee),transform 160ms var(--ease-arrivee)}
/* Position du point réglée par variable : une règle locale ne doit jamais écraser l'état « pilule » (survol, focus, tactile) */
.cta-point::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--bouton);
  clip-path:inset(calc(50% - 5px) calc(100% - var(--pt-x) - 10px) calc(50% - 5px) var(--pt-x) round 5px);transition:clip-path 200ms var(--ease-arrivee)}
.cta-point:hover,.cta-point:focus-visible{color:var(--sur-bouton);transition:color 200ms var(--ease-arrivee) 60ms}
.cta-point:hover::before,.cta-point:focus-visible::before{clip-path:inset(0 0 0 0 round 999px);transition-duration:280ms}
.cta-point:active{transform:scale(.98)}
.cta-point[aria-disabled="true"],.cta-point:disabled{opacity:.55;pointer-events:none}
.cta-point--plein{color:var(--sur-bouton)}
.cta-point--plein::before{clip-path:inset(0 0 0 0 round 999px)}
.cta-point--sombre{--bouton:var(--rec);--sur-bouton:var(--nuit);color:var(--creme);box-shadow:inset 0 0 0 1px rgba(244,239,230,.42)}
@media (hover:none){
  .cta-point{color:var(--sur-bouton)}
  .cta-point::before{clip-path:inset(0 0 0 0 round 999px)}
}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--filet-fort);font-weight:600;font-size:14.5px;text-decoration:none;white-space:nowrap;transition:border-color 160ms,background-color 160ms,transform 160ms var(--ease-arrivee)}
.btn:hover{border-color:var(--encre)}
.btn:active{transform:scale(.98)}
.btn[aria-pressed="true"]{background:var(--encre);color:var(--fond);border-color:var(--encre)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lien{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:600;text-decoration:none;position:relative}
.lien::after{content:"";position:absolute;left:0;right:0;bottom:9px;height:1px;background:currentColor;transform:scaleX(.35);transform-origin:left;transition:transform 240ms var(--ease-arrivee)}
.lien:hover::after,.lien:focus-visible::after{transform:scaleX(1)}
.lien--acc{color:var(--accent-texte)}
.ext{font-size:.9em}
.rangee{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}

/* ======================================================================
   COMPOSANTS DU SOCLE
   ====================================================================== */
/* W3 La pastille de preuve */
.pz{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;line-height:1.35;color:var(--texte-2);vertical-align:middle}
.pz i{width:8px;height:8px;border-radius:50%;flex:none;border:1.5px solid currentColor}
.pz[data-forme="plein"] i{background:currentColor}
.pz[data-forme="demi"] i{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.pz[data-forme="pointillé"] i{border-style:dashed}
.pz>span{transition:transform 200ms var(--ease-arrivee)}
.chiffre{display:grid;gap:6px;align-content:start}
.chiffre__v{position:relative;justify-self:start;font-weight:650;font-size:clamp(1.6rem,1.2rem + 1.3vw,2.3rem);letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.chiffre__v::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:1.5px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform 200ms var(--ease-arrivee)}
.chiffre:hover .chiffre__v::after{transform:scaleX(1)}
.chiffre:hover .pz>span{transform:translateX(4px)}
.chiffre__l{font-size:14.5px;color:var(--encre);line-height:1.35}

/* Live : la forme change avec l'état (plein, contour, pointillé, absent) */

.puces li{position:relative;padding-left:20px;margin-top:9px;line-height:1.45}
.puces li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor;opacity:.7}
.chiffres{display:grid;gap:26px 22px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:22px}
.stack-chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--filet);font-size:13.5px;line-height:1.25}
a.chip{min-height:44px;padding:0 16px;text-decoration:none;font-weight:600;transition:box-shadow 160ms,transform 160ms var(--ease-arrivee)}
a.chip:hover{box-shadow:inset 0 0 0 1.5px var(--encre)}
a.chip:active{transform:scale(.98)}

/* Pipeline rejoué */
.pipe{margin-top:22px;border-radius:var(--rayon);background:var(--surface);box-shadow:inset 0 0 0 1px var(--filet);padding:clamp(16px,2.4vw,28px)}
.pipe ol{display:grid;gap:10px;counter-reset:p}
@media (min-width:900px){.pipe ol{grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:0}}
.pipe li{position:relative;padding:14px 16px 14px 0;font-size:14px;font-weight:560;line-height:1.35;display:grid;gap:8px;align-content:start}
.pipe li::before{counter-increment:p;content:counter(p);display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1.5px dashed var(--filet-fort);font-size:12px;font-weight:700;color:var(--texte-2);background:var(--surface)}
.pipe li[data-s="fait"]::before{border-style:solid;border-color:var(--agents);background:var(--agents);color:#FBFAF7}
.pipe li[data-s="repli"]::before{border-style:solid;border-color:var(--accent);background:var(--accent);color:#FBFAF7}
.pipe li[data-s="echec"]{color:var(--texte-2)}
.pipe li[data-s="echec"]::before{content:"×";border-style:solid}
@media (min-width:900px){.pipe li::after{content:"";position:absolute;left:34px;right:6px;top:28px;height:1px;background:var(--filet-fort)}.pipe li:last-child::after{display:none}}
.pipe__ctrl{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-top:18px}
.pipe__note{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--surface-2);font-size:14px}
.interrupteur{display:inline-flex;align-items:center;gap:12px;min-height:44px;font-weight:600;font-size:14.5px}
.interrupteur__piste{position:relative;width:46px;height:26px;border-radius:999px;background:var(--trait);transition:background-color 180ms;flex:none}
.interrupteur__piste::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform 180ms var(--ease-arrivee)}
.interrupteur[aria-checked="true"] .interrupteur__piste{background:var(--accent)}
.interrupteur[aria-checked="true"] .interrupteur__piste::after{transform:translateX(20px)}

/* W10 La vue éclatée */
.ecl{display:grid;gap:22px;margin-top:22px;align-items:center}
@media (min-width:900px){.ecl{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.ecl__scene{position:relative;height:clamp(290px,34vw,380px);perspective:1400px;perspective-origin:50% 40%}
.ecl__pl{position:absolute;left:50%;top:56%;width:min(330px,74%);height:118px;margin-left:calc(min(330px,74%) / -2);margin-top:-59px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--filet-fort),0 18px 40px -26px rgba(22,24,28,.5);
  transform:rotateX(58deg) rotateZ(-34deg) translateZ(calc(var(--i) * 28px));transform-style:preserve-3d;cursor:pointer;display:flex;align-items:flex-end;padding:14px 18px;transition:background-color 200ms,box-shadow 200ms}
.ecl__pl span{font-weight:760;font-size:20px;letter-spacing:-.02em}
.ecl__pl[data-actif="true"]{background:var(--agents);color:#FBFAF7}
.ecl__ctrl{display:flex;flex-wrap:wrap;gap:8px}
.ecl__fiche{margin-top:16px;min-height:120px}
.ecl__liste{display:none}
html.reduit .ecl__scene{display:none}

/* ======================================================================
   W7 LA TIMELINE À PISTES (agents)
   ====================================================================== */
.demo{display:grid;gap:22px;margin-top:26px}
@media (min-width:1100px){.demo--mem{grid-template-columns:minmax(0,1fr) 330px;align-items:start}}
.tl{display:grid;gap:14px;min-width:0}
.tl__barre{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.tl__scroll{border-radius:var(--rayon);background:var(--surface);box-shadow:inset 0 0 0 1px var(--filet)}
.tl__grille{position:relative;display:grid;grid-template-columns:var(--lab,150px) repeat(var(--n),minmax(96px,1fr));grid-auto-rows:54px;min-width:calc(var(--lab,150px) + var(--n) * 96px)}
.tl__grille:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tl__lab{grid-column:1;position:sticky;left:0;z-index:4;display:flex;align-items:center;gap:9px;padding:0 12px;font-size:12.5px;font-weight:640;line-height:1.18;background:var(--surface);border-right:1px solid var(--filet)}
.tl__lab i{width:8px;height:8px;border-radius:2px;background:var(--c);flex:none}
.tl__piste{grid-column:2/-1;border-bottom:1px solid var(--filet);pointer-events:none}
.tl__clip{position:relative;z-index:2;margin:8px 3px;border-radius:6px;display:flex;align-items:center;padding:0 9px;font-size:12px;font-weight:620;line-height:1.15;border:1.5px dashed var(--filet-fort);color:var(--texte-2);overflow:hidden;cursor:default}
.tl__clip[data-s="actif"],.tl__clip[data-s="fait"]{border:1.5px solid var(--c);background:var(--c);color:var(--sur,#FBFAF7)}
.tl__clip[data-s="fait"]{opacity:.9}
.tl__lien{z-index:1;justify-self:start;width:0;border-left:1.5px dashed var(--filet-fort);margin:27px 0;pointer-events:none}
.tl__stop{position:relative;z-index:2;display:grid;place-items:center}
.tl__stop b{width:18px;height:18px;transform:rotate(45deg);border:2px solid var(--accent);background:var(--surface);border-radius:3px;transition:background-color 200ms}
.tl__stop[data-s="actif"] b{background:var(--accent)}
.tl__stop[data-s="fait"] b{background:var(--accent);opacity:.75}
.tl__anneau{position:absolute;width:44px;height:44px;left:50%;top:50%;margin:-22px 0 0 -22px;overflow:visible;pointer-events:none}
.tl__anneau circle{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1}
.tl__stop[data-s="actif"] .tl__anneau circle,.tl__stop[data-s="fait"] .tl__anneau circle{stroke-dashoffset:0}
.tl__tete{position:absolute;top:0;bottom:0;left:0;width:2px;margin-left:-1px;background:var(--encre);z-index:5;pointer-events:none}
.tl__tete::before{content:"";position:absolute;top:-1px;left:-5px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--encre)}
.tl__options{display:grid;gap:10px;padding:16px;border-radius:var(--rayon);background:var(--surface-2)}
.tl__options p{font-weight:650}
.tl__opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:0 16px 0 8px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--filet-fort);font-weight:600;font-size:14.5px;text-align:left}
.opt kbd{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--encre);color:var(--fond);font:700 13px/1 var(--f-sans)}
.opt:hover{box-shadow:inset 0 0 0 1.5px var(--encre)}
.tl__journal{display:grid;gap:6px;font-size:13.5px;max-height:220px;overflow:auto}
.tl__journal li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px}
.tl__journal .tnum{color:var(--texte-2)}
.tl__liste{display:grid;gap:6px;font-size:14px;counter-reset:l}
.tl__liste li{counter-increment:l;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px}
.tl__liste li::before{content:counter(l) ".";color:var(--texte-2);font-variant-numeric:tabular-nums}
.tl__liste li[aria-current="step"]{font-weight:650}
.quarantaine{display:grid;gap:8px;padding:14px 16px;border-radius:var(--rayon);border:1.5px dashed var(--filet-fort);background:var(--surface)}
.quarantaine s{color:var(--texte-2)}
.fichier{display:inline-flex;align-items:center;gap:8px;font-weight:650;font-size:14px}
.fichier::before{content:"";width:12px;height:15px;border:1.5px solid currentColor;border-radius:2px}
.mem{display:grid;gap:14px;padding:18px;border-radius:var(--rayon);background:var(--surface);box-shadow:inset 0 0 0 1px var(--filet)}
.mem h4{font-size:12.5px;font-weight:700;color:var(--texte-2);letter-spacing:.01em}
.mem ul{display:grid;gap:6px;margin-top:6px}
.mem li{position:relative;padding:7px 10px;border-radius:6px;font-size:13.5px;line-height:1.35;background:var(--surface-2)}
.mem li.mem__vide{background:none;padding:0;color:var(--texte-2)}
.mem li[data-forme="proposition"]{background:none;outline:1.5px dashed var(--filet-fort);outline-offset:-1.5px}
.mem li .trace{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.mem li .trace rect{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:1;stroke-dashoffset:1}
.mem li[data-forme="decision"]{outline:none;background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.mem li[data-forme="decision"] .trace rect{stroke-dashoffset:0}
.mem__date{display:block;font-size:12px;color:var(--accent-texte);font-weight:650;margin-top:2px}
.taches{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tache{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--filet-fort);cursor:pointer;font-weight:560;font-size:14.5px;transition:box-shadow 160ms,background-color 160ms}
.tache input{width:18px;height:18px;accent-color:var(--agents);flex:none}
.tache:has(input:checked){background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--agents)}
.tache:has(input:disabled){opacity:.5;cursor:not-allowed}
.cas-l{margin-top:26px;border-top:1px solid var(--encre)}
.cas-l>li{border-bottom:1px solid var(--filet);padding:clamp(22px,3vw,34px) 0;display:grid;gap:18px 32px}
@media (min-width:1024px){.cas-l>li{grid-template-columns:minmax(0,.95fr) minmax(0,2fr)}}
.cas-l h3{font-size:clamp(1.2rem,1rem + .7vw,1.6rem);letter-spacing:-.02em}
.cas-l__cols{display:grid;gap:16px 24px}
@media (min-width:700px){.cas-l__cols{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cas-l__cols h4{font-size:13px;font-weight:700;color:var(--texte-2);margin-bottom:6px}
.cas-l__cols li{font-size:14px;line-height:1.4;margin-top:4px}
.mini-pistes{display:grid;gap:4px;margin-top:12px;max-width:260px}
.mini-pistes span{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--texte-2)}
.mini-pistes span::before{content:"";height:6px;border-radius:3px;background:var(--c);width:var(--w,60%)}
.interdits{display:grid;gap:0;margin-top:22px;border-top:2px solid var(--encre)}
.interdits li{display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding:16px 0;border-bottom:1px solid var(--filet);font-size:clamp(1.35rem,1rem + 1.6vw,2.4rem);font-weight:640;letter-spacing:-.03em;line-height:1.1}
.interdits li span{font-size:13.5px;font-weight:620;letter-spacing:0;color:var(--accent-texte);white-space:nowrap}
.roles{width:100%;border-collapse:collapse;margin-top:22px;font-size:14px}
.roles th,.roles td{text-align:left;vertical-align:top;padding:14px 14px 14px 0;border-bottom:1px solid var(--filet)}
.roles thead th{font-size:12.5px;color:var(--texte-2);font-weight:700;border-bottom:1px solid var(--encre)}
.roles td.interdit{font-weight:620;color:var(--encre)}
.roles td.interdit li::before{content:"Non\202F: ";color:#A3231B;font-weight:700}
.roles tbody tr{transition:background-color 160ms}
.roles tbody tr:hover,.roles tbody tr:focus-within{background:var(--surface)}
.roles li+li{margin-top:4px}
@media (max-width:899px){
  .roles thead{display:none}
  .roles tr{display:grid;gap:8px;padding:16px 0;border-bottom:1px solid var(--filet)}
  .roles td{border:0;padding:0}
  .roles td::before{content:attr(data-l);display:block;font-size:12px;font-weight:700;color:var(--texte-2)}
}
.gf{display:grid;gap:14px;margin-top:22px}
@media (min-width:900px){.gf{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gf li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding:16px;border-radius:var(--rayon);background:var(--surface)}
.gf__motif{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--agents)}
.gf__motif[data-m="pointillé"]{border-style:dashed}
.gf__motif[data-m="quarantaine"]{border-radius:6px}
.gf__motif[data-m="arrêt"]{border-color:var(--accent)}
.gf__motif[data-m="arrêt"]::after{content:"";width:12px;height:12px;transform:rotate(45deg);background:var(--accent);border-radius:2px}
.gf__motif[data-m="double"]{box-shadow:0 0 0 4px var(--surface),0 0 0 5.5px var(--agents)}
.gf__motif[data-m="drapeau"]::after,.gf__motif[data-m="interrupteur"]::after{content:"";width:20px;height:11px;border-radius:999px;border:1.5px solid var(--agents)}
.gf__motif[data-m="cadenas"]::after{content:"";width:12px;height:10px;border-radius:2px;background:var(--agents);box-shadow:0 -6px 0 -2px var(--surface),0 -7px 0 -1px var(--agents)}
.gf h3,.gf h4{font-size:15.5px;font-weight:600;letter-spacing:-.01em;margin-bottom:4px;color:var(--encre)}
.gf p{font-size:14px;color:var(--texte-2)}
.prop-dec{display:inline-flex;align-items:center;gap:12px;flex-wrap:wrap}
.prop-dec__l{position:relative;padding:8px 12px;border-radius:6px;outline:1.5px dashed var(--filet-fort);outline-offset:-1.5px;font-size:14px}
.prop-dec__l[data-forme="decision"]{outline:none}
.prop-dec__l .trace{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.prop-dec__l .trace rect{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:1;stroke-dashoffset:1}
.prop-dec__l[data-forme="decision"] .trace rect{stroke-dashoffset:0}
.pratiques{display:grid;gap:0;margin-top:22px;border-top:1px solid var(--encre)}
.pratiques li{display:grid;gap:6px 24px;padding:14px 0;border-bottom:1px solid var(--filet)}
@media (min-width:900px){.pratiques li{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;align-items:baseline}}
.pratiques b{font-weight:640}
.transm{display:grid;gap:8px;max-width:520px;margin-top:20px;padding:18px;border-radius:var(--rayon);background:var(--surface);box-shadow:inset 0 0 0 1px var(--filet)}
.transm__c{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--filet)}
.transm__c:last-of-type{border-bottom:0}
.transm__c b{font-size:14px}
.transm__c i{font-style:normal;font-size:12px;color:var(--texte-2);font-variant-numeric:tabular-nums}

/* W8 La coupe au mot */
.coupe__mots{display:flex;flex-wrap:wrap;gap:4px;margin-top:18px;font-size:clamp(1.2rem,1rem + .8vw,1.7rem);font-weight:600;letter-spacing:-.015em}
.coupe__mots button{min-height:44px;padding:0 8px;border-radius:6px;transition:background-color 160ms,color 160ms}
.coupe__mots button:hover{background:var(--surface-2)}
.coupe__mots button[data-coupe="1"]{color:var(--texte-2);text-decoration:line-through;text-decoration-thickness:2px}
.coupe__piste{display:flex;gap:2px;height:46px;margin-top:16px;padding:4px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.coupe__seg{flex:var(--g) 1 0;min-width:0;border-radius:4px;background:var(--agents);transform-origin:left center}

.circuit{display:grid;gap:0;margin-top:24px;border-top:1px solid var(--encre)}

.circuit .qui{font-size:12.5px;font-weight:650;color:var(--texte-2)}
.circuit .qui[data-h="1"]{color:var(--accent-texte)}

/* Services, devis, CV, livrable */
.offres{margin-top:24px;border-top:1px solid var(--encre)}
.offres li{display:grid;gap:8px 28px;padding:20px 0;border-bottom:1px solid var(--filet)}
@media (min-width:900px){.offres li{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,.8fr);align-items:baseline}}
.offres h3{font-size:18px}
.offres .lab{display:block;font-size:12px;font-weight:700;color:var(--texte-2);margin-bottom:2px}
.process{display:grid;gap:0;margin-top:24px}
@media (min-width:900px){.process{grid-template-columns:repeat(5,minmax(0,1fr))}}
.process li{position:relative;padding:22px 16px 0 0;border-top:2px solid var(--encre);font-weight:640;font-size:17px}
.process li span{display:block;font-size:12.5px;color:var(--texte-2);font-weight:650;margin-bottom:4px;font-variant-numeric:tabular-nums}
@media (max-width:899px){.process li{padding:14px 0 14px;border-top-width:1px}}
.formats{display:grid;gap:14px;margin-top:22px}
@media (min-width:900px){.formats{grid-template-columns:repeat(4,minmax(0,1fr))}}

.prefill{padding:14px 16px;border-radius:8px;background:var(--surface-2);font-size:14px}
.brief{display:grid;gap:14px;padding:clamp(18px,2.4vw,28px);border-radius:var(--rayon);background:var(--surface);box-shadow:inset 0 0 0 1px var(--filet)}
.brief .champ textarea{min-height:64px}
.cv-tete{display:grid;border-radius:var(--rayon);background:var(--surface-2);margin-top:clamp(16px,2.4vw,28px)}
@media (min-width:1024px){.cv-tete{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);aspect-ratio:16/9}}
.cv-tete__txt{padding:clamp(22px,3.6vw,52px);display:flex;flex-direction:column;justify-content:center;gap:18px}
.r60 li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;font-size:clamp(1rem,.95rem + .3vw,1.18rem);line-height:1.4;padding:7px 0;border-bottom:1px solid var(--filet)}
.r60 li span{color:var(--texte-2);font-size:13px;font-variant-numeric:tabular-nums;padding-top:3px}
.comp{display:grid;gap:0;margin-top:24px;border-top:1px solid var(--encre)}
@media (min-width:900px){.comp{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:44px}}
.comp>div{display:grid;gap:8px;padding:18px 0;border-bottom:1px solid var(--filet);align-content:start}
.comp h3{font-size:16px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.comp p{font-size:14.5px;color:var(--texte-2);line-height:1.5}
.sw{display:grid;gap:12px;margin-top:22px;grid-template-columns:repeat(3,minmax(0,1fr))}
.sw img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px}
.sw img:first-child{grid-column:span 2;aspect-ratio:auto;height:100%}
.livr-bandeau{position:sticky;top:var(--entete);z-index:30;background:var(--agents);color:#F4EFE6;font-size:13.5px;font-weight:650}
.livr-bandeau .wrap{display:flex;gap:10px;align-items:center;min-height:40px;flex-wrap:wrap}
.livr-bandeau .dot{border:1.5px dashed #F4EFE6;background:none}
.ouonenest{display:grid;gap:14px;padding:clamp(18px,2.6vw,30px);border-radius:var(--rayon);background:var(--surface);box-shadow:inset 0 0 0 1px var(--filet);margin-top:22px}
.ouonenest dt{font-size:12.5px;font-weight:700;color:var(--texte-2)}
.ouonenest dd{margin:3px 0 0;font-size:15.5px}
.livrables{margin-top:22px;border-top:1px solid var(--encre)}
.livrables li{display:grid;gap:10px 20px;padding:16px 0;border-bottom:1px solid var(--filet);align-items:center}
@media (min-width:800px){.livrables li{grid-template-columns:minmax(0,1fr) auto auto}}
.livrables .valide{font-size:13px;color:var(--accent-texte);font-weight:600}
.jalons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:22px}
.jalons li{position:relative;padding-top:24px;font-size:14px;font-weight:600;display:grid;gap:4px}
.jalons li::before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;background:var(--filet-fort)}
.jalons li::after{content:"";position:absolute;left:0;top:1px;width:14px;height:14px;transform:rotate(45deg) scale(.8);border:2px solid var(--agents);background:var(--surface);border-radius:2px}
.jalons li[data-e="fait"]::after,.jalons li[data-e="en cours"]::after{background:var(--agents)}
.jalons li[data-e="fait"]::before{background:var(--agents)}
.jalons li span{font-size:12.5px;color:var(--texte-2);font-weight:500}

/* ======================================================================
   CRÉATEUR : colonne 9:16 entre deux rails
   ====================================================================== */
.cr{display:grid;grid-template-columns:minmax(0,1fr);width:100%;max-width:1440px;margin-inline:auto;padding-inline:var(--gout)}
.cr__fil{min-width:0;width:100%;max-width:560px;margin-inline:auto;padding-block:clamp(20px,3vw,36px) clamp(56px,8vw,96px)}
.fil>*+*{margin-top:clamp(44px,7vw,72px)}
.rail{display:none}
@media (min-width:1100px){
  .cr{grid-template-columns:minmax(0,1fr) 440px minmax(0,1fr);column-gap:clamp(32px,4vw,72px);padding-inline:32px}
  .cr__fil{max-width:none}
  .rail{display:block;position:sticky;top:calc(var(--entete) + 36px);align-self:start;padding-top:clamp(20px,3vw,36px);max-width:300px}
  .rail--g{justify-self:end;text-align:right}
  .rail--d{justify-self:start}
  .mobile-seul{display:none!important}
}
.rail__t{font-size:12.5px;font-weight:700;color:var(--texte-2);padding-bottom:10px;border-bottom:1px solid var(--filet);margin-bottom:16px}
.rail dl{display:grid;gap:14px;margin:0}
.rail dt{font-size:12px;color:var(--texte-2);font-weight:600}
.rail dd{margin:2px 0 0;font-size:16px;font-weight:600;line-height:1.3}
.rail .lieu{font-size:26px;line-height:1.1}
.rail .cn{font-size:18px;color:var(--texte-2);margin-left:6px}
.rail--d .prix{font-size:22px}
.rail__poste{font-size:14.5px;line-height:1.4;color:var(--encre);margin-bottom:10px}
.rail__vide{font-size:14px;color:var(--texte-2)}
.rail__liste li{padding:10px 0;border-bottom:1px solid var(--filet);display:grid;gap:4px}
.rail__liste li[data-actif="true"] .lieu{color:var(--accent-texte)}
.rail__liste .prix{font-size:17px}
.cr-ouverture{display:grid;gap:18px}
.portrait-nuit{position:relative;background:radial-gradient(120% 70% at 50% 100%,#2A2724 0%,#141312 60%,#0E0D0C 100%)}
.portrait-nuit img{position:absolute;left:50%;bottom:-6%;height:104%;width:auto;max-width:none;transform:translateX(-50%)}
.cr-titres{font-size:13px;font-weight:650;color:var(--texte-2)}
.vignettes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vign{position:relative;display:block;text-decoration:none;color:var(--creme)}
.vign .fen{aspect-ratio:9/16}
.vign__t{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:14px;display:grid;gap:4px}
.vign__t b{font-size:17px;font-weight:800;text-transform:uppercase;letter-spacing:-.02em;line-height:1.02}
.vign__t span{font-size:12.5px;color:#D9D2C5}
.vign:hover .fen img,.vign:focus-visible .fen img{transform:scale(1.03)}
.vign .fen img{transition:transform 400ms var(--ease-arrivee)}
.typo-carte{position:absolute;inset:0;display:grid;place-items:center;padding:18px;text-align:center;font-weight:800;text-transform:uppercase;letter-spacing:-.03em;font-size:22px;line-height:1;background:var(--surface-2);color:var(--encre)}
.gal{display:grid;grid-auto-flow:column;grid-auto-columns:68%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;padding-inline:16%;scroll-padding-inline:16%;margin-inline:calc(var(--gout) * -1)}
@media (min-width:1100px){.gal{margin-inline:0;padding-inline:15%;scroll-padding-inline:15%;grid-auto-columns:70%}}
.gal::-webkit-scrollbar{display:none}
.gal:focus-visible{outline:2px solid var(--focus);outline-offset:4px}
.gal__it{scroll-snap-align:center;position:relative;transition:opacity 300ms var(--ease-arrivee)}
.gal__it[data-actif="false"]{opacity:.5}
.gal__it .fen{aspect-ratio:9/16}
.gal__it .sur-image{position:absolute;left:0;right:0;bottom:0;padding:16px;display:grid;gap:6px}
.gal__serie{font-size:12px;font-weight:700;color:#D9D2C5}
.gal__leg{display:grid;gap:8px;margin-top:16px;min-height:118px}
.gal__titre{font-size:clamp(1.05rem,.95rem + .4vw,1.25rem);font-weight:800;text-transform:uppercase;letter-spacing:-.02em;line-height:1.08}
.gal__vues{display:inline-block;font-size:clamp(1.8rem,1.4rem + 1.4vw,2.4rem);font-weight:800;letter-spacing:-.03em;line-height:1;transform-origin:left bottom}
.gal__nav{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px}
.onglets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.cadre-rec{position:relative}
.cadre-rec .fen{aspect-ratio:9/16}
.saisons{display:grid;grid-auto-flow:column;grid-auto-columns:132px;gap:8px;padding-bottom:8px;min-width:max-content}
.saison{position:relative;aspect-ratio:9/16;border-radius:8px;background:var(--surface);padding:12px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 0 0 0 1px var(--filet)}
.saison b{font-size:13.5px;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:1.08}
.saison span{font-size:12px;color:var(--texte-2);line-height:1.35}
.saison[data-pays="chine"]{box-shadow:inset 0 2px 0 var(--filet-fort),inset 0 0 0 1px var(--filet)}
/* Un seul rouge à l'écran : il marque la saison active (la dernière de la Chine), pas toutes */
.saison[data-actif="1"]{box-shadow:inset 0 3px 0 var(--rouge),inset 0 0 0 1px var(--filet)}
.saison[data-prep="1"]{background:none;box-shadow:none;outline:1.5px dashed var(--maurice);outline-offset:-1.5px}
.saison[data-prep="1"] b{color:var(--maurice)}
.carte-pays{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(6,minmax(48px,auto));gap:4px;padding:14px;border-radius:var(--rayon);background:var(--surface)}
/* Chaque pays occupe deux colonnes : les noms ne se chevauchent plus à 360 px */
.carte-pays a,.carte-pays span.p{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:650;text-decoration:none;line-height:1.15;min-height:44px;min-width:0;overflow-wrap:anywhere}
.carte-pays a{border-radius:6px;transition:background-color 160ms}
.carte-pays a:hover{background:var(--surface-2)}
.carte-pays .p i{width:8px;height:8px;border-radius:50%;background:var(--creme);flex:none}
.carte-pays .p[data-page="1"] i{background:var(--rouge)}
.carte-pays .p[data-avenir="1"]{color:var(--maurice)}
.carte-pays .p[data-avenir="1"] i{background:none;border:1.5px dashed var(--maurice)}
.hors-asie{font-size:13px;color:var(--texte-2);margin-top:10px}
.chiffres-cr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 16px}
.chiffres-cr .chiffre__v{font-weight:800}
.etat-pub li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--filet);font-size:14.5px}
.etat-pub b{font-weight:700}
.prep{position:relative;padding:20px;border-radius:var(--rayon);outline:1.5px dashed var(--maurice);outline-offset:-1.5px;display:grid;gap:10px}
.prep h2,.prep h3{color:var(--maurice)}
.villes{display:grid;gap:10px}
.ville{padding:16px 0;border-bottom:1px solid var(--filet);display:grid;gap:6px}
.ville h3{display:flex;align-items:baseline;gap:10px;font-size:30px;font-weight:400}
.ville h3 .cn{font-size:20px;color:var(--texte-2)}
.ville p{font-size:14.5px;color:var(--texte-2)}
.prix-l li{display:grid;gap:6px;padding:14px 0;border-bottom:1px solid var(--filet)}
.prix-l .poste{font-size:14.5px;line-height:1.4}
.prix-l .prix{font-size:20px}
.verdicts li{display:grid;gap:8px;padding:18px 0;border-bottom:1px solid var(--filet)}
.verdicts .lieu{font-size:24px}
.verdicts p{font-size:16px}
.guide-col{width:100%;max-width:640px;margin-inline:auto;padding:clamp(20px,3vw,36px) var(--gout) clamp(56px,8vw,96px)}
.guides-l li{display:grid;gap:8px;padding:20px 0;border-bottom:1px solid var(--filet)}
.guides-l h2{font-size:21px;font-weight:800;text-transform:uppercase;letter-spacing:-.02em}
.alerte{display:grid;gap:10px;margin-top:6px}
.alerte .champ input{min-height:46px}
.bases{display:grid;gap:10px}
@media (min-width:600px){.bases{grid-template-columns:repeat(3,minmax(0,1fr))}}
.base{aspect-ratio:9/12;border-radius:var(--rayon);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 2px 0 var(--filet-fort)}
@media (max-width:599px){.base{aspect-ratio:auto;min-height:160px}}
.base .lieu{font-size:28px;line-height:1}
.base .cn{font-size:18px;color:var(--texte-2)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.badge{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:999px;background:var(--surface-2);font-size:12.5px;font-weight:600}
.badge b{font-weight:800}
.check li{padding:4px 0;border-bottom:1px solid var(--filet)}
.check label{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;padding:14px 0;cursor:pointer;min-height:52px}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--rec)}
.check b{display:block;font-size:16.5px}
.check span{font-size:14.5px;color:var(--texte-2)}
.check input:checked+span b{text-decoration:line-through;text-decoration-thickness:2px;color:var(--texte-2)}
.liens-bio{display:grid;gap:10px}
.liens-bio a{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:0 20px;border-radius:999px;background:var(--surface);text-decoration:none;font-weight:650;font-size:16px;box-shadow:inset 0 0 0 1px var(--filet)}
.liens-bio a{transition:box-shadow 160ms,transform 160ms var(--ease-arrivee)}
.liens-bio a:hover{box-shadow:inset 0 0 0 1.5px var(--creme)}
.liens-bio a:active{transform:scale(.985)}
.liens-bio a>span[aria-hidden="true"]{display:inline-block;transition:transform 220ms var(--ease-arrivee)}
.liens-bio a:hover>span[aria-hidden="true"],.liens-bio a:focus-visible>span[aria-hidden="true"]{transform:translateX(3px)}
.liens-bio a.discret{background:none;box-shadow:none;justify-content:center;color:var(--texte-2);font-weight:550;font-size:14px}
.av{width:84px;height:84px;border-radius:50%;overflow:hidden;background:#232120;margin-inline:auto;position:relative}
.av img{position:absolute;left:50%;top:6%;width:180%;max-width:none;transform:translateX(-50%)}
.audience{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.audience .fen{aspect-ratio:9/16;padding:16px;display:flex;flex-direction:column;justify-content:space-between;background:var(--surface)}
.audience .fen b{font-size:13px;font-weight:700;color:var(--texte-2)}
.audience .big{font-size:clamp(1.5rem,1.05rem + 2vw,2.6rem);font-weight:800;letter-spacing:-.04em;line-height:1}
.formats-cr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.formats-cr li{aspect-ratio:9/16;border-radius:8px;background:var(--surface);padding:12px;display:flex;align-items:flex-end;font-size:13.5px;font-weight:750;line-height:1.15;box-shadow:inset 0 0 0 1px var(--filet)}

/* k15ze : sous-identité */
.k15{--fond:#0D0F0E;--surface:#151917;--surface-2:#1C211E;--encre:#F7F7F2;--texte-2:#9DA39F;--filet:#26302B;--filet-fort:#3A463F;--trait:#66726C;--accent:#3DDC84;--accent-texte:#3DDC84;--bouton:#3DDC84;--sur-bouton:#0D0F0E;--focus:#3DDC84;background:var(--fond);color:var(--encre)}
.anton{font-family:var(--f-anton);font-weight:400;letter-spacing:.005em;line-height:.92}
.vert{font-family:var(--f-serif);font-style:italic;font-weight:400;text-transform:none;color:#3DDC84;text-shadow:0 0 22px rgba(61,220,132,.42);letter-spacing:0}
.k15 .chiffre__v{font-family:var(--f-anton);font-weight:400;font-size:clamp(2.2rem,1.7rem + 2vw,3rem);letter-spacing:.01em}
.courses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.course .fen{aspect-ratio:9/16;background:var(--surface)}
.course .fen .typo{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-anton);font-size:clamp(1.6rem,6vw,2.4rem);color:#3DDC84;text-align:center;line-height:1}
.course h3{font-size:15px;font-weight:800;text-transform:uppercase;margin-top:10px}
.course p{font-size:13px;color:var(--texte-2);line-height:1.4;margin-top:4px}
.course .pz{display:flex;margin-top:6px;font-size:12px}
.sujets{display:flex;flex-wrap:wrap;gap:8px}
.sujets li{padding:8px 14px;border-radius:999px;background:var(--surface);font-weight:650;font-size:14.5px}

/* ======================================================================
   Commun : /now, contact, à propos, légal, 404
   ====================================================================== */
.now-g{display:grid;gap:clamp(24px,3vw,40px);margin-top:28px}
@media (min-width:1024px){.now-g{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);align-items:start}}
.now-pro{display:grid;gap:22px}
.now-mep{display:grid;align-content:end;gap:10px;padding:clamp(18px,2.6vw,30px);border-radius:var(--rayon);background:var(--surface);box-shadow:inset 0 0 0 1px var(--filet)}
@media (min-width:640px){.now-mep{aspect-ratio:16/9}}
.now-mep .grand{font-size:clamp(1.6rem,1.2rem + 1.8vw,2.8rem);font-weight:650;letter-spacing:-.03em;line-height:1.05}
.now-cr .fen{min-height:640px;padding:22px;display:flex;flex-direction:column;gap:18px;color:var(--creme)}
/* 9:16 est un minimum : la colonne grandit avec son contenu au lieu de le rogner */
@media (min-width:1024px){.now-cr .fen{aspect-ratio:9/16;min-height:auto;overflow:visible}}
.now-cr h2,.now-cr h3{color:var(--creme)}
.now-cr .mute,.now-cr .live,.now-cr .pz{color:#B9B2A6}
.now-cr .live[data-etat="enDirect"] i{background:var(--rec)}
.now-cr .vid{position:relative;aspect-ratio:16/10;border-radius:8px;overflow:hidden}
.now-cr li{padding:8px 0;border-bottom:1px solid #2C2A27;font-size:14px}
.liens-tous{display:grid;gap:clamp(24px,3vw,44px);margin-top:24px}
@media (min-width:900px){.liens-tous{grid-template-columns:repeat(2,minmax(0,1fr))}}
.liens-tous h3{display:flex;align-items:center;gap:10px;font-size:18px;padding-bottom:10px;border-bottom:1px solid var(--encre)}
.liens-tous li{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 14px;padding:4px 0;border-bottom:1px solid var(--filet)}
.liens-tous li>span{font-weight:620;min-height:44px;display:inline-flex;align-items:center}
.liens-tous li div{display:flex;flex-wrap:wrap;gap:0 14px}
.intentions{display:grid;gap:10px;margin-top:26px}
@media (min-width:700px){.intentions{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.intentions{grid-template-columns:repeat(3,minmax(0,1fr))}}
.intention{display:flex;align-items:center;gap:14px;min-height:72px;padding:0 20px;border-radius:var(--rayon);background:var(--surface);box-shadow:inset 0 0 0 1px var(--filet);font-weight:620;font-size:16px;text-align:left;transition:box-shadow 160ms,transform 160ms var(--ease-arrivee)}
.intention:hover{box-shadow:inset 0 0 0 1.5px var(--encre)}
.intention:active{transform:scale(.99)}
.intention[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--encre)}
.intention i{width:10px;height:10px;border-radius:50%;flex:none;border:1.5px solid var(--encre)}
.intention[data-cote="pro"] i{background:var(--prod);border-color:var(--prod)}
.intention[data-cote="createur"] i{background:var(--rec);border-color:var(--rec)}
.suite{margin-top:24px;padding:clamp(18px,2.6vw,30px);border-radius:var(--rayon);background:var(--surface-2)}
.ap-g{display:grid;gap:clamp(20px,3vw,32px);margin-top:28px;align-items:end}
@media (min-width:900px){.ap-g{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}
.ap-pro{aspect-ratio:16/9;background:var(--surface-2)}
.ap-pro img{position:absolute;left:62%;top:6%;height:150%;width:auto;max-width:none;transform:translateX(-50%)}
.ap-cr{aspect-ratio:9/16;max-height:520px;margin-left:auto}
.versions-site li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--filet)}
.err-g{display:grid;gap:18px;margin-top:28px;align-items:end}
@media (min-width:800px){.err-g{grid-template-columns:minmax(0,1.6fr) minmax(0,.7fr)}}
.fen-vide{display:grid;place-items:center;text-decoration:none;box-shadow:inset 0 0 0 1.5px var(--filet-fort);background:transparent;transition:box-shadow 200ms}
.fen-vide:hover{box-shadow:inset 0 0 0 1.5px var(--encre)}
.fen-vide span{display:inline-flex;align-items:center;gap:10px;font-weight:650}
.fen-vide.r916{background:var(--nuit);color:var(--creme);max-height:420px;margin-left:auto;box-shadow:none}
.legal dl{display:grid;gap:0;margin-top:22px;border-top:1px solid var(--encre)}
.legal dl>div{display:grid;gap:4px 24px;padding:14px 0;border-bottom:1px solid var(--filet)}
@media (min-width:800px){.legal dl>div{grid-template-columns:220px minmax(0,1fr)}}
.legal dt{font-weight:650}
.legal dd{margin:0}

/* ======================================================================
   PALETTE ⌘K · PANNEAU DE SIMULATION · APERÇU · IRIS
   ====================================================================== */
#palette{width:min(640px,calc(100vw - 32px));padding:0;border:0;border-radius:14px;background:var(--fond);color:var(--encre);box-shadow:0 40px 100px -30px rgba(0,0,0,.55),0 0 0 1px var(--filet)}
#palette::backdrop{background:rgba(14,13,12,.4)}
.pal__q{width:100%;min-height:58px;padding:0 20px;border:0;border-bottom:1px solid var(--filet);background:transparent;font-size:17px;outline:none}
.pal__l{max-height:min(60vh,460px);overflow:auto;padding:8px}
.pal__l a,.pal__l button{display:flex;justify-content:space-between;align-items:center;gap:14px;width:100%;min-height:48px;padding:8px 12px;border-radius:8px;text-decoration:none;text-align:left}
.pal__l a:focus,.pal__l button:focus,.pal__l a:hover,.pal__l button:hover{background:var(--surface-2);outline:none}
.pal__l small{color:var(--texte-2);font-size:12.5px;white-space:nowrap}
.pal__aide{padding:10px 20px 14px;font-size:12.5px;color:var(--texte-2);border-top:1px solid var(--filet)}
#iris-point{position:fixed;left:0;top:0;z-index:95;pointer-events:none;display:flex;align-items:center;gap:8px}
#iris-point .ip-dots{position:relative;width:12px;height:12px}
#iris-point .ip-dots i{position:absolute;inset:0;border-radius:50%}
#iris-point[data-de="prod"] .ip-de{background:var(--prod)}
#iris-point[data-de="rec"] .ip-de{background:var(--rec)}
#iris-point[data-de="neutre"] .ip-de{background:#16181C}
#iris-point[data-vers="prod"] .ip-vers{background:var(--prod)}
#iris-point[data-vers="rec"] .ip-vers{background:var(--rec)}

function brancherEcl(root, stack) {
  var w = $("[data-ecl]", root);
  if (!w) return;
  var tabs = $$("[role=tab]", w), fiche = $(".ecl__fiche", w);
  function choisir(k, focus) {
    tabs.forEach(function (t0) { var on = t0.getAttribute("data-plan") === k; t0.setAttribute("aria-selected", String(on)); t0.tabIndex = on ? 0 : -1; if (on && focus) t0.focus(); });
    $$(".ecl__pl", w).forEach(function (p) { p.setAttribute("data-actif", String(p.getAttribute("data-plan") === k)); });
    fiche.setAttribute("aria-labelledby", "ecl-t-" + k);

    $$(".chip", fiche).forEach(function (c, i) { if (!reduit()) c.animate([{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "none" }], { duration: 240, delay: i * 40, easing: E_ARR, fill: "backwards" }); });

      var d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
      if (d) { e.preventDefault(); var n = tabs[(i + d + tabs.length) % tabs.length]; choisir(n.getAttribute("data-plan"), true); }
    });

  $$(".ecl__pl", w).forEach(function (p) { p.addEventListener("click", function () { choisir(p.getAttribute("data-plan")); }); });
}
/* Pipeline rejoué (+ W9 le drapeau pour Oshii) */
function pipeHTML(a) {

    return '<div class="pipe"><p class="t2" style="max-width:22ch">' + T(a.slug === "croc" ? "Pas d'IA ici, et c'est un choix." : a.ia.resume) + "</p>" +
      (a.slug === "croc" ? '<p class="lead" style="margin-top:12px">' + T(a.ia.resume.replace(/^Pas d'IA ici, et c'est un choix : /, "")) + "</p>" : "") + "</div>";
  }
  return '<div class="pipe" data-pipe>' +
    '<p class="simu">Simulation · données d\'exemple</p>' +
    '<ol style="margin-top:18px">' + a.ia.pipeline.map(function (s, i) { return '<li data-i="' + i + '" data-s="attente"><span>' + T(s) + "</span></li>"; }).join("") + "</ol>" +
    '<div class="pipe__ctrl"><button class="btn" type="button" data-pipe-jouer>Rejouer le pipeline</button>' +
      (a.slug === "oshii" ? '<button class="interrupteur" type="button" role="switch" aria-checked="false" data-pipe-echec><span class="interrupteur__piste" aria-hidden="true"></span>Échec de l\'analyse directe</button>' : "") +
    "</div>" +
    '<p class="pipe__note" data-pipe-note aria-live="polite" hidden></p></div>';
}
function brancherPipe(root, a) {
  var p = $("[data-pipe]", root);
  if (!p) return;
  var ol = $("ol", p), note = $("[data-pipe-note]", p), sw = $("[data-pipe-echec]", p), jeu = 0;
  function etapes() { return $$("li", ol); }
  function jouerPipe() {
    var mon = ++jeu, echec = sw && sw.getAttribute("aria-checked") === "true", apresEchec = false;
    note.hidden = true;
    etapes().forEach(function (li) { li.setAttribute("data-s", "attente"); });
    var l = etapes(), i = 0;
    (function suivant() {
      if (mon !== jeu) return;
      if (i >= l.length) {
        note.hidden = false;
        note.textContent = U.fr(net((echec ? "Repli : " + a.ia.repli.charAt(0).toLowerCase() + a.ia.repli.slice(1) + " " : (a.ia.repli && a.slug !== "oshii" ? a.ia.repli + " " : "")) + a.ia.rejoue));
        return;
      }
      var li = l[i];
      if (li.hasAttribute("data-virtuel")) { li.setAttribute("data-s", "echec"); apresEchec = true; }
      else li.setAttribute("data-s", apresEchec ? "repli" : "fait");
      i++;
      setTimeout(suivant, reduit() ? 0 : 300);
    })();
  }
  $("[data-pipe-jouer]", p).addEventListener("click", jouerPipe);
  if (sw) sw.addEventListener("click", function () {
    var on = sw.getAttribute("aria-checked") !== "true";
    sw.setAttribute("aria-checked", String(on));
    var v = $("[data-virtuel]", ol);
    if (on && !v) {
      var li = document.createElement("li");
      li.setAttribute("data-virtuel", "1"); li.setAttribute("data-s", "attente");
      li.innerHTML = "<span>Analyse directe de la vidéo (Gemini) : échec simulé</span>";
      ol.insertBefore(li, etapes()[2]);
      if (!reduit()) li.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180, easing: E_ARR });
    } else if (!on && v) { v.remove(); }
    jouerPipe();
  });
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (e) { if (e[0].isIntersecting) { io.disconnect(); jouerPipe(); } }, { threshold: 0.4 });
    io.observe(p);
    S.nettoyage.push(function () { io.disconnect(); jeu++; });
  }
}

/* Raccourcit au dernier mot entier (jamais au milieu d'un mot), avec « … » */
function courtAuMot(s, n) {
  s = String(s || "");
  if (s.length <= n) return s;
  var c = s.slice(0, n + 1), i = c.lastIndexOf(" ");
  return (i > n * 0.5 ? c.slice(0, i) : s.slice(0, n)).replace(/[\s,;:·-]+$/, "") + "…";
}

    .concat(["", "Pour un deuxième voyage : " + V(it.options), "", "Ce que ça m'a coûté (prix vécus, pas des tarifs garantis) :"])
    .concat(CH.prixVecus.lignes.map(function (l) { return "- " + l.poste + " : " + l.prix; })).join("\n");
}

        "<h3>" + T(c.nom) + (c.lieu ? " " + T(c.lieu) : "") + '</h3><p class="anton" style="color:#3DDC84;font-size:20px;margin-top:4px">' + esc(d) + "</p><p>" + T(c.texte) + "</p>" +
        (c.video ? '<p>' + T(c.video.titre) + " · " + T(c.video.duree) + " · " + T(c.video.vues) + " vues</p>" + pz({ statut: "observé", date: c.video.vuesLe, source: "YouTube" }) : "") + pz(c) + (c.droits ? trou(c.droits.aConfirmer) : "") + "</div>";
    }).join("") + "</div></section>" +
    '<section style="margin-top:56px"><h2 class="t2">Derniers Shorts</h2><p class="mute" style="margin-top:10px">Ils arrivent ici dès que le flux de la chaîne est branché. En attendant, ils sont sur YouTube.</p>' + trouBloc(K.live.sources.youtubeRss.aConfirmer) + trouBloc(k.pontWado.aConfirmer, "Wado") + "</section>" +
    "</div></div>";
  return { html: html };
};
