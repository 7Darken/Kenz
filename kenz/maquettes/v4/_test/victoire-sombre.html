<style>
:root{
  --kz-bg:#0E1220;
  --kz-surface:#151B2C;
  --kz-ink:#F4EFE6;
  --kz-muted:rgba(244,239,230,.72);
  --kz-line:rgba(244,239,230,.12);
  --kz-accent:#E9B872;
  --kz-radius:32px;
  --kz-title:"Melodrama","Instrument Serif",Georgia,serif;
  --kz-text:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --kz-word:"Instrument Serif",Georgia,serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--kz-bg)}
body{margin:0; color:var(--kz-ink); font:400 17px/1.5 var(--kz-text); overflow-x:clip}
.nav{position:fixed; top:0; left:0; right:0; z-index:50; display:flex; align-items:center; height:64px; padding:0 clamp(16px,4vw,56px); font-family:var(--kz-title); font-weight:600; font-size:28px; color:var(--kz-ink); pointer-events:none}
.bloc{display:grid; place-items:center; min-height:60vh; padding:0 24px; font-family:var(--kz-word); font-style:italic; font-size:22px; color:var(--kz-muted)}
.y{position:absolute; left:0; width:1px; height:1px}
</style>
