  ============================================================================
  CONCEPT
  Le site est une table de studio aux matières validées par Kenz.
  Pro : lumière froide de jour, chaque app est un objet posé (icône réelle en
  relief, plaque à sa couleur pour Wado, plaque neutre pour Croc tant que ses
  couleurs ne sont pas confirmées). Créateur : « pâte pastel sur bleu nuit »,
  des objets-preuves qui portent un prix vécu, du verre seulement au-dessus
  d'une vraie image. Aucun asset 3D : tout est en CSS (rendu provisoire).

  VUES (38 routes de KENZ.routes, routeur hash #/…, + alias #/chine → #/itineraire/chine)
  Communes  : /  /now  /contact  /a-propos  /mentions-legales  /confidentialite  /404
  Pro       : /pro  /pro/apps  /pro/apps/{oshii,sago,wado,croc,miru,zenko,escapades-libres,ce-site}
              /pro/agents  /pro/agents/{veille,contenu,llm-produit,agents-de-code,memoire-equipe,back-office}
              /pro/video  /pro/services  /pro/devis  /pro/cv  /livrable/demo
  Créateur  : /moi  /asie  /asie/chine  /guides  /itineraire/chine  /avant-de-partir/chine
              /k15ze  /liens  /collaborer
  Anciennes URL gérées : /apps/x et /projets/x → /pro/apps/x ; /destination/x → /asie.

  INTERACTIONS SIGNATURE
  1. La lumière change (le point) : les objets sortent (descente 12 px, ombre
     resserrée, 240 ms, --ease-sortie), le studio jour passe au bleu nuit
     (calques de lumière en opacité, 500 ms), les nouveaux objets se posent
     (260 ms, 60 ms d'écart). Réduit : fondu de 120 ms.
  2. W10 La vue éclatée « Sous le capot » : 5 plaques CSS 3D (App · API ·
     Données · IA · Infra) aux vraies étiquettes (apps[].stack) ; 28 px
     d'écart, 60 ms de décalage, 480 ms au total ; clic → fiche du plan.
     Sur /pro/agents : vue éclatée d'une équipe (Hermes · Rôles · Mémoire ·
     Garde-fous · Vous) ; « Lancer » fait descendre un jeton jusqu'à « Vous »
     (W6 : anneau tracé une fois, options 1/2/3 au clavier, rien ne part
     avant « Valider »), démo d'injection mise en quarantaine.
  3. L'objet en main : survol/focus → soulevé de 8 px, ombre élargie et
     adoucie (320 ms, expo.out). Aucun tilt.
  4. L'étagère de progression (/pro, /pro/apps) : objets posés dans l'ordre
     de sortie (Zenko → Wado), −12 px + ombre de contact (260 ms, 80 ms
     d'écart), date de sortie par la fente (W2).
  5. W11 Les objets-preuves (/asie/chine, /itineraire/chine) : avion ≈ 100 €,
     train moins de 9 €, lit 25 €, bol 7–8 €, téléphone ≈ 10 € (200 € barré,
     W4) ; descente 12 px + ombre, prix par la fente ; aucun total.
  6. Le bloc de verre : titres posés sur une vraie image (portrait, pays) ;
     glisse de 24 px en 420 ms, flou 26 px, liseré blanc 16 % ; jamais sur un
     fond uni.
  + socle : W2 fente, W3 pastille de preuve, W4 prix barré, W5 tampon,
    W6 arrêt obligatoire, W8 coupe au mot, W9 drapeau, W15 fiche
    « Où on en est », ⌘K, panneau de simulation, sélecteur FR/EN.

  CHOIX FORTS
  - Deux casquettes séparées par la LUMIÈRE et la PLACE DE LA NAVIGATION :
    Pro = îlot de navigation en haut, vouvoiement sur les pages clients ;
    Créateur = dock au pouce en bas (4 cibles), tutoiement, titres en capitales.
    Le point mène toujours au hub d'en face, avec un libellé visible.
  - Les agents IA sont un savoir-faire installé chez un client (catalogue de
    6 problèmes, démo étiquetée « Simulation », « ce que je n'automatise
    pas » en plaque sombre). Hermes est le seul nom propre. Aucun usage privé.
  - Aucune librairie : le mouvement est en CSS + Web Animations natives
    (transform / opacity / clip-path / flou léger). Zéro requête réseau hors
    Google Fonts : la maquette marche en file:// et si un CDN tombe.
  - Responsive par requêtes de conteneur (#app) : l'aperçu 390 px du panneau
    de simulation est fidèle au vrai mobile.
  - Typo du socle uniquement (Inter + Instrument Serif) — « la matière est
    l'accent » ; Anton seulement sur /k15ze ; Noto Sans SC/JP en sous-ensemble.
  - Les chiffres « à confirmer » ne s'affichent que dans le mode « trous ».
  ============================================================================
-->

.entete .btn-s{margin-left:4px}

/* Créateur : en-tête libre en haut, dock au pouce en bas */
.entete-crea{position:relative;top:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px clamp(16px,4.2cqi,56px) 0;pointer-events:auto}

.entete-crea .droite{display:flex;align-items:center;gap:6px}
.note-langue{font-size:.74rem;color:var(--texte-2);max-width:18ch;line-height:1.3}
.dock{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;display:flex;justify-content:center;padding:0 12px;pointer-events:none;margin-top:24px}
.dock-in{pointer-events:auto;display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--surface);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 0 0 1px rgba(255,255,255,.06),0 22px 44px -18px rgba(var(--o),.9)}
.dl{position:relative;isolation:isolate;display:grid;place-items:center;min-width:68px;min-height:50px;padding:0 18px;border-radius:999px;font-weight:800;font-size:.8rem;letter-spacing:.07em;text-transform:uppercase;color:var(--texte-2);text-decoration:none}
.dl::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--accent);opacity:0;z-index:-1;transform:scale(.9);transition:opacity 220ms var(--ease-arrivee),transform 220ms var(--ease-arrivee)}
.dl:hover{color:var(--encre)}

.pied{margin-top:auto;padding:clamp(48px,6cqi,80px) 0 calc(36px + env(safe-area-inset-bottom))}

.pied .wm{font-size:2rem}
.pied-nav{display:flex;flex-wrap:wrap;gap:4px 2px;justify-content:flex-end}
.pied-nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 10px;border-radius:999px;font-size:.86rem;color:var(--texte-2);text-decoration:none}
.pied-nav a:hover{color:var(--encre)}
.pied-mention{grid-column:1/-1;font-size:.74rem;color:var(--texte-2)}

/* Menu mobile (hors #app) */
.menu-m{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;justify-content:space-between;padding:96px 24px calc(32px + env(safe-area-inset-bottom));background:#F3F5F3;opacity:0;visibility:hidden;pointer-events:none;transition:opacity 260ms var(--ease-arrivee),visibility 0s linear 260ms}
.menu-m.ouvert{opacity:1;visibility:visible;pointer-events:auto;transition:opacity 260ms var(--ease-arrivee),visibility 0s}
.menu-m :focus-visible{outline-color:#1B1D1C}
.menu-m a.mm{display:block;padding:10px 0;font-size:2.2rem;font-weight:600;letter-spacing:-.03em;color:#1B1D1C;text-decoration:none;opacity:0;transform:translateY(28px);transition:transform 520ms var(--ease-arrivee),opacity 360ms var(--ease-arrivee);transition-delay:calc(var(--k,0) * 60ms + 80ms)}
.menu-m.ouvert a.mm{opacity:1;transform:none}
.menu-m .mm-bas{display:flex;flex-direction:column;gap:12px;color:#1B1D1C}
.menu-fermer{position:absolute;top:24px;right:20px;width:48px;height:48px;border-radius:50%;border:0;background:rgba(27,29,28,.07);color:#1B1D1C}

/* ===================================================================== */
/* 6. OBJETS (la matière)                                                 */
/* ===================================================================== */
.pose{position:relative;display:inline-block;width:var(--t,120px);flex:none}
.ombre{position:absolute;left:9%;right:9%;bottom:-8%;height:17%;border-radius:50%;background:radial-gradient(closest-side,rgba(var(--o),.34),rgba(var(--o),0));transform-origin:50% 50%;transition:transform 320ms var(--ease-arrivee),opacity 320ms var(--ease-arrivee);pointer-events:none}
:root[data-cote="createur"] .ombre{background:radial-gradient(closest-side,rgba(2,5,16,.62),rgba(2,5,16,0))}
.obj{position:relative;display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:28%;background:linear-gradient(165deg,#FFFFFF 0%,#F2F4F1 44%,#DEE3DE 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -3px 7px rgba(27,29,28,.08),0 1px 1px rgba(27,29,28,.10),0 12px 20px -12px rgba(27,29,28,.26);transition:transform 320ms var(--ease-arrivee)}
.obj img{width:74%;aspect-ratio:1;object-fit:cover;border-radius:23%;box-shadow:0 0 0 .5px rgba(27,29,28,.12),0 1px 0 rgba(255,255,255,.6),0 4px 9px -3px rgba(27,29,28,.32)}
.obj.logo img{object-fit:contain;box-shadow:none;border-radius:0;width:62%}
.obj-plaque{background:linear-gradient(165deg,color-mix(in srgb,var(--app) 78%,#fff) 0%,var(--app) 52%,color-mix(in srgb,var(--app) 82%,#000) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -4px 8px rgba(0,0,0,.16),0 1px 1px rgba(27,29,28,.12),0 12px 20px -12px rgba(27,29,28,.3)}
.obj-plaque .mono{font-weight:700;font-size:calc(var(--t,120px) * .42);line-height:1;letter-spacing:-.05em;color:#FFFDF5;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.obj-neutre{--app:#E6DFD3}
.obj-neutre .mono{color:#1B1D1C;text-shadow:0 1px 0 rgba(255,255,255,.7)}
/* L'objet en main : soulevé au survol (pointeur fin seulement) ou au focus, reposé à l'appui */
a:focus-visible .obj,button:focus-visible .obj{transform:translateY(-8px)}
a:focus-visible .ombre,button:focus-visible .ombre{transform:scale(1.22,1.35);opacity:.6}
@media (hover:hover){
  a:hover .obj,button:hover .obj,.main:hover .obj{transform:translateY(-8px)}
  a:hover .ombre,button:hover .ombre,.main:hover .ombre{transform:scale(1.22,1.35);opacity:.6}
}
a:active .obj{transform:translateY(-3px);transition-duration:120ms}
a:active .ombre{transform:scale(1.08,1.12);opacity:.85;transition-duration:120ms}

/* Pâte pastel (objets-preuves, CSS provisoire) */
.pp{position:relative;display:block;width:var(--t,132px);aspect-ratio:1.15;transition:transform 320ms var(--ease-arrivee)}
.pp>span{position:absolute;display:block}
.pa{--c1:#FFDCC7;--c2:#F6B48F;--c3:#D9906C;background:radial-gradient(120% 130% at 30% 18%,var(--c1) 0%,var(--c2) 50%,var(--c3) 100%);box-shadow:inset 0 2px 2px rgba(255,255,255,.35),inset 0 -5px 9px rgba(60,20,10,.18)}

.pp-train .s{left:0;top:80%;width:100%;height:3.5%;border-radius:4px}
.pp-lit .t{left:6%;top:14%;width:13%;height:64%;border-radius:14px}
.pp-lit .s{left:10%;top:57%;width:84%;height:22%;border-radius:12px}
.pp-lit .m{left:13%;top:45%;width:79%;height:16%;border-radius:10px}
.pp-lit .o{left:19%;top:35%;width:23%;height:14%;border-radius:999px}
.pp-lit .c{left:43%;top:41%;width:50%;height:21%;border-radius:10px 16px 10px 10px}
.pp-bol .b{left:13%;top:41%;width:74%;height:42%;border-radius:8% 8% 50% 50%/12% 12% 88% 88%}
.pp-bol .r{left:11%;top:34%;width:78%;height:15%;border-radius:50%}
.pp-bol .n{left:20%;top:37%;width:60%;height:8%;border-radius:50%;background:radial-gradient(60% 100% at 50% 40%,#FFE8C9,#E9B985)}
.pp-bol .p1{left:50%;top:6%;width:4%;height:50%;border-radius:999px;transform:rotate(26deg)}
.pp-bol .p2{left:58%;top:7%;width:4%;height:50%;border-radius:999px;transform:rotate(36deg)}
.pp-bol .pi{left:36%;top:80%;width:28%;height:6%;border-radius:6px}
.pp-tel .c{left:30%;top:4%;width:40%;height:86%;border-radius:20%/11%}
.pp-tel .e{left:34%;top:10%;width:32%;height:74%;border-radius:14%/7%;background:linear-gradient(170deg,#33447A,#1E2A47)}
.pp-tel .n{left:44%;top:12.5%;width:12%;height:3%;border-radius:999px;background:#F4EFE6}
.pp-tel .l{left:38%;top:52%;width:24%;height:2.5%;border-radius:2px;background:rgba(244,239,230,.28);transform:rotate(-24deg)}

/* ===================================================================== */
/* 7. RÉVÉLATIONS (uniquement transform / opacity / clip-path / flou)     */
/* ===================================================================== */
.js-anim [data-pose]{transition:transform calc(260ms) var(--ease-arrivee),opacity 220ms var(--ease-arrivee);transition-delay:calc(var(--d,0) * 1ms)}
.js-anim [data-pose]:not(.vu){opacity:0;transform:translateY(-12px)}
.js-anim [data-pose]:not(.vu) .ombre{opacity:0;transform:scale(.55)}
.js-anim [data-pose] .ombre{transition-delay:calc(var(--d,0) * 1ms + 60ms)}
.js-anim [data-rv]{transition:opacity calc(500ms * var(--mult)) var(--ease-arrivee);transition-delay:calc(var(--d,0) * 1ms)}
.js-anim [data-rv]:not(.vu){opacity:0}
.fente{display:inline-flex;overflow:hidden;overflow:clip;vertical-align:bottom;padding-block:.1em;margin-block:-.1em}
.fente>span{display:inline-block;transition:transform 320ms var(--ease-arrivee);transition-delay:calc(var(--d,0) * 1ms + var(--fd,160) * 1ms)}
.js-anim [data-rv]:not(.vu) .fente>span,.js-anim [data-pose]:not(.vu) .fente>span{transform:translateY(112%)}

/* ===================================================================== */
/* 8. PREUVES : pastille (W3), live, trous                                 */
/* ===================================================================== */
.pst{display:inline-flex;align-items:center;gap:7px;font-size:.74rem;line-height:1.35;color:var(--texte-2);font-weight:500;text-align:left}
.pst i{flex:none;width:8px;height:8px;border-radius:50%}
.pst[data-forme="plein"] i{background:var(--accent)}
.pst[data-forme="demi"] i{box-shadow:inset 0 0 0 1.5px var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.pst[data-forme="contour"] i{box-shadow:inset 0 0 0 1.5px var(--texte-2)}
.pst[data-forme="pointille"] i{border:1.5px dashed var(--texte-2)}
.pst-t{display:inline-block;transition:transform 200ms var(--ease-arrivee)}
.chf{display:flex;flex-direction:column;gap:6px}
.chf-v{position:relative;align-self:flex-start;font-size:clamp(1.8rem,1.2rem + 1.8cqi,2.6rem);font-weight:600;letter-spacing:-.03em;line-height:1.05}
.chf-v::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:1.5px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform 200ms var(--ease-arrivee)}
.chf:hover .chf-v::after{transform:scaleX(1)}
.chf:hover .pst-t{transform:translateX(4px)}
.chf-l{font-size:.92rem;color:var(--encre)}
:root[data-cote="createur"] .chf-v{font-weight:800}
.lv{display:inline-flex;align-items:center;gap:7px;font-size:.74rem;color:var(--texte-2);font-weight:500}
.lv i{position:relative;flex:none;width:8px;height:8px;border-radius:50%}
.lv[data-etat="direct"] i{background:var(--accent)}
/* arrivée du relevé : le point se pose une fois (pas de pulsation, § 9.1) */
.lv.arrive i{animation:lv-pose 260ms var(--ease-arrivee) both}
@keyframes lv-pose{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
.lv[data-etat="retard"] i{box-shadow:inset 0 0 0 1.5px var(--texte-2)}
.lv[data-etat="indispo"] i{border:1.5px dashed var(--texte-2)}
/* « en retard » : la valeur passe en gris lisible (≥ 4,5:1), jamais en opacité */
.gris,.gris *{color:var(--texte-2)!important}
.sq{display:block;height:1em;border-radius:8px;background:linear-gradient(90deg,rgba(var(--o),.07),rgba(var(--o),.12),rgba(var(--o),.07))}
:root[data-cote="createur"] .sq,.nuit-local .sq{background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.11),rgba(255,255,255,.06))}
.trou{display:none}
html.trous .trou{display:block;margin-block:10px;padding:10px 14px;border-radius:14px;border:1.5px dashed currentColor;font-size:.82rem;line-height:1.45;color:var(--encre);background:rgba(var(--o),.03)}
html.trous span.trou{display:inline-block;margin:4px 0}
.trou-t{display:block;font-weight:700}
.trou-q{display:block;color:var(--texte-2)}
.etiquette-sim{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:10px;font-size:.78rem;font-weight:600;color:var(--encre);background:repeating-linear-gradient(-45deg,rgba(var(--o),.05) 0 6px,rgba(var(--o),.02) 6px 12px);box-shadow:inset 0 0 0 1px rgba(var(--o),.14)}
.etiquette-sim svg{width:14px;height:14px}

/* Tampon (W5) */
.tampon{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;border:2px solid currentColor;color:var(--accent-texte);font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;transform:rotate(-4deg);background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(var(--o),.03) 3px 4px)}
.tampon.pose-t{animation:tampon-in 160ms var(--ease-arrivee) both}
@keyframes tampon-in{from{opacity:0;transform:rotate(-4deg) scale(1.04)}to{opacity:1;transform:rotate(-4deg) scale(1)}}

/* Anneau W6 (tracé une fois, rotation de deux demi-cercles) */
.anneau{position:relative;width:46px;height:46px;flex:none}
.anneau .moitie{position:absolute;inset:0;overflow:hidden}
.anneau .m1{clip-path:inset(0 0 0 50%)}
.anneau .m2{clip-path:inset(0 50% 0 0)}
.anneau .m1::before,.anneau .m2::before{content:"";position:absolute;inset:0;border-radius:50%;border:2.5px solid var(--encre)}
.anneau .m1::before{clip-path:inset(0 50% 0 0);transform:rotate(0deg)}
.anneau .m2::before{clip-path:inset(0 0 0 50%);transform:rotate(0deg)}
.anneau.trace .m1::before{animation:demi 600ms linear forwards}
.anneau.trace .m2::before{animation:demi 600ms linear 600ms forwards}
.anneau.fait .m1::before,.anneau.fait .m2::before{transform:rotate(180deg)}
@keyframes demi{to{transform:rotate(180deg)}}
.anneau .c{position:absolute;inset:13px;border-radius:50%;background:var(--encre)}

/* ===================================================================== */
/* 9. VERRE (seulement au-dessus d'une vraie image)                        */
/* ===================================================================== */
.image-v{position:relative;overflow:hidden;border-radius:var(--r-noyau);background:#1A2442}
.image-v>img{width:100%;height:100%;object-fit:cover}
.verre{position:absolute;padding:16px 20px;border-radius:20px;background:rgba(28,27,26,.56);text-shadow:0 1px 12px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(26px) saturate(1.12);backdrop-filter:blur(26px) saturate(1.12);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.24),inset 0 -1px 0 rgba(0,0,0,.25),0 26px 48px -26px rgba(0,0,0,.6);color:#F4EFE6;transition:transform 420ms var(--ease-arrivee),opacity 300ms var(--ease-arrivee);transition-delay:calc(var(--d,0) * 1ms + 120ms)}
.verre .h-l,.verre .h-m,.verre .h-xl{color:#F4EFE6}
.verre .micro{color:#F4EFE6!important;font-weight:600}
.js-anim [data-rv]:not(.vu) .verre{opacity:0;transform:translateY(24px)}

/* ===================================================================== */
/* 10. CARREFOUR (/)                                                      */
/* ===================================================================== */
.carrefour{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:0;min-height:calc(100dvh - 86px);padding:clamp(16px,2cqi,28px) clamp(16px,2cqi,28px) 0}
.porte{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:clamp(24px,4cqi,64px)}
.porte-pro{padding-left:clamp(16px,4cqi,64px)}
.porte-crea{border-radius:var(--r-coque);color:#F4EFE6;background:radial-gradient(120% 80% at 70% 0%,#24335E 0%,#16203A 60%,#111A30 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 40px 80px -40px rgba(4,8,22,.7);margin-block:-8px 0;--o:4,8,22;--encre:#F4EFE6;--texte-2:#A9B2C6;--filet:rgba(244,239,230,.13);--focus:#F6B48F}
.porte-crea::before{content:"";position:absolute;left:-60px;top:6%;bottom:6%;width:60px;background:linear-gradient(90deg,rgba(22,32,58,0),rgba(22,32,58,.08));pointer-events:none}
.porte-crea .p2,.porte-crea .micro,.porte-crea .pst,.porte-crea .lv{color:#A9B2C6}
.porte-crea .btn-1{background:#F0705A;color:#16203A}
.porte-crea .btn-1 .btn-ic{background:rgba(22,32,58,.14)}
.porte-crea .btn-2{color:#F4EFE6;box-shadow:inset 0 0 0 1px rgba(244,239,230,.24)}
.porte-crea .btn-2 .btn-ic{background:rgba(255,255,255,.08)}
.porte-crea .pst i,.porte-crea .lv i{background:#F0705A}
.porte-crea :focus-visible{outline-color:#F6B48F}
.porte .phrase{font-size:clamp(1.5rem,1rem + 2cqi,2.5rem);line-height:1.08;letter-spacing:-.024em;font-weight:600;max-width:18ch;text-wrap:balance}
.porte-crea .phrase{font-weight:800;text-transform:uppercase;letter-spacing:-.03em;line-height:.98;max-width:14ch}
.h-wm{font-size:clamp(3rem,1rem + 9cqi,8.6rem);font-weight:700;letter-spacing:-.06em;line-height:.85;display:flex;align-items:baseline}
.h-wm .pt{display:inline-block;width:.16em;height:.16em;border-radius:50%;background:var(--point);margin-left:.03em}
.table-pro{display:flex;align-items:flex-end;gap:clamp(16px,3cqi,40px)}
.table-pro .ver{display:flex;flex-direction:column;gap:6px;padding-bottom:12px}
.crea-objets{display:flex;align-items:flex-end;gap:18px}
.prix-tag{display:inline-flex;flex-direction:column;gap:2px}
.prix-tag .v{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:clamp(2.2rem,1.4rem + 2.4cqi,3.4rem);line-height:1;color:#F6B48F}
.vid-mini{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center;text-decoration:none;padding:6px;border-radius:18px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.vid-mini img{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:12px}
.vid-mini .t{font-weight:600;font-size:.92rem;line-height:1.3}
.bande-now{padding-block:clamp(40px,6cqi,80px)}
.now-lignes{display:grid;gap:0}
.now-ligne{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:16px;align-items:baseline;padding:16px 0;box-shadow:inset 0 -1px 0 var(--filet)}
.now-ligne .cote{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--texte-2)}

/* ===================================================================== */
/* 11. ÉTAGÈRE, FRISE, REGISTRE                                            */
/* ===================================================================== */
.etagere{position:relative;padding-top:24px}
.etg-rail{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(12px,2cqi,28px);align-items:end;position:relative;z-index:1;padding-inline:clamp(8px,2cqi,28px)}
.etg-i{display:flex;flex-direction:column;align-items:center;gap:18px;text-decoration:none;text-align:center;border-radius:20px;padding-top:8px}
.etg-i .pose{--t:clamp(64px,8.4cqi,112px)}
.etg-i .nom{font-weight:600;font-size:.95rem;letter-spacing:-.01em}
.etg-i .date{font-size:.76rem;color:var(--texte-2)}

.verdict .lieu{font-size:1.6rem;line-height:1.1}
.verdict .tampon{position:absolute;right:16px;top:-12px;color:#F6B48F;background:#16203A}
.guides-l{display:grid;gap:12px}
.guide{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;padding:20px;border-radius:24px;background:var(--surface);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 22px 40px -28px rgba(2,5,16,.9)}
.guide-etat{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#F6B48F}
.guide.avenir{background:transparent;box-shadow:none;outline:1.5px dashed rgba(244,239,230,.25);outline-offset:-1.5px}
.alerte{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:flex-start}
.alerte .champ{flex:1 1 220px}
.bases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;position:relative}
.base{position:relative;padding:28px 20px 20px;border-radius:22px;background:var(--surface);text-align:center}
.base .epingle{position:absolute;left:50%;top:-12px;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFC2B4,#F0705A 55%,#B9503F);box-shadow:0 4px 8px rgba(2,5,16,.6)}
.base .lieu{font-size:2rem;line-height:1.1}
.badges-prix{display:flex;flex-wrap:wrap;gap:8px}
.badges-prix span{display:inline-flex;gap:8px;align-items:baseline;padding:8px 14px;border-radius:999px;background:rgba(244,239,230,.07);font-size:.86rem}
.badges-prix b{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;font-size:1.15rem;color:#F6B48F}
.check{display:grid;gap:8px}
.check label{display:grid;grid-template-columns:30px minmax(0,1fr);gap:14px;align-items:start;padding:16px 18px;border-radius:18px;background:var(--surface);cursor:pointer}
.check input{width:24px;height:24px;margin:2px 0 0;accent-color:#F0705A}
.check .t{font-weight:700}
.check input:checked ~ span .t{text-decoration:line-through;text-decoration-color:#F0705A;text-decoration-thickness:2px}

/* k15ze : sous-identité */
.k15 .anton{font-family:"Anton",Impact,sans-serif;font-weight:400;letter-spacing:.01em;line-height:.9}
.k15-hero{padding-top:clamp(32px,5cqi,72px)}
.k15-hero .h-xl{font-weight:800;text-transform:uppercase}
.k15-chiffres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.k15-chiffres .chf-v{font-family:"Anton",Impact,sans-serif;font-weight:400;font-size:clamp(2.6rem,1.6rem + 3cqi,4.4rem);letter-spacing:.01em}
.courses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.course{display:flex;flex-direction:column;gap:14px;padding:12px;border-radius:26px;background:#151816;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 30px 50px -30px rgba(0,0,0,.9)}
.course .ph{position:relative;aspect-ratio:4/5;border-radius:18px;overflow:hidden;background:#1C201E}
.course .ph img{width:100%;height:100%;object-fit:cover}
.course .ph.vide{display:grid;place-items:center;text-align:center;padding:20px;color:#9DA39F;outline:1.5px dashed rgba(247,247,242,.18);outline-offset:-1.5px}
.course .corps{padding:4px 8px 10px}
.course .anton{font-size:2.2rem}
.sujets-k{display:flex;flex-wrap:wrap;gap:8px}
.sujets-k span{padding:10px 16px;border-radius:999px;background:#1C201E;font-weight:600}

/* /liens : 390 px d'abord, aucun objet animé */
.liens-col{max-width:440px;margin-inline:auto;display:flex;flex-direction:column;gap:10px;padding:clamp(24px,4cqi,48px) 16px}
.liens-col .tete{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;margin-bottom:10px}
.liens-col .tete .av{width:84px;height:84px;border-radius:50%;overflow:hidden;background:#253356}
.liens-col .tete .av img{width:100%;height:150%;object-fit:cover;object-position:top}
.etq{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:12px 18px;border-radius:18px;background:var(--surface);font-weight:600;text-decoration:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.etq.une{min-height:auto;padding:10px;display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px}
.etq.une img{width:110px;aspect-ratio:16/9;object-fit:cover;border-radius:12px}
.etq.guide-m{background:#F0705A;color:#16203A}
.etq.discret{background:transparent;box-shadow:none;justify-content:center;color:var(--texte-2);font-weight:500;font-size:.88rem}
.etq svg{width:16px;height:16px;flex:none}

/* Collaborer */
.audience{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.audience li{padding:22px;border-radius:24px;background:var(--surface);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 22px 40px -28px rgba(2,5,16,.9)}
.audience h3{font-size:.95rem;font-weight:700;margin-bottom:10px}
.audience p{font-size:.9rem;padding:6px 0;box-shadow:inset 0 -1px 0 var(--filet)}

/* Now */
.now-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.now-col{padding:clamp(22px,3cqi,36px);border-radius:var(--r-coque)}
.now-col.pro{background:var(--surface);box-shadow:inset 0 1px 0 #fff,0 30px 60px -40px rgba(27,29,28,.5)}
.nuit-local{--encre:#F4EFE6;--texte-2:#A9B2C6;--filet:rgba(244,239,230,.13);--accent:#F0705A;--accent-texte:#F0705A;--surface:#1E2A47;--o:4,8,22;--focus:#F6B48F;color:#F4EFE6;background:radial-gradient(120% 80% at 70% 0%,#24335E 0%,#16203A 60%,#111A30 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 40px 80px -40px rgba(4,8,22,.7)}
.nuit-local .lien{text-decoration-color:rgba(244,239,230,.35)}
.now-l{display:grid;gap:0}
.now-l li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:14px 0;box-shadow:inset 0 -1px 0 var(--filet)}
.now-l li .v{font-weight:600}
.now-l .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 14px}
.liens-tous{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.liens-tous ul{display:flex;flex-wrap:wrap;gap:8px}
.liens-tous a{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--filet);font-size:.86rem;font-weight:500;text-decoration:none}

/* À propos */
.deux-p{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cote-p{position:relative;display:flex;flex-direction:column;gap:18px;padding:clamp(22px,3cqi,36px);border-radius:var(--r-coque);overflow:hidden}
.cote-p .por{position:relative;height:260px}
.cote-p .por img{position:absolute;left:50%;top:0;transform:translateX(-50%);height:118%;width:auto;max-width:none;object-fit:contain;object-position:top}
.cote-p .por{overflow:hidden;border-radius:20px;background:linear-gradient(170deg,rgba(255,255,255,.5),rgba(var(--o),.06))}
.colophon li{padding:12px 0;box-shadow:inset 0 -1px 0 var(--filet)}

/* 404 */
.vide-404{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.saisir{display:flex;align-items:center;gap:20px;padding:24px;border-radius:var(--r-coque);background:var(--surface);text-decoration:none;box-shadow:inset 0 1px 0 var(--reflet),0 24px 40px -28px rgba(var(--o),.45)}
.saisir.nuit-local{background:radial-gradient(120% 80% at 70% 0%,#24335E 0%,#16203A 60%)}

/* ===================================================================== */
/* 15. PALETTE ⌘K, PANNEAU DE SIMULATION, TOAST                            */
/* ===================================================================== */
.palette{position:fixed;inset:0;z-index:80;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.palette[hidden]{display:none}
.palette .voile{position:absolute;inset:0;background:rgba(17,20,19,.38);animation:fade 200ms var(--ease-arrivee) both}
.palette .boite{position:relative;width:min(640px,100%);max-height:70vh;display:flex;flex-direction:column;border-radius:26px;background:#F7F8F6;color:#1B1D1C;box-shadow:inset 0 1px 0 #fff,0 40px 80px -30px rgba(0,0,0,.55);animation:pal-in 320ms var(--ease-arrivee) both;overflow:hidden}
@keyframes pal-in{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.palette input{width:100%;min-height:62px;padding:18px 22px;border:0;background:transparent;font-size:1.08rem;outline:none;box-shadow:inset 0 -1px 0 rgba(27,29,28,.1)}
.palette input:focus-visible{box-shadow:inset 0 -2px 0 #1B1D1C}
.palette ul{overflow:auto;padding:8px}
.palette .grp{padding:10px 14px 4px;font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#555B57}
.palette .it{display:flex;width:100%;justify-content:space-between;gap:16px;align-items:center;min-height:48px;padding:10px 14px;border:0;border-radius:14px;background:transparent;text-align:left;color:#1B1D1C;cursor:pointer;font:inherit}
.palette .it .c{font-size:.78rem;color:#555B57}
.palette [aria-selected="true"] > .it,.palette .it[aria-selected="true"]{background:#E3E7E3}
.palette .vide{padding:20px;color:#555B57}
.sim-btn{position:fixed;left:10px;bottom:10px;z-index:60;min-height:44px;padding:8px 12px;border:1px solid #B9B9B9;border-radius:6px;background:#E9E9E9;color:#1F1F1F;font:500 12px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;letter-spacing:0;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.sim{position:fixed;left:10px;bottom:62px;z-index:61;width:min(380px,calc(100vw - 20px));max-height:calc(100dvh - 80px);overflow:auto;padding:14px;border:1px solid #B9B9B9;border-radius:8px;background:#F3F3F3;color:#1F1F1F;font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;letter-spacing:0;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.sim[hidden]{display:none}
.sim h2{font-size:13px;font-weight:700;margin:0 0 6px}
.sim fieldset{border:1px solid #D0D0D0;border-radius:6px;margin:0 0 10px;padding:8px 10px}
.sim legend{font-weight:600;padding:0 4px}
.sim label{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:32px}
.sim select,.sim input[type=range]{font:inherit;max-width:180px}
.sim .plan a{display:block;padding:3px 0;color:#1F1F1F}
.sim .plan h3{font-size:12px;margin:8px 0 2px;text-transform:uppercase;letter-spacing:.08em;color:#555}
.sim .mention{font-size:11px;color:#555;margin-top:8px}
.sim :focus-visible{outline:2px solid #1F1F1F;outline-offset:2px;border-radius:3px}
.toast{position:fixed;left:50%;bottom:92px;z-index:75;max-width:min(520px,calc(100vw - 32px));padding:12px 18px;border-radius:14px;background:#1B1D1C;color:#F7F8F6;font-size:.88rem;transform:translate(-50%,12px);opacity:0;transition:transform 320ms var(--ease-arrivee),opacity 240ms;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
html.apercu body{background:#C9CDCA}
html.apercu #app{width:390px;max-width:100%;margin-inline:auto;box-shadow:0 0 0 1px rgba(0,0,0,.15),0 30px 80px rgba(0,0,0,.25);background:transparent}

/* ===================================================================== */
/* 17. MOUVEMENT RÉDUIT & IMPRESSION                                       */
/* ===================================================================== */
html.rm *,html.rm *::before,html.rm *::after{transition-duration:.01ms!important;transition-delay:0ms!important;animation-duration:.01ms!important;animation-delay:0ms!important}
html.rm [data-pose],html.rm [data-rv],html.rm [data-pose] .ombre,html.rm .fente>span,html.rm .verre,html.rm .op ins{opacity:1!important;transform:none!important}
html.rm .op del svg{clip-path:none!important}
html.rm .scene,html.rm [data-ouvrir]{display:none}
html.rm .anneau .m1::before,html.rm .anneau .m2::before{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;transition-delay:0ms!important;animation-duration:.01ms!important}
}
@media print{
  /* CV (Pro) et « version hors ligne » de l'itinéraire (Créateur) : encre noire sur papier blanc, quel que soit le côté */
  html:root[data-cote]{--fond:#fff;--surface:#fff;--surface-2:#f3f3f3;--surface-3:#e6e6e6;--encre:#111;--texte-2:#444;--filet:#d6d6d6;--accent:#555;--accent-texte:#333;--mot:#333;--o:0,0,0;--reflet:#fff}
  .lumiere,.entete,.entete-crea,.dock,.pied,.sim-btn,.sim,.palette,.menu-m,.toast,.skip,.no-print,.btn,.bt,.switch,.scene,.socle-o{display:none!important}
  html,body{background:#fff!important;color:#111!important}
  #app{container-type:normal}
  [data-pose],[data-rv],.fente>span,.op ins{opacity:1!important;transform:none!important}
  .noyau,.comp li,.coque,.base,.ville,.verdict,.guide,.univ,.course,.badges-prix span,.check label{box-shadow:none!important;background:#fff!important;color:#111!important;border:1px solid #d6d6d6}
  .op .prix,.autres-prix .v,.badges-prix b,.prix-tag .v,.guide-etat,.mot{color:#111!important}
  .plateau{padding-block:18px!important}
  .cv-head{grid-template-columns:3fr 1fr}
  a{text-decoration:none}
  .sw figure{transform:none!important;box-shadow:none!important}
  .bases,.w11,.villes{break-inside:avoid}
}
</style>
</head>
<body>
<div class="lumiere" aria-hidden="true"><div class="l-jour"></div><div class="l-nuit"></div><div class="l-k15"></div></div>
<a class="skip" id="skip" href="#vue">Aller au contenu</a>
<div id="app">
  <div id="entete"></div>
  <main id="vue" tabindex="-1">
    <noscript><div class="cadre plateau"><h1 class="h-l">Kenz.</h1><p class="lead" style="margin-top:16px">Cette maquette a besoin de JavaScript pour afficher ses 38 pages.</p></div></noscript>
  </main>
  <div id="dock"></div>
  <div id="pied"></div>
</div>
<div id="menu-m" class="menu-m" role="dialog" aria-modal="true" aria-label="Menu" aria-hidden="true"></div>
<div id="palette" class="palette" hidden></div>
<button type="button" id="sim-btn" class="sim-btn" aria-expanded="false" aria-controls="sim">Simulation</button>
<section id="sim" class="sim" hidden aria-labelledby="sim-t"></section>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="annonce" class="sr" aria-live="polite"></div>
<script src="_shared/content.js"></script>
<script>
(function () {
  'use strict';
  /* ======================================================================
     0. DÉMARRAGE
     ====================================================================== */
  var W = window, D = document, R = D.documentElement;
  var K = W.KENZ;
  var $vue = D.getElementById('vue');
  if (!K) {
    if ($vue) $vue.innerHTML = '<div class="cadre plateau"><h1 class="h-l" tabindex="-1">Données introuvables</h1><p class="lead" style="margin-top:16px">Le fichier _shared/content.js n’a pas pu être chargé. Ouvrez la maquette depuis le dossier maquettes/ (à côté de _shared/).</p></div>';
    return;
  }
  var U = K.util;
  var E_ARR = 'cubic-bezier(0.16,1,0.3,1)', E_SOR = 'cubic-bezier(0.32,0,0.67,0)', E_REC = 'cubic-bezier(0.65,0,0.35,1)';

  /* ======================================================================
     1. ÉTAT (simulation) + préférences du visiteur
     ====================================================================== */
  var S = {
    base: new Date(K.live.horlogeParDefaut),
    decal: 0,
    sources: { itunes: 'direct', youtubeRss: 'direct', nowJson: 'direct', deploiement: 'direct' },
    trous: false, rmForce: false, apercu: false, lang: 'fr', formEtat: 'succes', expire: false,
    route: null, query: {}, lum: null
  };
  var mq = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : null;
  function rm() { return S.rmForce || !!(mq && mq.matches); }
  function horloge() { return new Date(S.base.getTime() + S.decal * 864e5); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dj(dt) { dt = dt || horloge(); return pad(dt.getDate()) + '/' + pad(dt.getMonth() + 1) + '/' + dt.getFullYear(); }
  function dc(dt) { return pad(dt.getDate()) + '/' + pad(dt.getMonth() + 1); }
  function lire(k) { try { return W.localStorage.getItem(k); } catch (e) { return null; } }
  function ecrire(k, v) { try { W.localStorage.setItem(k, v); } catch (e) { /* stockage indisponible : sans conséquence */ } }
  var l0 = lire('kenz-m5-langue'); if (l0 === 'en' || l0 === 'fr') S.lang = l0;

  /* ======================================================================
     2. OUTILS DE TEXTE
     ====================================================================== */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  /* texte affiché : espaces fines (KENZ.util.fr) + apostrophe typographique, comme la micro-copie */
  function t(s) { return esc(U.fr(s == null ? '' : String(s)).replace(/'/g, '’')); }
  function d(iso) { return U.date(iso); }
  function rel(iso) { return U.relatif(iso, horloge()); }
  function val(p) { return (p && typeof p === 'object' && 'v' in p) ? p.v : p; }
  /* un seul mot en Instrument Serif italique par phrase */
  function mot(texte, m) {
    var h = t(texte); if (!m) return h;
    var em = t(m), i = h.indexOf(em);
    return i < 0 ? h : h.slice(0, i) + '<em class="mot">' + em + '</em>' + h.slice(i + em.length);
  }
  function app(slug) { for (var i = 0; i < K.apps.length; i++) if (K.apps[i].slug === slug) return K.apps[i]; return null; }
  function cas(slug) { var c = K.agents.cas; for (var i = 0; i < c.length; i++) if (c[i].slug === slug) return c[i]; return null; }
  function role(id) { var e = K.agents.equipe; for (var i = 0; i < e.length; i++) if (e[i].id === id) return e[i]; return null; }
  var ROUTES = {}; K.routes.forEach(function (r) { ROUTES[r.path] = r; });
  function href(p, q) { return '#' + p + (q ? '?' + q : ''); }
  var APPS_STORE = K.apps.filter(function (a) { return a.store; }).sort(function (a, b) { return a.statut.sortieLe < b.statut.sortieLe ? -1 : 1; });
  var APPS_CAS = ['oshii', 'sago', 'wado', 'croc', 'miru', 'zenko', 'escapades-libres', 'ce-site'];
  function yt(id) { return 'https://www.youtube.com/watch?v=' + encodeURIComponent(id); }
  function ytShort(id) { return 'https://www.youtube.com/shorts/' + encodeURIComponent(id); }
  function prixVecu(objet) { var l = K.createur.asie.chine.prixVecus.lignes; for (var i = 0; i < l.length; i++) if (l[i].objet === objet) return l[i]; return null; }

  /* ======================================================================
     3. ICÔNES (traits fins, aucune icône générique à la place d'une image)
     ====================================================================== */
  function svg(p, sw) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (sw || 1.4) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + p + '</svg>'; }
  var IC = {
    fleche: svg('<path d="M5 12h14M13 6l6 6-6 6"/>'),
    ext: svg('<path d="M8 16L16 8M10 8h6v6"/>'),
    extI: '<svg class="ext-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M8 16L16 8M10 8h6v6"/></svg>',
    loupe: svg('<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>'),
    croix: svg('<path d="M6 6l12 12M18 6L6 18"/>'),
    check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 2.2),
    stop: svg('<circle cx="12" cy="12" r="8.5"/><path d="M8.5 12h7"/>'),
    cadenas: svg('<rect x="5.5" y="10.5" width="13" height="9" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 017 0v2.5"/>'),
    drapeau: svg('<path d="M6 20V5M6 5h10l-2 3.5 2 3.5H6"/>'),
    inter: svg('<rect x="3.5" y="8" width="17" height="8" rx="4"/><circle cx="8" cy="12" r="2.2"/>'),
    double: svg('<path d="M4 9h12M12 5l4 4-4 4M20 15H8M12 11l-4 4 4 4"/>'),
    pointille: svg('<rect x="4" y="6" width="16" height="12" rx="3" stroke-dasharray="2.5 2.6"/>'),
    quarantaine: svg('<rect x="3.5" y="7" width="17" height="10" rx="2"/><path d="M6 12h12"/>'),
    anneau: svg('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor"/>'),
    info: svg('<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/>'),
    lecture: svg('<path d="M9 7.5v9l7.5-4.5z"/>'),
    imprimer: svg('<path d="M7 9V4h10v5M7 17H5a1 1 0 01-1-1v-5a2 2 0 012-2h12a2 2 0 012 2v5a1 1 0 01-1 1h-2"/><rect x="7" y="14" width="10" height="6" rx="1"/>'),
    lien: svg('<path d="M10 14a4 4 0 005.66 0l3-3a4 4 0 00-5.66-5.66l-1 1M14 10a4 4 0 00-5.66 0l-3 3a4 4 0 005.66 5.66l1-1"/>')
  };

  /* ======================================================================
     4. COMPOSANTS COMMUNS
     ====================================================================== */
  function sty(o) { var s = []; for (var k in o) if (o[k] != null) s.push(k + ':' + o[k]); return s.length ? ' style="' + s.join(';') + '"' : ''; }
  function btn(h, label, o) {
    o = o || {}; var ext = /^https?:/.test(h);
    return '<a class="btn ' + (o.c || 'btn-1') + (o.s ? ' btn-s' : '') + '" href="' + esc(ext ? h : href(h, o.q)) + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + (o.ev ? ' data-event="' + o.ev + '"' : '') + (o.id ? ' id="' + o.id + '"' : '') + (o.attr || '') + '><span>' + t(label) + (ext ? '<span class="sr"> (nouvel onglet)</span>' : '') + '</span><span class="btn-ic" aria-hidden="true">' + (ext ? IC.ext : IC.fleche) + '</span></a>';
  }
  function lienR(p, label, o) { o = o || {}; return '<a class="' + (o.c || 'lien') + '" href="' + href(p, o.q) + '"' + (o.ev ? ' data-event="' + o.ev + '"' : '') + '>' + t(label) + '</a>'; }
  function lienX(url, label, o) { o = o || {}; return '<a class="' + (o.c || 'lien') + '" href="' + esc(url) + '" target="_blank" rel="noopener"' + (o.ev ? ' data-event="' + o.ev + '"' : '') + '>' + t(label) + '<span class="sr"> (nouvel onglet)</span>' + IC.extI + '</a>'; }
  function fente(html, fd) { return '<span class="fente"' + (fd != null ? ' style="--fd:' + fd + '"' : '') + '><span>' + html + '</span></span>'; }
  function sur(txt) { return '<span class="sur"><b aria-hidden="true"></b>' + t(txt) + '</span>'; }
  function etiquetteSim(txt) { return '<span class="etiquette-sim">' + IC.info + t(txt) + '</span>'; }

  /* W3 — la pastille de preuve : la forme dit le statut */
  var FORME = { 'plein': 'plein', 'demi': 'demi', 'contour': 'contour', 'pointillé': 'pointille' };
  var SANS_DATE = { 'observé': 'observé', 'code': 'lu dans le code', 'déclaré': 'déclaré par Kenz', 'validé': 'validé par Kenz' };
  function libellePreuve(p) {
    if (p.date) return U.preuve(p);
    var s = SANS_DATE[p.statut] || (K.meta.statuts[p.statut] || { label: p.statut }).label;
    return s + (p.source ? ' · ' + p.source : '');
  }
  function pst(p) {
    if (!p || !p.statut) return '';
    /* une formulation « proposition » ou « hypothèse » n'est pas un fait : pastille visible seulement en mode trous */
    if ((p.statut === 'proposition' || p.statut === 'hypothèse') && !S.trous) return '';
    var f = FORME[(K.meta.statuts[p.statut] || {}).forme] || 'contour';
    return '<span class="pst" data-forme="' + f + '"><i aria-hidden="true"></i><span class="pst-t">' + t(libellePreuve(p)) + '</span></span>';
  }
  function trou(titre, q, inline) {
    var tag = inline ? 'span' : 'div';
    return '<' + tag + ' class="trou" role="note"><span class="trou-t">' + t('À confirmer — ' + titre) + '</span>' + (q ? '<span class="trou-q">' + t(q) + '</span>' : '') + '</' + tag + '>';
  }
  function chf(c, cls) {
    if (!c) return '';
    if (c.afficher === false || c.v == null) return trou(c.label, c.aConfirmer);
    return '<div class="chf ' + (cls || '') + '" data-rv><span class="chf-v tnum">' + fente(t(c.v)) + '</span><span class="chf-l">' + t(c.label) + '</span>' + pst(c) + '</div>';
  }

  /* Live : quatre états, la FORME de l'indicateur change */
  function lv(src) {
    var e = S.sources[src] || 'direct', so = K.live.sources[src] || {};
    if (e === 'vide') return '';
    if (e === 'direct') return '<span class="lv" data-etat="direct"><i aria-hidden="true"></i>' + t(so.frequenceH ? 'relevé il y a 2 h' : (src === 'deploiement' ? 'relevé le ' : 'mis à jour le ') + d(so.releveLe)) + '</span>';
    if (e === 'retard') return '<span class="lv" data-etat="retard"><i aria-hidden="true"></i>' + t('dernier relevé le ' + dc(new Date(horloge().getTime() - 2 * 864e5))) + '</span>';
    return '<span class="lv" data-etat="indispo"><i aria-hidden="true"></i>' + t("source indisponible pour l'instant") + '</span>';
  }
  function gris(src) { return S.sources[src] === 'retard' ? ' gris' : ''; }
  function vide(src) { return S.sources[src] === 'vide'; }
  function nowFrais() {
    if (vide('nowJson')) return false;
    var so = K.live.sources.nowJson, r = new Date(so.releveLe + 'T12:00:00');
    return (horloge() - r) / 864e5 < so.perimeAuBoutDeJours;
  }
  var SIMU = etiquetteSim(K.live.etiquette);

  /* L'objet : icône réelle en relief, ou plaque à la couleur de l'app */
  function objApp(a, o) {
    o = o || {};
    var ic = a.images && a.images.icone, inner, cls = 'obj', st = '';
    if (ic) {
      inner = '<img src="' + U.src(ic.src) + '" alt="' + (o.alt ? esc(ic.alt) : '') + '" width="' + ic.w + '" height="' + ic.h + '" loading="' + (o.eager ? 'eager' : 'lazy') + '" decoding="async">';
      if (a.slug === 'ce-site') cls += ' logo';
    } else {
      var col = a.couleurs && a.couleurs.accent;
      var lettre = (a.afficherNom === false ? (a.nomAffiche || '·') : a.nom).charAt(0);
      inner = '<span class="mono" aria-hidden="true">' + esc(lettre) + '</span>' + (o.alt ? '<span class="sr">' + t('Plaque de ' + (a.afficherNom === false ? a.nomAffiche : a.nom)) + '</span>' : '');
      cls += ' obj-plaque' + (col ? '' : ' obj-neutre');
      if (col) st = ' style="--app:' + col + '"';
    }
    return '<span class="pose' + (o.cls ? ' ' + o.cls : '') + '"' + sty({ '--t': o.t ? o.t + 'px' : null, '--d': o.d }) + (o.pose ? ' data-pose' : '') + '><span class="ombre"></span><span class="' + cls + '"' + st + '>' + inner + '</span></span>';
  }
  /* Objets-preuves en pâte pastel (CSS provisoire, en attendant les WebP de Kenz) */
  var PP = {
    avion: '<span class="pp pp-avion" aria-hidden="true"><span class="pa a"></span><span class="pa creme f"></span><span class="pa corail d"></span><span class="h"></span></span>',
    train: '<span class="pp pp-train" aria-hidden="true"><span class="pa dore s"></span><span class="pa creme c"></span><span class="pa corail b"></span><span class="w"></span><span class="r"></span></span>',
    lit: '<span class="pp pp-lit" aria-hidden="true"><span class="pa dore t"></span><span class="pa s"></span><span class="pa creme m"></span><span class="pa creme o"></span><span class="pa corail c"></span></span>',
    bol: '<span class="pp pp-bol" aria-hidden="true"><span class="pa dore p1"></span><span class="pa dore p2"></span><span class="pa corail b"></span><span class="pa creme r"></span><span class="n"></span><span class="pa corail pi"></span></span>',
    telephone: '<span class="pp pp-tel" aria-hidden="true"><span class="pa creme c"></span><span class="e"></span><span class="n"></span><span class="l"></span></span>'
  };
  var BARRE = '<svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M2 19 C 18 12, 36 23, 54 15 S 84 8, 98 12" fill="none" stroke="#E8322B" stroke-width="4.5" stroke-linecap="round"/></svg>';
  function objPreuve(objet, o) {
    o = o || {};
    return '<span class="pose"' + sty({ '--t': o.t ? o.t + 'px' : null }) + '><span class="ombre"></span>' + PP[objet] + '</span>';
  }

  /* W11 — les objets-preuves avec leur prix vécu (aucun total) */
  function w11(statique) {
    var ordre = ['avion', 'train', 'lit', 'bol', 'telephone'];
    return '<ul class="w11" role="list">' + ordre.map(function (o, k) {
      var l = prixVecu(o); if (!l) return '';
      var prix = l.prixAttendu
        ? '<del>' + t(l.prixAttendu) + BARRE + '<span class="sr"> (prix attendu, ' + t(l.noteAttendu) + ')</span></del><ins>' + fente(t(l.prix), 300) + '</ins>'
        : fente(t(l.prix), 300);
      return '<li class="op' + (statique ? ' vu' : '') + '"' + (statique ? '' : ' data-pose data-d="' + (k * 90) + '"') + '>'
        + '<span class="socle-o"><span class="ombre"></span>' + PP[o] + '</span>'
        + '<p class="prix tnum">' + prix + '</p>'
        + '<p class="poste">' + t(l.poste) + (l.unite ? ' · ' + t(l.unite) : '') + '</p>'
        + (l.noteAttendu ? '<p class="micro">' + t('200 € : ' + l.noteAttendu) + '</p>' : '')
        + '</li>';
    }).join('') + '</ul>' + trou('Objets-preuves', 'Rendu provisoire en CSS : à remplacer par les objets en pâte exportés en WebP par Kenz (DA-4).');
  }

  /* ======================================================================
     5. W10 — LA VUE ÉCLATÉE (plaques CSS 3D)
     ====================================================================== */
  var PLANS_APP = [
    { cle: 'app', label: 'App' }, { cle: 'api', label: 'API' }, { cle: 'donnees', label: 'Données' },
    { cle: 'ia', label: 'IA' }, { cle: 'infra', label: 'Infra' }
  ];
  function scene(plans, deco) {
    var n = plans.length;
    var pl = plans.map(function (p, k) {
      return '<div class="pl3" data-plan="' + p.cle + '" style="--i:' + (n - 1 - k) + ';--j:' + k + '"><span class="pl3-t">' + t(p.label) + '</span>' + (p.s ? '<span class="pl3-s">' + t(p.s) + '</span>' : '') + (deco && deco[p.cle] || '') + '</div>';
    }).join('');
    return '<div class="scene" data-scene aria-hidden="true"><span class="scene-ombre"></span><div class="pile">' + pl + '<span class="jeton"></span></div></div>';
  }
  function eclateApp(a) {
    var st = a.stack || {};
    var plans = PLANS_APP.map(function (p) {
      var it = st[p.cle] || [];
      return { cle: p.cle, label: p.label, s: it.length ? it.slice(0, 2).join(' · ') : '—', items: it };
    });
    var ic = a.images && a.images.icone;
    var deco = { app: ic ? '<img class="ic" src="' + U.src(ic.src) + '" alt="" loading="lazy" decoding="async">' : '' };
    var liste = plans.map(function (p, k) {
      return '<li><button type="button" class="plan-b" data-plan="' + p.cle + '" aria-pressed="' + (k === 0) + '" aria-controls="fiche-plan"><span class="n">' + t(p.label) + '</span><span class="s">' + t(p.items.length ? p.items.slice(0, 3).join(' · ') : 'Aucun élément relevé') + '</span><span class="c tnum">' + p.items.length + '</span></button></li>';
    }).join('');
    return '<div class="eclate" data-eclate-app="' + a.slug + '">'
      + scene(plans, deco)
      + '<div><div class="rangee" style="margin-bottom:14px"><button type="button" class="bt" data-ouvrir aria-expanded="false">' + IC.double + '<span>Ouvrir la vue éclatée</span></button>' + pst(st.preuve) + '</div>'
      + '<ol class="plans" aria-label="Les 5 plans de ' + esc(a.afficherNom === false ? a.nomAffiche : a.nom) + '">' + liste + '</ol>'
      + '<div class="fiche-plan" id="fiche-plan" aria-live="polite"></div></div></div>';
  }
  function fichePlanApp(a, cle) {
    var it = (a.stack && a.stack[cle]) || [];
    var lab = PLANS_APP.filter(function (p) { return p.cle === cle; })[0];
    return '<h4 class="h-s">' + t(lab ? lab.label : cle) + '</h4>' + (it.length ? '<ul>' + it.map(function (x) { return '<li>' + t(x) + '</li>'; }).join('') + '</ul>' : '<p class="p2 petit">Aucun élément relevé pour ce plan.</p>');
  }
  /* Vue éclatée d'une équipe d'agents (5 plans, du haut vers « Vous ») */
  var ROLES_METIER = ['produit', 'contenu', 'veille', 'relecture', 'code'];
  function plansEquipe(roles) {
    var chips = '<span class="chips">' + ROLES_METIER.map(function (id) { var r = role(id); return '<span class="' + (roles.indexOf(id) < 0 ? 'off' : '') + '" data-chip="' + id + '">' + t(r.nom) + '</span>'; }).join('') + '</span>';
    return {
      plans: [
        { cle: 'hermes', label: 'Hermes', s: 'coordination' },
        { cle: 'roles', label: 'Les rôles', s: '' },
        { cle: 'memoire', label: 'La mémoire', s: '« Où on en est » · décisions' },
        { cle: 'gardefous', label: 'Les garde-fous', s: 'rien ne part sans vous' },
        { cle: 'vous', label: 'Vous', s: 'validation humaine' }
      ],
      deco: { roles: chips }

    palVis = palItems.filter(function (x) { return !n || norm(x.l + ' ' + (x.c || '') + ' ' + x.g).indexOf(n) >= 0; });
    if (palSel >= palVis.length) palSel = 0;
    var g = null, h = '';
    palVis.forEach(function (x, k) {
      if (x.g !== g) { g = x.g; h += '<li class="grp" role="presentation">' + t(g) + '</li>'; }
      h += '<li role="option" class="it" id="pal-' + k + '" aria-selected="' + (k === palSel) + '" data-k="' + k + '"><span>' + t(x.l) + '</span><span class="c">' + t(x.c || '') + '</span></li>';
    });
    ul.innerHTML = h || '<li class="vide">Aucune page ne correspond.</li>';
    inp.setAttribute('aria-activedescendant', palVis.length ? 'pal-' + palSel : '');
    var sel = ul.querySelector('#pal-' + palSel); if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: 'nearest' });
  }
  function executer(x) {
    if (!x) return;
    fermerPalette(true);
    if (x.act === 'copier') {
      var u = W.location.href;
      if (W.navigator.clipboard && W.navigator.clipboard.writeText) W.navigator.clipboard.writeText(u).then(function () { toast('Lien copié.'); }, function () { toast('Copie impossible : ' + u); });
      else toast('Copie impossible : ' + u);
      return;
    }
    if ('#' + x.go === W.location.hash) { W.scrollTo(0, 0); return; }
    W.location.hash = '#' + x.go;
  }
  function ouvrirPalette() {
    palRetour = D.activeElement; palItems = itemsPalette(); palSel = 0;
    $pal.innerHTML = '<div class="voile" data-fermer-pal></div><div class="boite" role="dialog" aria-modal="true" aria-label="Aller à une page"><input type="text" role="combobox" aria-expanded="true" aria-controls="pal-liste" aria-autocomplete="list" autocomplete="off" spellcheck="false" placeholder="Une page, une app, un cas, un guide…" aria-label="Rechercher une page" data-pal-q><ul id="pal-liste" role="listbox" aria-label="Résultats"></ul></div>';
    $pal.hidden = false;
    var inp = $pal.querySelector('[data-pal-q]');
    inp.addEventListener('input', function () { palSel = 0; peindre(inp.value); });
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); palSel = Math.min(palVis.length - 1, palSel + 1); peindre(inp.value); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); palSel = Math.max(0, palSel - 1); peindre(inp.value); }
      else if (e.key === 'Enter') { e.preventDefault(); executer(palVis[palSel]); }
      else if (e.key === 'Tab') { e.preventDefault(); }
    });
    $pal.querySelector('#pal-liste').addEventListener('click', function (e) { var b = e.target.closest('[data-k]'); if (b) executer(palVis[+b.getAttribute('data-k')]); });
    peindre('');
    inp.focus();
  }
  function fermerPalette(sansRetour) {
    if ($pal.hidden) return;
    $pal.hidden = true; $pal.innerHTML = '';
    if (!sansRetour && palRetour && palRetour.focus) palRetour.focus();
  }

  /* ======================================================================
     14. PANNEAU DE SIMULATION (hors du design, police système)
     ====================================================================== */
  function simHtml() {
    var src = [['itunes', 'API iTunes (versions)'], ['youtubeRss', 'RSS YouTube (vidéos)'], ['nowJson', 'now.json (déclaré)'], ['deploiement', 'Date de déploiement']];
    var et = [['direct', 'en direct'], ['retard', 'en retard'], ['indispo', 'indisponible'], ['vide', 'vide']];
    var fe = [['succes', 'succès'], ['echecReseau', 'échec réseau'], ['limite', 'limite atteinte'], ['assistantEnPause', 'assistant en pause']];
    function opts(arr, v) { return arr.map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === v ? ' selected' : '') + '>' + o[1] + '</option>'; }).join(''); }
    var groupes = [['commun', 'Commun'], ['pro', 'Pro'], ['createur', 'Créateur']];
    return '<h2 id="sim-t">Panneau de simulation</h2>'
      + '<fieldset><legend>Sources live</legend>' + src.map(function (s) { return '<label>' + s[1] + '<select data-src="' + s[0] + '">' + opts(et, S.sources[s[0]]) + '</select></label>'; }).join('') + '</fieldset>'
      + '<fieldset><legend>Horloge</legend><label>Décalage <input type="range" min="-30" max="60" step="1" value="' + S.decal + '" data-horloge aria-describedby="sim-h"></label><div id="sim-h" aria-live="polite">' + dj() + ' 18:00 (' + (S.decal >= 0 ? '+' : '') + S.decal + ' j)</div></fieldset>'
      + '<fieldset><legend>Affichage</legend><label>Montrer les trous<input type="checkbox" data-trous' + (S.trous ? ' checked' : '') + '></label><label>Mouvement réduit<input type="checkbox" data-rm' + (S.rmForce ? ' checked' : '') + '></label><label>Aperçu 390 px<input type="checkbox" data-apercu' + (S.apercu ? ' checked' : '') + '></label></fieldset>'
      + '<fieldset><legend>Formulaires</legend><label>Prochain envoi<select data-form-etat>' + opts(fe, S.formEtat) + '</select></label><label>Lien du livrable expiré<input type="checkbox" data-expire' + (S.expire ? ' checked' : '') + '></label></fieldset>'
      + '<fieldset class="plan"><legend>Plan du site (' + K.routes.length + ' routes)</legend>' + groupes.map(function (g) { return '<h3>' + g[1] + '</h3>' + K.routes.filter(function (r) { return r.cote === g[0]; }).map(function (r) { return '<a href="' + href(r.path) + '">' + esc(r.path) + ' — ' + esc(r.titre) + '</a>'; }).join(''); }).join('') + '<h3>Alias</h3><a href="#/chine">/chine → /itineraire/chine</a></fieldset>'
      + '<p class="mention">' + esc(K.live.etiquette) + '. Maquette — données relevées le 11/11/2026, aucune requête réseau.</p>';
  }
  function simBasculer(ouvrir) {
    if (ouvrir) { $sim.innerHTML = simHtml(); $sim.hidden = false; $simBtn.setAttribute('aria-expanded', 'true'); var f = $sim.querySelector('select'); if (f) f.focus(); }
    else { $sim.hidden = true; $simBtn.setAttribute('aria-expanded', 'false'); $simBtn.focus(); }
  }
  function monterSim() {
    $simBtn.addEventListener('click', function () { simBasculer($sim.hidden); });
    $sim.addEventListener('change', function (e) {
      var el = e.target;
      if (el.hasAttribute('data-src')) { S.sources[el.getAttribute('data-src')] = el.value; rafraichir(); }
      else if (el.hasAttribute('data-trous')) { S.trous = el.checked; R.classList.toggle('trous', S.trous); rafraichir(); }
      else if (el.hasAttribute('data-rm')) { S.rmForce = el.checked; R.classList.toggle('rm', rm()); rafraichir(); }
      else if (el.hasAttribute('data-apercu')) { S.apercu = el.checked; R.classList.toggle('apercu', S.apercu); }
      else if (el.hasAttribute('data-form-etat')) { S.formEtat = el.value; }
      else if (el.hasAttribute('data-expire')) { S.expire = el.checked; if (S.route && S.route.path === '/livrable/demo') rafraichir(); }
    });
    $sim.addEventListener('input', function (e) {
      if (!e.target.hasAttribute('data-horloge')) return;
      S.decal = +e.target.value;
      var o = $sim.querySelector('#sim-h'); if (o) o.textContent = dj() + ' 18:00 (' + (S.decal >= 0 ? '+' : '') + S.decal + ' j)';
      clearTimeout(simT); simT = setTimeout(rafraichir, 160);
    });
    $sim.addEventListener('click', function (e) { if (e.target.closest('.plan a')) { /* navigation normale */ } });
  }
  var simT = null;

  /* ======================================================================
     15. ÉVÉNEMENTS GLOBAUX + DÉMARRAGE
     ====================================================================== */
  D.addEventListener('click', function (e) {
    var cible = e.target;
    var dis = cible.closest('a[aria-disabled="true"]'); if (dis) { e.preventDefault(); return; }
    if (cible.closest('#skip')) { e.preventDefault(); $vue.focus(); return; }
    if (cible.closest('[data-palette]')) { e.preventDefault(); if ($menu.classList.contains('ouvert')) menu(false, true); ouvrirPalette(); return; }
    if (cible.closest('[data-fermer-pal]')) { fermerPalette(); return; }
    var lg = cible.closest('[data-lang]'); if (lg) { changerLangue(lg.getAttribute('data-lang')); return; }
    if (cible.closest('[data-burger]')) { menu(!$menu.classList.contains('ouvert')); return; }
    if (cible.closest('[data-fermer-menu]')) { menu(false); return; }
    var a = cible.closest('a[href^="#/"]');
    if (a && a.getAttribute('href') === W.location.hash) {
      e.preventDefault();
      var p = parseHash(); if (p.q.ancre) scrollAncre(p.q.ancre); else W.scrollTo({ top: 0, behavior: rm() ? 'auto' : 'smooth' });
      if ($menu.classList.contains('ouvert')) menu(false, true);
    }
  });
  D.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); if ($pal.hidden) ouvrirPalette(); else fermerPalette(); return; }
    if (e.key === 'Escape') {
      if (!$pal.hidden) { fermerPalette(); return; }
      if ($menu.classList.contains('ouvert')) { menu(false); return; }
      if (!$sim.hidden) { simBasculer(false); return; }
    }
    if (/^[123]$/.test(e.key) && COMPOSER && COMPOSER.attend() && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName || '')) { e.preventDefault(); COMPOSER.choisir(+e.key); }
  });
  if (W.__MAT_TEST) { W.__MAT = { V: V, S: S, K: K, ROUTES: ROUTES, redirection: redirection }; return; }
  R.classList.add('js-anim');
  R.classList.toggle('rm', rm());
  if (mq) { var surMq = function () { R.classList.toggle('rm', rm()); }; if (mq.addEventListener) mq.addEventListener('change', surMq); else if (mq.addListener) mq.addListener(surMq); }
  if ('inert' in $menu) $menu.inert = true;
  monterSim();
  W.addEventListener('hashchange', surHash);
  surHash();
})();
</script>
