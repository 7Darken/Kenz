   2. W15 La fiche « Où on en est » en tiroir (registre des apps, livrable) : tampon

      à la main (380 + 140 ms).
   3. W14 Le renvoi de marge (ordinateur) : une flèche se trace de la note à
      l'élément cité (380 + 140 ms), effacée en 240 ms power3.in ; mobile : la note
      se replie sous son paragraphe.
   4. La transmission qui se remplit (/pro/agents, cas) : carte à 6 champs remplie
      champ par champ par la fente (60 ms), glisse vers le destinataire (420 ms),
      arrêt obligatoire (W6, touches 1/2/3), validation = tampon daté (W5).
   5. L'annotation qui se trace (Créateur) : flèche calculée qui s'arrête avant le
      visage (boîte du visage par image, object-fit respecté), puis nom du lieu en
      balayage doux ; une seule animée par écran.
   6. W4 Le vrai prix : 200 € barré d'un trait rouge à la main (280 ms), ≈ 10 €
      descend de 8 px en Instrument Serif italique (320 ms) ; pendant qu'il est à
      l'écran, le point passe à l'encre : c'est l'unique rouge.

}

@media (min-width:1024px){ .tete-titre{ display:grid; grid-template-columns:172px minmax(0,1fr) 248px; column-gap:40px; } .tete-titre > .tete-corps{ grid-column:2 / span 1; } .tete-titre > .tete-preuves{ grid-column:3; align-self:end; } }
.surtitre{ display:block; color:var(--texte-2); margin-bottom:14px; }
.h1-pro{ font-weight:600; font-size:clamp(2rem, 1.4rem + 2.8vw, 3.6rem); line-height:1.04; letter-spacing:-.025em; font-variation-settings:"opsz" 32; text-wrap:balance; max-width:20ch; }

.rang{ position:relative; padding:36px 0; border-top:1px solid var(--filet-c); }

.mono-icone{ width:40px; height:40px; flex:none; border-radius:10px; display:grid; place-items:center; font-weight:800; font-size:1rem; color:#fff; letter-spacing:-.02em; overflow:hidden; }

/* feuillets éclatés (W10) */

  background-image:linear-gradient(to bottom, rgba(217,210,197,.6) 1px, transparent 1px); background-size:100% 12px; box-shadow:0 0 0 1px rgba(255,255,255,.4) inset; }

/* dossier de transmission (agents) */

.zone{ position:absolute; z-index:3; max-width:min(560px, calc(100% - 2 * var(--gouttiere))); }

.h1-cre{ font-weight:800; text-transform:uppercase; letter-spacing:-.035em; line-height:.9; font-size:clamp(2.5rem, 1.4rem + 6vw, 6.75rem); font-variation-settings:"opsz" 32; text-wrap:balance; }

.h2-cre .serif-i{ text-transform:none; }
.mot{ display:inline-block; }
.annot-svg{ position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; overflow:visible; color:var(--creme); }

.annot-lib.z-hg{ left:var(--gouttiere); top:28px; } .annot-lib.z-hd{ right:var(--gouttiere); top:28px; text-align:right; }

/* ============================== MOUVEMENT RÉDUIT & IMPRESSION ============================== */
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{ transition-duration:.12s!important; transition-delay:0s!important; scroll-behavior:auto!important; } }

  .page{ padding:0; }

  .rang-preuves{ grid-column:2; }

  [style*="opacity: 0"]{ opacity:1!important; }

  a{ text-decoration:none; }

}

  /* carte de l'Asie, tracée à la main (aucune côte, un graticule et des cercles) */
  var GEO = { chine: [112, 33], japon: [138, 36], coree: [129, 35.6], 'hong-kong': [114.2, 22.3], taiwan: [121, 23.7], malaisie: [101.7, 3.1], emirats: [54.4, 24.5], maurice: [57.5, -20.2] };
  var LIB_POS = { chine: [-60, -26], japon: [10, -24], coree: [-12, 40], 'hong-kong': [-112, 34], taiwan: [22, 30], malaisie: [22, 6], emirats: [22, -18], maurice: [24, 6] };
  function proj(lon, lat) { return [((lon - 40) / 110) * 1000, ((52 - lat) / 78) * 600]; }
  function cercleMain(cx, cy, r, graine) {
    var pts = [], n = 9, s = graine || 1;
    for (var i = 0; i <= n + 1; i++) {
      var a = (i / n) * Math.PI * 2 - 1.2, rr = r * (1 + 0.08 * Math.sin(i * 2.3 + s) + (i > n ? 0.12 : 0));
      pts.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a)]);
    }
    var d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
    for (var k = 1; k < pts.length; k++) { var p = pts[k - 1], q = pts[k]; d += ' Q' + p[0].toFixed(1) + ' ' + p[1].toFixed(1) + ' ' + ((p[0] + q[0]) / 2).toFixed(1) + ' ' + ((p[1] + q[1]) / 2).toFixed(1); }
    return d;
  }
  function carteAsie() {
    var pays = K.createur.asie.pays.filter(function (p) { return GEO[p.slug]; });
    var g = '';
    [60, 80, 100, 120, 140].forEach(function (lon) { var x = proj(lon, 0)[0]; g += '<path class="grat" d="M' + x.toFixed(1) + ' 0 V600"/>'; });
    [40, 20, -20].forEach(function (lat) { var y = proj(0, lat)[1]; g += '<path class="grat" d="M0 ' + y.toFixed(1) + ' H1000"/>'; });
    var yEq = proj(0, 0)[1], yTr = proj(0, 23.44)[1];
    g += '<path class="equ" d="M0 ' + yEq + ' C 250 ' + (yEq - 2) + ', 600 ' + (yEq + 2) + ', 1000 ' + yEq + '"/><text x="8" y="' + (yEq - 8) + '" style="font-family:var(--mono);font-size:12px;fill:var(--graphite)">Équateur</text>';
    g += '<path class="grat" d="M0 ' + yTr.toFixed(1) + ' H1000" style="stroke-dasharray:1 5"/><text x="8" y="' + (yTr - 8).toFixed(1) + '" style="font-family:var(--mono);font-size:12px;fill:var(--graphite)">tropique du Cancer</text>';
    var m = pays.map(function (p, i) {
      var xy = proj(GEO[p.slug][0], GEO[p.slug][1]), lp = LIB_POS[p.slug] || [18, 0];
      var nom = p.nom, loc = p.nomLocal || '';
      return '<g class="pays-m' + (p.aVenir ? ' avenir' : '') + (p.slug === 'chine' ? ' sel' : '') + '" role="button" tabindex="0" data-pays="' + p.slug + '" aria-label="' + esc(nom + (p.aVenir ? ', à venir' : '') + ', ' + p.quand) + '">' +
        '<path class="rond" d="' + cercleMain(xy[0], xy[1], p.slug === 'chine' ? 26 : 15, i + 1) + '"/><circle class="c" cx="' + xy[0].toFixed(1) + '" cy="' + xy[1].toFixed(1) + '" r="3.2"/>' +
        '<text x="' + (xy[0] + lp[0]).toFixed(1) + '" y="' + (xy[1] + lp[1]).toFixed(1) + '">' + esc(nom.replace(' (Abu Dhabi)', '')) + '</text>' + (loc ? '<text class="loc" x="' + (xy[0] + lp[0]).toFixed(1) + '" y="' + (xy[1] + lp[1] + 18).toFixed(1) + '">' + esc(loc) + '</text>' : '') + '</g>';
    }).join('');
    var horsCarte = K.createur.asie.pays.filter(function (p) { return p.horsAsie; });
    return '<div class="carte-asie" data-carte><svg viewBox="0 0 1000 600" role="group" aria-label="Carte des pays filmés, tracée à la main">' + g + m + '</svg>' +
      '<div class="carte-info" data-carte-info aria-live="polite"></div></div>' +
      '<p class="petit t2" style="margin-top:10px">Hors carte, hors Asie : ' + horsCarte.map(function (p) { return t(p.nom) + ' (' + t(p.quand) + ')'; }).join(' · ') + '.</p>' +
      '<div class="pays-liste" role="group" aria-label="Les pays, en liste">' + K.createur.asie.pays.map(function (p) { return '<button type="button" data-pays-btn="' + p.slug + '" aria-pressed="' + (p.slug === 'chine') + '">' + t(p.nom) + (p.aVenir ? ' · à venir' : p.horsAsie ? ' · hors Asie' : '') + '</button>'; }).join('') + '</div>';

    var p1 = [E0[0] - h * Math.cos(ang - 0.5), E0[1] - h * Math.sin(ang - 0.5)], p2 = [E0[0] - h * Math.cos(ang + 0.5), E0[1] - h * Math.sin(ang + 0.5)];
    svg.setAttribute('viewBox', '0 0 ' + g.w.toFixed(0) + ' ' + g.h.toFixed(0));
    svg.innerHTML = '<path d="M' + f2(S0) + ' Q' + f2(C) + ' ' + f2(E0) + '"/><path class="a-pointe" d="M' + f2(p1) + ' L' + f2(E0) + ' L' + f2(p2) + '"/>';
    if (animer && !reduit()) {
      tracer(svg, S0[0], S0[1], len * 1.3 + 30, 380, 0);
      anim(svg.querySelector('.a-pointe'), [{ opacity: 0 }, { opacity: 1 }], { duration: 140, delay: 380, easing: E_ARR, fill: 'backwards' });
      var lieu = lib.querySelector('.annot-lieu');
      if (lieu) revelerGauche(lieu, Math.round(600 * mult()), 540, 6);
    }
  }
  function hyAnnots(root, statique) {
    ANNOTS = Array.prototype.slice.call(root.querySelectorAll('[data-annot]'));
    if (!ANNOTS.length) return;
    ANNOTS.forEach(function (fig) {
      var anime = !statique && fig.getAttribute('data-annot') !== 'statique' && !reduit() && ('IntersectionObserver' in W);
      if (anime) { fig.classList.add('annot-attente'); fig._attente = true; }
      var im = fig.querySelector('img');
      var pret = function () { var g = placerAnnot(fig); if (!anime || fig.getAttribute('data-trace')) dessinerFleche(fig, g, false); };
      pret();
      if (im && !im.complete) im.addEventListener('load', pret, { once: true });
    });
    if (!('IntersectionObserver' in W)) return;
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        var fig = e.target;
        if (!e.isIntersecting || e.intersectionRatio < 0.5 || !fig._attente || fig.getAttribute('data-trace')) return;
        var maintenant = Date.now(), attente = Math.max(0, DERNIERE_ANNOT + 900 - maintenant);
        DERNIERE_ANNOT = maintenant + attente;
        fig.setAttribute('data-trace', '1'); fig._attente = false;
        W.setTimeout(function () { dessinerFleche(fig, placerAnnot(fig), true); }, attente + 180);
      });
    }, { threshold: [0, 0.5, 0.75] });
    ANNOTS.forEach(function (f) { if (f._attente) io.observe(f); }); OBS.push(io);
  }

  function hyDivers(root) {

          toast('Relevé simulé : valeurs du ' + dt(K.live.releveLe) + ', aucune requête réseau.');
        }, reduit() ? 100 : 600);

  function basculerMenu(force) {

  var PAL = { items: [], filtres: [], sel: 0, retour: null };

    it.push({ lib: 'Changer de casquette', type: 'action', action: 'casquette' });

  }
  function ouvrirPalette() {

  function fermerPalette() { var p = D.getElementById('palette'); if (!p || p.hidden) return; p.hidden = true; if (PAL.retour && PAL.retour.focus) PAL.retour.focus(); }
  function filtrerPalette(q) {
    var nq = normal(q).trim();
    PAL.filtres = PAL.items.filter(function (i) { return !nq || normal(i.lib + ' ' + i.type + ' ' + (i.path || '')).indexOf(nq) >= 0; }).slice(0, 40);

  function rendreSim() {
    var el = D.getElementById('sim'); if (!el) return;

    h += '<h3>Affichage</h3><label>Montrer les trous <input type="checkbox" data-sim-trous' + (S.trous ? ' checked' : '') + '></label><label>Mouvement réduit <input type="checkbox" data-sim-reduit' + (S.reduitForce ? ' checked' : '') + '></label><label>Aperçu 390 px <input type="checkbox" data-sim-390' + (D.getElementById('apercu').hidden ? '' : ' checked') + '></label>';
    h += '<h3>Formulaires</h3><label>Résultat de l’envoi <select data-sim-form>' + [['normal', 'succès'], ['echecReseau', 'échec réseau'], ['limite', 'limite atteinte'], ['assistantEnPause', 'assistant en pause']].map(function (o) { return '<option value="' + o[0] + '"' + (S.formEtat === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></label>';

    h += '<details class="plan"><summary>Plan du site (' + K.routes.length + ' routes)</summary>' + Object.keys(groupes).map(function (g) { return '<h4>' + groupes[g] + '</h4>' + K.routes.filter(function (r) { return r.cote === g; }).map(function (r) { return '<a href="#' + r.path + '">' + esc(r.path) + ' · ' + t(r.titre) + '</a>'; }).join(''); }).join('') + '<h4>Alias</h4><a href="#/chine">/chine → /itineraire/chine</a></details>';

  function basculerSim(force) {
    var el = D.getElementById('sim'), b = D.getElementById('sim-btn');

  /* typographie française (§ 8.3) sur tout texte rendu, copie codée en dur et textContent compris.
     Idempotent : une fois l'espace fine posée, le motif ne correspond plus, donc pas de boucle. */
  var TYPO_RE = / [;:!?»]|« /;
  var TYPO_SAUF = /^(SCRIPT|STYLE|TEXTAREA|CODE|KBD)$/;
  function typoTexte(n) {
    if (!n) return;
    if (n.nodeType === 3) {

      if (!TYPO_RE.test(v) || (p && TYPO_SAUF.test(p.nodeName))) return;

    if (n.nodeType !== 1 || TYPO_SAUF.test(n.nodeName)) return;
    var w = D.createTreeWalker(n, 4, null), x;
    while ((x = w.nextNode())) typoTexte(x);
  }
  function observerTypo() {
    typoTexte(D.body);
    if (!('MutationObserver' in W)) return;
    new MutationObserver(function (ms) {
      ms.forEach(function (m) { if (m.type === 'characterData') typoTexte(m.target); else Array.prototype.forEach.call(m.addedNodes, typoTexte); });
    }).observe(D.body, { childList: true, subtree: true, characterData: true });
  }

  function init() {

      }
      if (el.hasAttribute('data-palette')) { e.preventDefault(); basculerMenu(false); ouvrirPalette(); }

      if (e.key === 'Escape') { fermerPalette(); basculerMenu(false); if (!D.getElementById('sim').hidden) basculerSim(false); if (!D.getElementById('apercu').hidden) apercu390(false); return; }
      var tag = (e.target && e.target.tagName) || '';
      if (DOSSIER_ACTIF && /^[123]$/.test(e.key) && !/INPUT|TEXTAREA|SELECT/.test(tag)) { e.preventDefault(); DOSSIER_ACTIF.choisir(+e.key - 1); }
    });
    D.getElementById('sim').addEventListener('change', function (e) {
      var el = e.target, html = D.documentElement;
      if (el.hasAttribute('data-sim-source')) { S.sources[el.getAttribute('data-sim-source')] = el.value; rafraichir(); }

      var p = D.querySelector('[data-sim-date]'); if (p) p.textContent = dt(isoJour(S.horloge)) + ' 18:00 (' + (S.decalage >= 0 ? '+' : '') + S.decalage + ' j)';
      W.clearTimeout(init._h); init._h = W.setTimeout(rafraichir, 120);
    });
    /* à l'impression (CV, guide hors ligne), les notes de marge repliées sur mobile sont rouvertes */
    W.addEventListener('beforeprint', function () { chaque(D, '.note-marge:not([open])', function (d) { d.setAttribute('open', ''); }); });
    var tRes = 0;
    W.addEventListener('resize', function () {
      W.clearTimeout(tRes);
      tRes = W.setTimeout(function () { effacerRenvoi(true); if (large()) chaque(D, '.note-marge:not([open])', function (d) { d.setAttribute('open', ''); }); ANNOTS.forEach(function (f) { if (f.getAttribute('data-annot') === 'statique' || f.getAttribute('data-trace') || !f._attente) dessinerFleche(f, placerAnnot(f), false); }); }, 160);
    });

  }
  W.__CARNET = { VUES: VUES, trouverRoute: trouverRoute, S: S, rendreEntete: rendreEntete, rendrePied: rendrePied, rendreBarre: rendreBarre, rendreMenu: rendreMenu };
