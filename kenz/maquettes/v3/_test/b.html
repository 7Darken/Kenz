<!doctype html>
<html lang="fr" class="js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test sceau B</title>
<!-- Optionnel : voile de lumière dès le premier rendu à l'arrivée (raccord garanti). -->
<script>location.hash === '#porte' && document.documentElement.setAttribute('data-sceau-arrivee', 'soleil');</script>
<link rel="stylesheet" href="../assets/melodrama.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="../shared/sceau.css">
<style>
  /* Page de test minimale, univers Créateur (heure dorée), sans GSAP (repli Web Animations).
     data-sceau-test : deux anneaux déjà alignés, un seul cran à faire sur l'anneau intérieur. */
  :root { --bg: #16110C; --creme: #F4EFE6; --sceau-lumiere: #9DB8FF; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--creme); font-family: "Inter", system-ui, sans-serif; }
  .hero { position: relative; min-height: 100vh; min-height: 100svh; overflow: hidden; display: grid; align-items: end; padding: 0 6vw 14vh; }
  .hero__pays { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: sepia(.08) hue-rotate(-4deg) saturate(1.16) brightness(.86) contrast(1.04); }
  .hero__voile { position: absolute; inset: 0; background: linear-gradient(180deg, rgb(22 17 12 / .1), rgb(22 17 12 / .86)); }
  .hero__portrait { position: absolute; right: 8vw; bottom: 0; height: 86%; width: auto; }
  .hero__txt { position: relative; max-width: 520px; }
  .hero h1 { font-family: "Melodrama", serif; font-weight: 600; font-size: clamp(72px, 12vw, 160px); line-height: .9; margin: 0 0 18px; }
  .hero p { font-size: 18px; margin: 0; color: rgb(244 239 230 / .8); }
  .js .hero .w { display: inline-block; opacity: 0; filter: blur(10px); transition: opacity .9s cubic-bezier(.16,1,.3,1), filter .9s cubic-bezier(.16,1,.3,1); transition-delay: calc(var(--i) * 70ms); }
  .hero.is-in .w { opacity: 1; filter: none; }
  .entre { min-height: 60vh; display: grid; place-items: center; color: rgb(244 239 230 / .4); }
</style>
</head>
<body>
<header class="hero">
  <img class="hero__pays" src="../assets/img/paysage-kuala-lumpur.jpg" alt="">
  <div class="hero__voile"></div>
  <img class="hero__portrait" src="../assets/img/kenz-moi.webp" alt="Kenz en t-shirt vert anis">
  <div class="hero__txt">
    <h1><span class="w" style="--i:0">Kenz</span></h1>
    <p><span class="w" style="--i:1">Page</span> <span class="w" style="--i:2">de</span> <span class="w" style="--i:3">test</span> <span class="w" style="--i:4">B,</span> <span class="w" style="--i:5">heure</span> <span class="w" style="--i:6">dorée.</span></p>
  </div>
</header>
<main>
  <section class="entre"><p>Contenu de la page</p></section>
  <section id="sceau" class="sceau" data-sceau data-vers="a.html" data-symbole="lune" data-sceau-test></section>
</main>
<script>
  (function () {
    var h = document.querySelector('.hero');
    function entree() { h.classList.add('is-in'); }
    if (location.hash === '#porte') document.addEventListener('sceau:arrivee', entree, { once: true });
    else requestAnimationFrame(function () { requestAnimationFrame(entree); });
  })();
</script>
<script src="../shared/sceau.js" defer></script>
</body>
</html>
