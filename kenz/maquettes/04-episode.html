/* =========================================================================
   1. TOKENS
   ========================================================================= */
:root{
  --ease-arrivee:cubic-bezier(.16,1,.3,1);
  --ease-sortie:cubic-bezier(.32,0,.67,0);
  --ease-recadre:cubic-bezier(.65,0,.35,1);

  --f-dela:"Dela Gothic One","Noto Sans JP","Hiragino Sans","Inter",sans-serif;
  --f-cjk:"Noto Sans SC","Noto Sans JP","PingFang SC","Hiragino Sans","Microsoft YaHei",sans-serif;
  --f-anton:"Anton","Inter",Impact,sans-serif;
  --gut:16px; --max:1320px; --tete:56px; --barre:0px;

  --noir:#0B0B0C; --noir-2:#161514; --creme:#F4EFE6; --gris:#9C978F; --filet-noir:#2A2826; --corail:#F0705A;
  --papier:#F2EDE3; --papier-2:#F8F4EC; --encre-m:#0E0D0C; --second:#5C5853;
  --jaune:#FFE600; --rouge:#E8322B; --moutarde:#F2C14E; --lagon:#0F5D6B;

  /* défaut : commun (papier, sans cases) */
  --fond:var(--papier); --surface:var(--papier-2); --encre:var(--encre-m); --texte-2:var(--second);
  --filet:#D6CEBF; --accent:var(--encre-m); --accent-texte:var(--encre-m); --point:var(--encre-m);
  --live:var(--encre-m); --mult:1;
}
:root[data-cote="pro"]{
  --fond:var(--noir); --surface:var(--noir-2); --encre:var(--creme); --texte-2:var(--gris);
  --filet:var(--filet-noir); --accent:var(--corail); --accent-texte:var(--corail); --point:var(--corail);
  --live:var(--corail); --mult:1.2; color-scheme:dark;
}
:root[data-cote="createur"]{
  --fond:var(--papier); --surface:var(--papier-2); --encre:var(--encre-m); --texte-2:var(--second);

}

}

   ========================================================================= */
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
body{

}
img,svg{ display:block; max-width:100%; }
img{ height:auto; }
a{ color:inherit; text-underline-offset:.18em; text-decoration-thickness:1px; }
button,input,select,textarea{ font:inherit; color:inherit; }

h1,h2,h3,h4,p,ul,ol,dl,dd,figure{ margin:0; }

[hidden]{ display:none!important; }

/* =========================================================================

   ========================================================================= */
.tete{ position:sticky; top:0; z-index:60; background:var(--fond); border-bottom:1px solid var(--filet); }
:root[data-cote="createur"] .tete{ border-bottom:3px solid var(--encre); }
.tete-in{ display:flex; align-items:center; gap:8px; height:var(--tete); width:min(100% - 2*var(--gut), var(--max)); margin-inline:auto; }
.marque{ display:flex; align-items:flex-end; flex:none; }
.marque-mot{ font-weight:800; font-size:23px; letter-spacing:-.035em; text-decoration:none; min-height:44px; display:inline-flex; align-items:center; line-height:1; }
:root[data-cote="createur"] .marque-mot{ text-transform:uppercase; letter-spacing:-.04em; }
.pt{ display:inline-flex; align-items:center; gap:10px; min-height:44px; min-width:44px; padding:0 10px 0 3px; text-decoration:none; color:var(--texte-2); font-size:13px; font-weight:500; white-space:nowrap; }
.pt-dot{ width:10px; height:10px; border-radius:50%; background:var(--point); display:inline-block; flex:none; transform:translateY(6px);

/* =========================================================================

.pal-in{ width:100%; min-height:56px; padding:0 18px; border:0; border-bottom:1px solid var(--filet); background:transparent; font-size:18px; outline:none; }
.pal-liste{ max-height:min(56vh, 440px); overflow:auto; padding:6px; }
.pal-liste li{ display:flex; justify-content:space-between; gap:12px; align-items:center; min-height:46px; padding:8px 12px; cursor:pointer; border-radius:3px; }
.pal-liste li span:last-child{ font-size:12px; color:var(--texte-2); }
.pal-liste li[aria-selected="true"]{ background:color-mix(in srgb, var(--encre) 10%, transparent); }
.pal-pied{ display:flex; justify-content:space-between; padding:10px 14px; border-top:1px solid var(--filet); font-size:12px; color:var(--texte-2); }

.sim-btn{ position:fixed; left:12px; bottom:calc(12px + var(--barre)); z-index:110; font:600 12px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:#E4E4E4; color:#1F1F1F; border:1px solid #B9B9B9; border-radius:6px; min-height:44px; padding:0 14px; letter-spacing:0; text-transform:none; }
.sim-btn:focus-visible{ outline:2px solid #1F1F1F; }
.sim{ position:fixed; left:12px; bottom:calc(64px + var(--barre)); z-index:111; width:min(380px, calc(100vw - 24px)); max-height:min(76vh, 760px); overflow:auto; background:#F1F1F1; color:#1F1F1F; border:1px solid #B9B9B9; border-radius:8px; padding:14px 16px 16px; box-shadow:0 14px 40px rgba(0,0,0,.25);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; letter-spacing:0; text-transform:none; }
.sim[hidden]{ display:none; }
.sim h2{ font:700 14px/1.3 inherit; margin:0 0 8px; }
.sim h3{ font:700 12px/1.3 inherit; text-transform:uppercase; letter-spacing:.06em; color:#555; margin:16px 0 6px; }
.sim label{ display:flex; justify-content:space-between; align-items:center; gap:10px; min-height:36px; }
.sim select,.sim input[type="range"]{ font:inherit; max-width:58%; }
.sim select{ background:#fff; color:#1F1F1F; border:1px solid #B9B9B9; border-radius:4px; min-height:32px; }
.sim button{ font:inherit; background:#fff; color:#1F1F1F; border:1px solid #B9B9B9; border-radius:4px; min-height:36px; padding:0 10px; }
.sim a{ color:#1F1F1F; }
.sim .sim-plan{ columns:2; column-gap:14px; font-size:12px; }
.sim .sim-plan a{ display:block; padding:3px 0; break-inside:avoid; }
.sim .sim-plan b{ display:block; margin-top:6px; break-after:avoid; }
.sim-mention{ margin-top:14px; padding-top:10px; border-top:1px solid #CFCFCF; font-size:12px; color:#555; }
.apercu{ position:fixed; inset:0; z-index:130; background:rgba(20,20,20,.86); display:grid; place-items:center; padding:20px; }
.apercu[hidden]{ display:none; }
.apercu iframe{ width:390px; max-width:100%; height:min(844px, calc(100vh - 90px)); border:1px solid #888; background:#fff; border-radius:18px; }
.apercu button{ margin-top:10px; font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; min-height:44px; padding:0 16px; border-radius:6px; border:1px solid #999; background:#eee; color:#111; }

.transition-lames{ position:fixed; inset:0; z-index:100; pointer-events:none; }
.transition-lames i{ position:absolute; left:0; right:0; height:50.5%; background:var(--encre-m); transform:translateY(-101%); }
.transition-lames i:last-child{ bottom:0; transform:translateY(101%); }
body.est-fige #vue,body.est-fige .tete-in > :not(.marque){ filter:saturate(.7); transition:filter 200ms linear; }
body.est-fige *{ animation-play-state:paused!important; }

/* reveals */
.rv-attente{ opacity:0; }
.rv-in[data-rv="carte"]{ animation:rv-carte calc(550ms * var(--mult)) var(--ease-arrivee) both; }
.rv-in[data-rv="case"]{ animation:rv-case calc(300ms * var(--mult)) var(--ease-arrivee) both; }
.rv-in[data-rv="balayage"]{ animation:balayage 600ms var(--ease-arrivee) both; }
.rv-in[data-rv="poing"]{ animation:poing 200ms var(--ease-arrivee) both; }
.rv-in[data-rv="fondu"]{ animation:fondu 400ms var(--ease-arrivee) both; }
@keyframes rv-carte{ from{ opacity:0; transform:translateY(34px) scale(.965); } to{ opacity:1; transform:none; } }
@keyframes rv-case{ from{ opacity:0; transform:scale(1.02); } to{ opacity:1; transform:none; } }
@keyframes balayage{ from{ opacity:1; clip-path:inset(0 100% 0 0); filter:blur(6px); } to{ opacity:1; clip-path:inset(0 0 0 0); filter:blur(0); } }
@keyframes poing{ 0%{ opacity:0; transform:scale(1); } 40%{ opacity:1; transform:scale(1.04); } 100%{ opacity:1; transform:scale(1); } }
@keyframes fondu{ from{ opacity:0; } to{ opacity:1; } }
.mot{ display:inline-block; white-space:pre; }
.titre-mots .mot{ animation:mot 140ms var(--ease-arrivee) both; animation-delay:calc(var(--i) * 56ms); }
@keyframes mot{ from{ opacity:0; filter:blur(8px); } to{ opacity:1; filter:blur(0); } }
.titre-balaye{ animation:balayage 600ms var(--ease-arrivee) both; }

/* mouvement réduit : tout devient un fondu de 120 ms ou un état immédiat */
[data-reduit="1"] *,[data-reduit="1"] *::before,[data-reduit="1"] *::after{ animation-duration:1ms!important; animation-delay:0ms!important; transition-duration:120ms!important; transition-delay:0ms!important; }
[data-reduit="1"] .rv-attente{ opacity:1; }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:1ms!important; animation-delay:0ms!important; transition-duration:120ms!important; transition-delay:0ms!important; scroll-behavior:auto!important; }
  .rv-attente{ opacity:1; }
}


/* =========================================================================
   12 bis. COMPLÉMENTS (W8, mémoire, grilles mobiles, fente, ancres)
   ========================================================================= */
[id]{ scroll-margin-top:calc(var(--tete) + 20px); }
.fente-attente > *{ transform:translateY(105%); }
[data-reduit="1"] .fente-attente > *{ transform:none; }
@media (prefers-reduced-motion:reduce){ .fente-attente > *{ transform:none; } }
:root[data-cote="createur"] .fiche dt{ border-right-color:var(--encre-m); }
.btn--k{ background:#3DDC84; color:#0D0F0E; border-color:#3DDC84; }
.btn--k:hover{ background:#5BE79A; border-color:#5BE79A; }
.rv-in[data-rv="tampon"]{ animation:tampon 160ms var(--ease-arrivee) both; }
@media (max-width:719px){
  .pl--2{ grid-template-columns:1fr 1fr; }
  .pl--2 > *{ grid-column:auto; }
  .pl--2 > .m2{ grid-column:1 / -1; }
  .k-pl > *{ grid-column:auto!important; }
}
@media (min-width:480px) and (max-width:719px){ .pl--prix{ grid-template-columns:1fr 1fr; } }
.w8-mot{ min-height:44px; padding:0 12px; border:1px solid #3A3734; background:transparent; color:var(--creme); border-radius:3px; font-size:16px; transition:color 160ms, border-color 160ms; }
.w8-mot:hover{ border-color:var(--corail); }
.w8-mot[aria-pressed="true"]{ text-decoration:line-through; text-decoration-color:var(--corail); color:var(--gris); border-style:dashed; }

.w8-clip{ flex:none; height:46px; border-radius:2px; position:relative; background:repeating-linear-gradient(90deg, #4A4541 0 2px, #2A2826 2px 5px); }
.w8-clip i{ position:absolute; left:0; top:-6px; bottom:-6px; width:2px; background:var(--corail); }
.mem-el{ padding:9px 12px; border:1px solid var(--filet); transition:background-color 200ms, border-color 200ms; }
.mem-el[data-etat="lit"]{ border-color:var(--corail); border-style:dashed; }
.mem-el[data-etat="ecrit"]{ border-color:var(--corail); background:color-mix(in srgb, var(--corail) 16%, transparent); }
.roles tbody tr{ cursor:default; transition:background-color 160ms; }
.roles tbody tr:hover,.roles tbody tr:focus{ background:color-mix(in srgb, var(--corail) 8%, transparent); outline:none; }
.roles tbody tr:focus-visible th{ box-shadow:inset 3px 0 0 var(--corail); }
.fs.roles td{ color:inherit; }
.fsv-options button[aria-pressed="true"]{ background:var(--corail); color:#0B0B0C; border-color:var(--corail); }

/* =========================================================================
   13. IMPRESSION (/pro/cv)
   ========================================================================= */
@media print{
  :root,:root[data-cote="pro"]{ --fond:#fff; --surface:#fff; --encre:#111; --texte-2:#444; --filet:#ccc; --accent:#111; --corail:#111; }
  body{ background:#fff!important; color:#111!important; padding:0!important; }
  body::before,.tete,.pied,.barre-basse,.sim-btn,.sim,.pal,.apercu,.no-print,.transition-lames{ display:none!important; }
  .bd{ border:1px solid #ccc; background:#fff; }
  .bd::before,.bd::after{ display:none; }
  a{ text-decoration:none; }
  .sec{ padding-block:18px; }
  .rv-attente{ opacity:1!important; }
  .fente-attente > *{ transform:none!important; }
  .titre-balaye{ animation:none!important; clip-path:none!important; filter:none!important; }
  .cv-bloc{ break-inside:avoid; }
}

<script>

  /* =======================================================================

  var mqReduit = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };

  var RELEVE = {
    itunes: K.live.sources.itunes.releveLe + 'T16:00:00',
    youtubeRss: K.live.sources.youtubeRss.releveLe + 'T17:20:00',
    deploiement: K.live.sources.deploiement.releveLe + 'T10:00:00',

  function etat(id) {

    var src = K.live.sources[id] || {};

  }
  function jourHorloge() {

    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  /* =======================================================================
     2. FR / EN (navigation au minimum ; le contenu reste en français)
     ======================================================================= */
  var I18N = {
    fr: { skip: 'Aller au contenu', menu: 'Menu', fermer: 'Fermer le menu', devis: 'Demander un devis', abonner: "S'abonner",

      '/now': 'Now', '/contact': 'Contact', '/a-propos': 'About', '/pro/apps': 'Apps', '/pro/agents': 'AI agents',
      '/pro/services': 'Services', '/pro/cv': 'Résumé', '/collaborer': 'Collaborer', navPro: 'Pro navigation', navCre: 'Creator navigation',

  };
  function L(k) { var d = I18N[S.langue] || I18N.fr; return d[k] != null ? d[k] : (I18N.fr[k] != null ? I18N.fr[k] : k); }

  /* =======================================================================
     3. COMPOSANTS COMMUNS
     ======================================================================= */
  function pastille(p) {

  function chiffre(c, cls) {

  function evtPour(url) {

      '<div style="margin-top:18px;border-top:2px solid #0E0D0C">' + A.items.map(function (it, k) {
        return '<label class="case-coche"><input type="checkbox" value="' + k + '"' + (S.coches[k] ? ' checked' : '') + '><div><b>' + t(it.titre) + '</b><p class="petit">' + t(it.texte) + (it.preuve ? ' <span class="muet">· ' + t(it.preuve) + '</span>' : '') + '</p></div></label>';
      }).join('') + '</div>' +
      '<p class="petit muet" style="margin-top:12px">' + pastille(A.statut) + '</p>' + trou(A.statut.aConfirmer) +
      '<section class="sec--serre" aria-labelledby="h-vli"><h2 id="h-vli" class="h3">Les vidéos liées</h2><ul class="ecm" style="margin-top:8px">' + vids.map(function (v) { return '<li><span class="cote-tag cote-tag--cre">YouTube</span><span>' + ext('https://www.youtube.com/watch?v=' + v.id, t(v.titre)) + ' <span class="petit muet">· ' + dt(v.date) + '</span></span></li>'; }).join('') + '</ul></section></div>';
  };

  VUES.k15ze = function () {
    var Z = K.createur.k15ze, C = Z.courses.elements;
    var promesse = t(Z.promesse.v).replace('plaisir', '<em class="k-mot">plaisir</em>');
    return '<div class="w">' +
      '<section class="k-ouv" aria-labelledby="h-k"><p class="surtitre" style="color:#9DA39F">' + t('Sport, nutrition, lifestyle') + '</p>' +
        '<h1 id="h-k" class="h-cre h1-cre" style="margin-top:12px">k15ze</h1>' +
        '<p style="font-size:clamp(1.4rem,1rem + 2vw,2.6rem);font-weight:700;line-height:1.15;max-width:26ch;margin-top:18px;letter-spacing:-.02em">' + promesse + '</p>' +
        '<p style="margin-top:16px;color:#9DA39F">' + t(Z.tonCopie) + '</p>' +
        '<div class="rangee" style="margin-top:26px">' + Z.liens.map(function (l) { return l.actif ? ext(l.url, t(l.label + ' — k15ze'), 'btn btn--k lien-ext') : '<span class="btn btn--ligne" aria-disabled="true">' + t(l.label) + ' · bientôt</span>'; }).join('') + '</div></section>' +
      '<section aria-label="Chiffres" class="k-pl">' + Z.chiffres.filter(visible).map(function (c, k) {
        return '<div class="k-case" style="grid-column:span ' + (k === 0 ? 5 : k === 1 ? 4 : 3) + '" data-rv="case">' + (function () { var m = String(c.v).match(/^([\d\s+≈.,\/]+)(.*)$/); return m ? '<p class="k-chiffre">' + t(m[1].trim()) + (m[2] ? ' <span style="font-family:var(--f-sans);font-size:.3em;font-weight:700;letter-spacing:0">' + t(m[2].trim()) + '</span>' : '') + '</p>' : '<p class="k-chiffre">' + t(c.v) + '</p>'; })() + '<p style="margin-top:8px">' + t(c.label) + '</p><p style="margin-top:6px">' + pastille(c) + '</p></div>';
      }).join('') + '</section>' + Z.chiffres.filter(function (c) { return !visible(c); }).map(function (c) { return trou(c.aConfirmer, c.label); }).join('') +
      '<section class="sec--serre grille-2" style="align-items:start"><div class="pile"><h2 class="h-cre h2-cre">Les formats</h2><ul class="pile-s">' + Z.formats.map(function (f) { return '<li>— ' + t(f) + '</li>'; }).join('') + '</ul></div>' +
        '<div class="pile"><h2 class="h-cre h2-cre">Les sujets</h2><ul class="rangee">' + Z.sujets.v.map(function (s) { return '<li style="border:1px solid #2A2F2C;padding:8px 12px">' + t(s) + '</li>'; }).join('') + '</ul><p>' + pastille(Z.sujets) + '</p></div></section>' +
      '<section class="sec--serre" aria-labelledby="h-shorts"><h2 id="h-shorts" class="h-cre h2-cre">Les derniers Shorts</h2><p style="margin-top:10px;color:#9DA39F">' + t('Les derniers Shorts s’afficheront ici dès que le flux de la chaîne sera branché.') + '</p>' + trou(K.live.sources.youtubeRss.aConfirmer) + '</section>' +
      '<section class="sec--serre" aria-labelledby="h-courses"><h2 id="h-courses" class="h-cre h2-cre" style="margin-bottom:18px">' + t(Z.courses.titre) + '</h2><div class="k-pl">' +
        '<article class="k-case" style="grid-column:span 6" data-rv="case"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' + C[0].images.slice(0, 2).map(function (im) { return '<div class="k-photo">' + image(im) + '</div>'; }).join('') + '</div>' +
          '<h3 class="h-cre" style="font-size:2rem;margin-top:16px">' + t(C[0].nom) + ' <span style="color:#9DA39F;font-size:.6em">' + t(C[0].lieu) + '</span></h3><p class="k-chiffre" style="font-size:44px;margin-top:6px">' + dt(C[0].date) + '</p><p>' + t(C[0].texte) + '</p>' +
          '<p class="petit" style="margin-top:10px;color:#9DA39F">Vidéo : « ' + t(C[0].video.titre) + ' » · ' + t(C[0].video.duree) + ' · ' + t(C[0].video.vues) + ' vues ' + pastille({ statut: 'observé', date: C[0].video.vuesLe }) + '</p>' + trou(C[0].video.aConfirmer) + trou(C[0].droits.aConfirmer, 'Photos') + '<p style="margin-top:8px">' + pastille(C[0]) + '</p></article>' +
        '<article class="k-case" style="grid-column:span 3" data-rv="case"><div class="k-photo">' + image(C[1].images[0]) + '</div><h3 class="h-cre" style="font-size:1.6rem;margin-top:14px">' + t(C[1].nom) + '</h3><p class="k-chiffre" style="font-size:40px">' + dt(C[1].date) + '</p><p>' + t(C[1].texte) + '</p>' + trou(C[1].droits.aConfirmer) + '<p style="margin-top:8px">' + pastille(C[1]) + '</p></article>' +
        '<article class="k-case" style="grid-column:span 3;display:grid;align-content:space-between" data-rv="case"><p class="h-cre" style="font-size:clamp(52px,7vw,96px)">' + t(C[2].nom) + '</p><div><p>Depuis le <span class="tnum">' + dt(C[2].date) + '</span></p><p style="margin-top:6px">' + t(C[2].texte) + '</p><p style="margin-top:8px">' + pastille(C[2]) + '</p></div></article>' +
      '</div></section>' + trou(Z.pontWado.aConfirmer, Z.pontWado.v) +
      '<p style="padding:20px 0 60px">' + int('/moi', '← Retour côté créateur', 'lien') + '</p></div>';
  };

  VUES.liens = function () {
    var R = K.ressources.liens, dv = K.live.derniereVideo, g = K.ressources.guides[0];
    return '<div class="w sec--serre" style="max-width:520px">' +
      '<p class="surtitre">Le lien en bio</p><h1 class="h-cre" data-sans-entree style="font-size:clamp(2.4rem,1rem + 8vw,3.6rem);margin-top:8px">' + t(CA.nomPublic.v) + '</h1>' +
      '<div class="pl" style="margin-top:18px;grid-template-columns:1fr">' + R.ordre.map(function (o) {
        if (o.type === 'derniereVideo') {
          if (etat('youtubeRss') === 'vide') return '<a class="cs cs--moutarde" href="#/itineraire/chine" data-event="guide_ouvert" style="text-decoration:none"><p class="surtitre">' + t(R.etatVide) + '</p></a>';
          return '<a class="cs cs--nu" href="https://www.youtube.com/watch?v=' + esc(dv.id) + '" target="_blank" rel="noopener" data-event="sortie_youtube" style="text-decoration:none;display:grid;grid-template-columns:120px 1fr;align-items:center">' + image(pays('chine').image, { alt: '', style: 'width:120px;height:100%;object-fit:cover;min-height:96px' }) + '<span style="padding:12px 14px"><span class="surtitre">Dernière vidéo</span><span style="display:block;font-weight:750;line-height:1.25;margin-top:4px">' + t(dv.titre) + '</span><span class="sr-only"> (nouvel onglet)</span></span></a>';
        }
        if (o.type === 'guideDuMoment') return '<a class="cs cs--jaune" href="#' + g.route + '" data-event="guide_ouvert" style="text-decoration:none"><span class="surtitre">Le guide du moment</span><span class="h-cre" style="display:block;font-size:1.5rem;margin-top:6px">' + t(g.titre) + '</span></a>';
        if (o.type === 'lien') return '<a class="cs" href="' + esc(o.url) + '" target="_blank" rel="noopener"' + (evtPour(o.url) ? ' data-event="' + evtPour(o.url) + '"' : '') + ' style="text-decoration:none;display:flex;justify-content:space-between;align-items:center;min-height:64px;padding-block:14px"><b style="font-size:1.1rem">' + t(o.label) + '</b><span aria-hidden="true">↗</span><span class="sr-only"> (nouvel onglet)</span></a>';
        if (o.type === 'route') return '<a class="cs" href="#' + o.route + '" style="text-decoration:none;display:flex;justify-content:space-between;align-items:center;min-height:64px;padding-block:14px"><b style="font-size:1.1rem">' + t(o.label) + '</b><span aria-hidden="true">→</span></a>';
        if (o.type === 'discret') return '<a class="cs" href="#' + o.route + '" style="text-decoration:none;background:#F2EDE3;min-height:52px;padding-block:12px;font-size:14px;color:#5C5853">' + t(o.label) + ' →</a>';
        return '';
      }).join('') + '</div></div>';
  };

  VUES.collaborer = function () {
    var M = K.mediaKit;
    var yt = CA.chiffres[5];
    monter(function () { brancherForm($('#form-collab'), { sansAssistant: true, succes: 'C’est envoyé. Je réponds en personne.' }); });
    return '<div class="w">' +
      '<section class="sec--serre" aria-labelledby="h-col"><p class="surtitre">Media kit</p><h1 id="h-col" class="h-cre h1-cre" style="font-size:clamp(2.6rem,1rem + 6vw,6rem);margin-top:10px">Collaborer</h1><p class="chapo" style="margin-top:14px;color:var(--encre)">' + t(M.promesse) + '</p></section>' +
      '<section aria-label="Fiche du personnage"><div class="pl">' +
        '<div class="cs cs--nu s4 trame" style="min-height:360px;background:#F2EDE3">' + image(K.identite.images.portraitCreateur, { alt: 'Kenz', style: 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 8%' }) + '<span class="tampon" style="position:absolute;left:14px;bottom:14px;background:#F8F4EC">Fiche du personnage</span></div>' +
        '<div class="cs s8"><dl class="fiche" style="--accent:#0E0D0C">' +
          [['Nom', 'Kenz'], ['Univers', t(CA.nomsDesComptes.youtube + ' · ' + CA.nomsDesComptes.tiktok + ' · ' + CA.nomsDesComptes.serie)], ['Zone', t(M.zone)], ['Sujets qui marchent', t(M.sujets.join(' · '))], ['Formats', t(M.formats.join(' · '))], ['Démographie', 'sur demande']].map(function (r) { return '<div><dt>' + r[0] + '</dt><dd>' + r[1] + '</dd></div>'; }).join('') +
        '</dl>' + trou(M.demographie.aConfirmer) + '</div></div></section>' +
      '<section class="sec--serre" aria-labelledby="h-aud"><h2 id="h-aud" class="h-cre h2-cre" style="margin-bottom:18px">L’audience, datée</h2><div class="pl">' + M.audience.map(function (a, k) {
        var corps = a.chiffres.length ? '<ul class="pile-s">' + a.chiffres.map(function (c) { return '<li>' + t(c) + '</li>'; }).join('') + '</ul>' : '<p>' + t(CA.etatPublication[2].v) + ' ' + pastille(CA.etatPublication[2]) + '</p>';
        return '<article class="cs s' + (k === 0 ? 5 : 4 - (k === 2 ? 1 : 0)) + (k === 0 ? ' cs--jaune' : '') + '" data-rv="case"><h3 class="h-cre" style="font-size:1.4rem">' + t(a.plateforme) + '</h3><div style="margin-top:10px">' + corps + '</div>' + (k === 1 ? '<div style="margin-top:12px">' + chiffre(yt) + '</div>' : '') + '</article>';
      }).join('') + '</div></section>' +
      '<section class="sec--serre grille-2" style="align-items:start"><div class="pile"><h2 class="h-cre h2-cre">Deux études de cas</h2>' + M.etudesDeCas.map(function (e) { return '<div class="cs" style="border:2px solid #0E0D0C"><h3 class="h3">' + t(e.titre) + '</h3><ul class="pile-s petit" style="margin-top:8px">' + e.preuves.map(function (p) { return '<li>— ' + t(p) + '</li>'; }).join('') + '</ul>' + (e.mediane ? trou(e.mediane.aConfirmer, 'Médiane ' + e.mediane.v) : '') + '</div>'; }).join('') + '</div>' +
        '<div class="pile"><h2 class="h-cre h2-cre">Formats intégrables</h2><div class="pl">' + M.formats.map(function (f) { return '<div class="cs s4 cs--moutarde" style="min-height:120px"><p class="h3">' + t(f) + '</p></div>'; }).join('') + '</div>' +
        '<h3 class="h3">État de publication, tel quel</h3><ul class="pile-s">' + CA.etatPublication.map(function (p) { return '<li><b>' + t(p.plateforme) + '</b> : ' + t(p.v) + ' ' + pastille(p) + '</li>'; }).join('') + '</ul>' +
        '<h3 class="h3">Garde-fous</h3><ul class="pile-s">' + M.gardeFous.map(function (g) { return '<li>— ' + t(g) + '</li>'; }).join('') + '</ul><p class="petit muet">' + t(M.partenariatsPasses.note) + '</p></div></section>' +
      '<section class="sec" aria-labelledby="h-fcol"><h2 id="h-fcol" class="h-cre h2-cre">Proposer une collab</h2>' +
        '<form class="form" id="form-collab" novalidate style="margin-top:22px">' +
          champ('m-marque', M.formulaire[0], 'text', { requis: true, auto: 'organization' }) +
          champ('m-format', M.formulaire[1], 'select', { options: M.formats.concat(['À définir ensemble']) }) +
          champ('m-periode', M.formulaire[2], 'text', { aide: 'Exemple : printemps 2027' }) +
          champ('m-budget', M.formulaire[3], 'text', {}) +
          champ('m-adresse', 'Adresse pour la réponse', 'email', { requis: true, auto: 'email' }) +
          champ('m-message', M.formulaire[4], 'textarea', { requis: true, min: 10 }) +
          '<div class="rangee"><button class="btn btn--encre" type="submit" data-event="collab_envoyee">Envoyer</button></div><div class="etat-zone" aria-live="polite"></div></form>' +
        trou(M.pdf.declencheur, 'PDF du media kit') + '</section>' +
      '</div>';
  };

  /* =======================================================================
     15. DÉMARRAGE
     ======================================================================= */
  window.addEventListener('hashchange', router);
  if (!location.hash || location.hash === '#') { try { history.replaceState(null, '', '#/'); } catch (e) { location.hash = '#/'; } }
  router();
})();
</script>
</body>
</html>
